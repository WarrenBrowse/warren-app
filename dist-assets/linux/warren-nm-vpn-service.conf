<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The system bus denies ownership of any name by default, so the plugin can
  only take its name if this policy grants it. Only root may own it or talk
  to it: NetworkManager spawns the plugin as root, and nobody else has any
  business impersonating it or driving it.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager.warren"/>
    <allow send_destination="org.freedesktop.NetworkManager.warren"/>
  </policy>
  <policy context="default">
    <deny own="org.freedesktop.NetworkManager.warren"/>
    <deny send_destination="org.freedesktop.NetworkManager.warren"/>
  </policy>
</busconfig>
