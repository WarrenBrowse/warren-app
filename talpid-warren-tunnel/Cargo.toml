[package]
name = "talpid-warren-tunnel"
edition.workspace = true
rust-version.workspace = true
description = "Warren adapter for the talpid tunnel state machine, on top of warren-tunnel (Quinn upstream)"
repository.workspace = true
license.workspace = true

[dependencies]
futures = { workspace = true }
ipnetwork = { workspace = true }
talpid-routing = { path = "../talpid-routing" }
talpid-tunnel = { path = "../talpid-tunnel" }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "io-util"] }
log = { workspace = true }

# `tun08` is the same `tun = 0.8.x` crate used by `talpid-tunnel`
# (default features to get async). Strict pin on the same version to
# avoid a diamond dependency between
# `talpid-tunnel::tun_provider::unix.rs` (which exposes
# `tun08::AsyncDevice` via `into_async_device`) and the
# `MullvadTunPacketDevice` adapter on the Warren side. warren-tunnel
# itself uses `tun-rs = 2`, so the adapter bridges the two.
tun08 = { package = "tun", version = "0.8.5", default-features = false, features = [
  "async",
] }

# Warren crates consumed as path-deps cross-repo. The expected
# warren-core checkout SHA is pinned in `.warren-core-version` at the
# warren-app repo root. Long-term the plan is to switch to a git
# submodule under `vendor/warren-core/` then to a private cargo registry
# (see docs/warren-app-quinn-migration-plan.md § "Sharing strategy").
warren-tunnel = { path = "../../warren-core/crates/warren-tunnel" }
warren-protocol = { path = "../../warren-core/crates/warren-protocol" }
# NAT-PMP client + RFC 6886 wire types. The client crate exposes the
# `refresh_loop` helper consumed by `mullvad-daemon::warren_nat_pmp` to
# keep the exit-side mapping alive. The protocol crate is pulled
# transitively but also re-exported here so daemon code references
# `talpid_warren_tunnel::NatPmpProto` without depending on warren-core
# directly.
warren-natpmp-client = { path = "../../warren-core/crates/warren-natpmp-client" }
warren-natpmp-protocol = { path = "../../warren-core/crates/warren-natpmp-protocol" }
# Multi-hop stack (M4.B/C/D/E.D) consumed by the dispatcher in
# `lib.rs` to spin up a `MultiHopSupervisor`-driven session when the
# user opts into multi-hop. Single-hop dispatch keeps using
# `warren_tunnel::ClientTunnel` directly.
warren-multihop = { path = "../../warren-core/crates/warren-multihop" }
warren-client = { path = "../../warren-core/crates/warren-client" }
warren-relay = { path = "../../warren-core/crates/warren-relay" }
warren-backoff = { path = "../../warren-core/crates/warren-backoff" }
warren-config = { path = "../../warren-core/crates/warren-config" }

# Stable per-install device identifier for the v2 device cap. Persisted
# under the daemon settings dir so reconnects / retries / restarts reuse
# ONE device lease instead of accruing phantom devices that trip
# MAX_DEVICES_PER_ACCOUNT and lock the user out of connecting.
mullvad-paths = { path = "../mullvad-paths" }
rand = { workspace = true }

# Ed25519 signing key carried in `WarrenTunnelParameters`. ed25519-dalek
# is also re-exported via `warren-relay-selector::warren_types` upstream
# warren-core, but we depend on it directly to avoid pulling the whole
# selector crate.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
  "std",
] }
anyhow = "1"

[dev-dependencies]
# Compile-time trait-implementation assertions used in the test module
# (e.g. `assert_not_impl_any!(WarrenTunnelParameters: Clone)`).
static_assertions = "1"

[lints]
workspace = true
