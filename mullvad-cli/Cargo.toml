[package]
name = "mullvad-cli"
edition.workspace = true
rust-version.workspace = true
description = "Manage the Warren VPN daemon from the command line"
repository.workspace = true
license.workspace = true

[package.metadata.winres]
ProductName = "Warren VPN"
CompanyName = "Warren contributors"
LegalCopyright = "(c) 2026 Warren contributors"
InternalName = "warren-cli"
OriginalFilename = "warren.exe"

# Warren rebrand Level A: installed binary `warren` instead of
# `mullvad`. The Cargo package name (`mullvad-cli`) is kept unchanged
# to ease upstream Mullvad rebases.
[[bin]]
name = "warren"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
mullvad-management-interface = { path = "../mullvad-management-interface" }
mullvad-types = { path = "../mullvad-types", features = ["clap"] }
mullvad-version = { path = "../mullvad-version" }
natord = "1.0.9"
serde = { workspace = true }
serde_json = { workspace = true }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
# `warren version` states the compiled environment and its API host without
# needing a daemon to answer.
warren-product-env = { path = "../warren-product-env" }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
clap_complete = { version = "4.4.8" }
nix = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.build-dependencies]
mullvad-version = { path = "../mullvad-version" }
winres = "0.1"

[target.'cfg(windows)'.build-dependencies.windows-sys]
workspace = true
features = [
  "Win32_System_SystemServices",
]

[lints]
workspace = true
