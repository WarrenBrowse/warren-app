# Cross config - edge image (GCC 11+, cmake, clang, lld) required by
# aws-lc-sys (dependency of the QUIC/TLS stack via tls-aws-lc-rs).
# Mirror of /Users/poka/dev/warrenBros/warren-core/Cross.toml.
#
# The additional `../warren-core` mount is required to resolve the
# cross-repo path-deps (= warren-tunnel, warren-relay-selector,
# warren-api-client, etc. consumed by mullvad-daemon via
# ../../warren-core/crates/...).

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge"
volumes = [
    "/Users/poka/dev/warrenBros/warren-core:/Users/poka/dev/warrenBros/warren-core",
]

[build]
default-target = "x86_64-unknown-linux-gnu"
