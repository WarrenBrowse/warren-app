# Cross config - edge image (GCC 11+, cmake, clang, lld) required by
# aws-lc-sys (dependency of the QUIC/TLS stack via tls-aws-lc-rs).
# Mirror of /Users/poka/dev/warrenBros/warren-core/Cross.toml.
#
# The additional sibling mounts are required to resolve the cross-repo
# path-deps: `../warren-core` only for `mullvad-daemon`'s dev-dependency
# `warren-api-server` (the real warren-api HTTP server, spawned in-process
# by the account-backend E2E tests to prove wire-compat; never a prod dep -
# see mullvad-daemon/Cargo.toml), `../warrenguard` for the client transport
# engine, `../warren-contract` for the SS58/DTO/discovery contract,
# `../warren-sdk-rs` for warren-identity and warren-api.
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge"
volumes = [
    "/Users/poka/dev/warrenBros/warren-core:/Users/poka/dev/warrenBros/warren-core",
    "/Users/poka/dev/warrenBros/warrenguard:/Users/poka/dev/warrenBros/warrenguard",
    "/Users/poka/dev/warrenBros/warren-contract:/Users/poka/dev/warrenBros/warren-contract",
    "/Users/poka/dev/warrenBros/warren-sdk-rs:/Users/poka/dev/warrenBros/warren-sdk-rs",
]

[build]
default-target = "x86_64-unknown-linux-gnu"
