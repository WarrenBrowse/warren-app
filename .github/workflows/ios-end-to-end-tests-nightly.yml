---
name: iOS end-to-end nightly tests
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  reuse-e2e-workflow:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/ios-end-to-end-tests.yml
    with:
      arg_tests_json_key: "nightly"
    secrets: inherit
