---
# Warren VPN - Linux flavours smoke
#
# Runs release.yml's sysvinit repack and NixOS flake jobs on demand, against a
# .deb built from THIS commit, so both can be exercised in the real Actions
# environment without cutting a release. The .deb comes from the same build as
# release.yml's `build-linux` (the Debian 11 job image, glibc 2.31 floor).
#
# It must be this commit's .deb: the repack pairs the payload with the
# maintainer scripts of the checkout, and a published .deb from an older
# release lacks whatever the scripts gained since (warren-include, added after
# 1.1.35, made the smoke fail on a binary the old payload never had).
#
# What it deliberately does NOT cover, because there is no release to talk to:
# `gh release download` from a draft and the upload of the finished artifacts.
# Those two only run on a real tag.
#
# Publishes nothing, touches no release.

name: Linux flavours - smoke

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Product environment to build the .deb for"
        type: choice
        default: beta
        options: [beta, prod]

permissions:
  contents: read

jobs:
  deb:
    name: Build this commit's .deb
    # Same image and build as release.yml's build-linux; the repack and the
    # install test need a Docker daemon, so they run in the next job.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/warrenbrowse/warren-ci-linux:bullseye-e03e4fc686d82f6b1cbea663ec9032c76960b5ee
      options: --user root
    # A container job's steps default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
      WARREN_PRODUCT_ENV: ${{ inputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ inputs.channel == 'beta' && 'https://api.beta.warrenbrowse.com' || 'https://api.warrenbrowse.com' }}

      - name: Build
        run: bash ci/run-with-runner-retry.sh timeout -k 60s 55m ./build.sh --optimize

      - name: Stage it under its release name
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < dist-assets/desktop-product-version.txt)"
          if [ "$WARREN_PRODUCT_ENV" = beta ]; then
            bash ci/stage-release-assets.sh linux "$version" beta
          else
            bash ci/stage-release-assets.sh linux "$version"
          fi
          ls -lh release-assets

      - uses: actions/upload-artifact@v6
        with:
          name: smoke-deb
          path: release-assets/*-linux-amd64.deb
          if-no-files-found: error
          retention-days: 1

  flavours:
    name: Repack and build against this commit's .deb
    needs: [deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: smoke-deb
          path: downloads

      - name: Resolve the artifact names of this channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          deb="$(cd downloads && ls -- *-linux-amd64.deb)"
          version="$(tr -d '[:space:]' < dist-assets/desktop-product-version.txt)"
          if [ "$CHANNEL" = beta ]; then
            base=https://api.beta.warrenbrowse.com/updates/desktop
          else
            base=https://api.warrenbrowse.com/updates/desktop
          fi
          {
            echo "WARREN_DEB=$deb"
            echo "WARREN_VERSION=$version"
            echo "WARREN_ASSET_BASE=$base"
          } >> "$GITHUB_ENV"
          echo "resolved $deb ($version)"

      - name: Repack it for sysvinit
        run: |
          bash ci/build-sysvinit-deb.sh \
            "downloads/$WARREN_DEB" \
            "out/${WARREN_DEB%.deb}-sysvinit.deb"

      - name: Install-test it on a systemd-less Debian
        run: |
          bash ci/test-sysvinit-deb.sh \
            "out/${WARREN_DEB%.deb}-sysvinit.deb" \
            "downloads/$WARREN_DEB"

      - name: Pin this build in the NixOS flake
        run: |
          bash ci/stage-nixos-flake.sh \
            "downloads/$WARREN_DEB" nixos-stage "$WARREN_VERSION" "$WARREN_ASSET_BASE"

      - name: Build the flake with nix and pack the tarball
        run: |
          prefix="${WARREN_DEB%%-"$WARREN_VERSION"-*}"
          bash ci/build-nixos-flake.sh \
            nixos-stage "downloads/$WARREN_DEB" \
            "out/${prefix}-${WARREN_VERSION}-linux-x86_64-nixos.tar.gz"

      - name: Report
        run: ls -lh out/
