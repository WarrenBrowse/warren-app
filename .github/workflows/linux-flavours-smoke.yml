---
# Warren VPN - Linux flavours smoke
#
# Runs the sysvinit repack and the NixOS flake build against the .deb that is
# ALREADY published on the beta update host, so the two release jobs can be
# exercised in the real Actions environment without cutting a release.
#
# What it proves that a local run cannot: that the `macstudio-docker` label
# selects a runner, that a checkout lands there, and that both script chains run
# under the Actions shell. What it deliberately does NOT cover, because there is
# no release to talk to: `gh release download` from a draft and the upload of
# the finished artifacts. Those two only run on a real tag.
#
# Publishes nothing, uploads nothing, touches no release.

name: Linux flavours - smoke

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel to take the published .deb from"
        type: choice
        default: beta
        options: [beta, prod]

# The repository is private, so the job token needs read access or the checkout
# 404s ("Repository not found") on a token that is simply not allowed to see it.
permissions:
  contents: read

jobs:
  smoke:
    name: Repack and build against the published .deb
    runs-on: [self-hosted, Linux, X64, docker, macstudio-docker]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve the published .deb of this channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = beta ]; then
            base=https://api.beta.warrenbrowse.com/updates/desktop
          else
            base=https://api.warrenbrowse.com/updates/desktop
          fi
          manifest="$(curl -fsSL "$base/downloads.json")"
          # The plain x64 .deb, named exactly: the channel also publishes an
          # arm64 .deb (this runner cannot install it) and the sysvinit repack of
          # the x64 one (repacking it again proves nothing). Both would win a
          # bare `select(.format == "deb") | head -1`, and the sysvinit repack
          # already did, because "amd64-sysvinit.deb" sorts before "amd64.deb".
          select='.platforms.linux.assets[]
                  | select(.format == "deb" and .architecture == "x64" and (has("flavor") | not))'
          url="$(printf '%s' "$manifest" | jq -r "$select | .url" | head -1)"
          sha="$(printf '%s' "$manifest" | jq -r "$select | .sha256" | head -1)"
          version="$(printf '%s' "$manifest" | jq -r '.platforms.linux.version')"
          [ -n "$url" ] && [ "$url" != null ] || { echo "::error::no .deb in $base/downloads.json"; exit 1; }
          {
            echo "WARREN_DEB_URL=$url"
            echo "WARREN_DEB_SHA=$sha"
            echo "WARREN_DEB=$(basename "$url")"
            echo "WARREN_VERSION=$version"
            echo "WARREN_ASSET_BASE=$base"
          } >> "$GITHUB_ENV"
          echo "resolved $(basename "$url") ($version)"

      - name: Download it
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fsSL -o "downloads/$WARREN_DEB" "$WARREN_DEB_URL"
          # The manifest states the checksum; a silent mismatch would make every
          # step below test the wrong bytes.
          echo "$WARREN_DEB_SHA  downloads/$WARREN_DEB" | sha256sum -c -

      - name: Repack it for sysvinit
        run: |
          bash ci/build-sysvinit-deb.sh \
            "downloads/$WARREN_DEB" \
            "out/${WARREN_DEB%.deb}-sysvinit.deb"

      - name: Install-test it on a systemd-less Debian
        run: |
          bash ci/test-sysvinit-deb.sh \
            "out/${WARREN_DEB%.deb}-sysvinit.deb" \
            "downloads/$WARREN_DEB"

      - name: Pin this release in the NixOS flake
        run: |
          bash ci/stage-nixos-flake.sh \
            "downloads/$WARREN_DEB" nixos-stage "$WARREN_VERSION" "$WARREN_ASSET_BASE"

      - name: Build the flake with nix and pack the tarball
        run: |
          prefix="${WARREN_DEB%%-"$WARREN_VERSION"-*}"
          bash ci/build-nixos-flake.sh \
            nixos-stage "downloads/$WARREN_DEB" \
            "out/${prefix}-${WARREN_VERSION}-linux-x86_64-nixos.tar.gz"

      - name: Report
        run: ls -lh out/
