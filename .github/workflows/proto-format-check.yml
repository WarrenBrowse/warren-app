---
name: Check formatting of proto files
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format for proto files
        uses: jidicula/clang-format-action@v4.11.0
        with:
          clang-format-version: 15
          include-regex: ^.*\.proto$
