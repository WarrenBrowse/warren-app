---
name: Unicop - find evil unicode
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  unicop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --depth=1 dist-assets/binaries
          git submodule update --init --depth=1 windows

      - name: Install Rust toolchain
        run: rustup override set stable

      - name: Install unicop
        run: cargo install --locked unicop

      - name: Check for unwanted unicode
        run: unicop --verbose .
