---
# Warren: reusable test suite (the single source of truth for "the Warren tests").
#
# Called by:
#   - warren-checks.yml  -> fast feedback on push to main/warren-base + PRs
#   - release.yml        -> preliminary gate that must pass BEFORE any build job
#                           runs on a version tag (tests-before-builds).
#
# Kept as a reusable workflow (workflow_call) so the test scope is defined once
# and can never drift between the push/PR gate and the release gate.

name: Warren tests (reusable)

on:
  workflow_call:

jobs:
  daemon-warren-tests:
    name: Daemon Warren crates (cargo test)
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    # Backstop so a wedged test/compile fails in minutes instead of sitting at
    # the GitHub 6h max and blocking a fleet runner. A healthy native-arm64 run
    # is ~3-4 min (the runner volume persists the cargo target cache), so 45 is
    # a generous ceiling.
    timeout-minutes: 45
    env:
      # Cap build parallelism so several fleet jobs can share the 16-core Colima
      # VM without thrashing (multiple macstudio-arm64 runners live on it).
      # Native arm64 has none of the x86-Rosetta jobserver-deadlock failure modes
      # the old runner needed retry guards for, so this is purely neighbourliness.
      CARGO_BUILD_JOBS: "6"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout the golden vectors submodule
        # The warren-forum suite replays vectors/forum_login_v1.json, the wire
        # contract shared with warren-connect, so the vectors submodule has to
        # be present. Only that one: the other submodules (the Mullvad
        # binaries, the Windows libraries, the Gradle plugin) are large and
        # nothing in this scope reads them. The token rides the first request
        # for the reason the build-env action gives for the sibling clones:
        # the fleet egresses through one IP and GitHub's anonymous throttle
        # answers a first unauthenticated request with a fatal error.
        env:
          ENGINE_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ENGINE_TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              submodule update --init vectors
          else
            git submodule update --init vectors
          fi
          test -f vectors/forum_login_v1.json

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
          # This job runs `cargo fmt --check` in addition to clippy, so the
          # toolchain needs the rustfmt component (the action installs only
          # clippy by default).
          rustup-components: clippy rustfmt

      - name: cargo fmt --check (Warren scope)
        # Gate fmt in addition to clippy/test to avoid style drifts
        # on the fork branch (= consistent with the warren-core ci.yml
        # workflow which also gates fmt).
        #
        # Scope to THIS repo's own crates, not `--all`: cargo fmt --all also
        # formats local path-based dependencies, which here are the pinned
        # sibling repos (../warrenguard, ../warren-sdk-rs, ../warren-contract).
        # Those are separate repos with their own fmt CI, and they are pinned at
        # fixed SHAs that can carry fmt drift already fixed upstream but not at
        # the pin, which would fail this gate on code that is not this fork's.
        # Explicit -p list of the Warren-scoped crates (same set as the test and
        # clippy steps below), so sibling path-deps are excluded. Same rationale
        # as the clippy --no-deps step below.
        run: |
          cargo fmt \
            -p mullvad-daemon -p mullvad-api -p mullvad-types \
            -p mullvad-management-interface -p mullvad-cli -p mullvad-paths \
            -p mullvad-setup \
            -p talpid-warren-tunnel -p talpid-core -p talpid-dns \
            -p warren-jni -p warren-ios -p warren-forum -p warren-product-env \
            -p mullvad-update -p mullvad-release \
            -- --check

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo test Warren scope
        # Targets the Warren-specific crates. We avoid --workspace so we do not
        # run Android / iOS / Windows specific tests on Linux (already covered by
        # upstream daemon.yml). Run via nextest with the `warren-ci` profile,
        # whose slow-timeout TERMINATES a test that blocks > 60s and names it.
        # cargo check warren-ios separately (cfg(target_os = "ios"), compile-only
        # on Linux). Native arm64: no Rosetta crash/deadlock retry needed; the
        # step timeout is the only backstop.
        #
        # mullvad-release consumes mullvad-update's release-metadata types but no
        # other job ever compiled it, so a field added to `Release` broke it while
        # main stayed green: it is the tool that signs and publishes the update
        # manifests, and the breakage would have surfaced at the next release. It
        # is platform-neutral and tiny (its deps are already built for
        # mullvad-update here), so it joins the existing scope rather than getting
        # a job of its own.
        #
        # warren-forum and warren-product-env are pure host-side Rust (the forum
        # request builder shared by the Android and iOS FFI crates, and the
        # compile-time product environment), each with its own unit suite. They
        # sat in the workspace and in the fmt scope while nothing ran their
        # tests: warren-jni only compiles them, so a broken forum test (the size
        # cap, the outcome envelopes) stayed green here. Same for clippy below.
        #
        # warren-ios was in exactly that position one step further along: this
        # step only `cargo check`ed it, so its host-runnable tests (the FFI
        # product-anchor table Swift dials, the corrected-clock report stamp)
        # ran nowhere. The iOS-gated modules of the crate are compiled by the
        # macOS job below, which builds it for the device target.
        #
        # mullvad-paths and mullvad-setup ran nowhere at all, in any scope. They
        # are where the per-environment runtime paths and the update dead-man
        # live, so a change that made two product environments share an RPC
        # socket, or that renamed a dead-man job, passed every gate. Their deps
        # are already built here (mullvad-daemon pulls both), so they cost a
        # compile of two small crates.
        timeout-minutes: 30
        run: |
          cargo nextest run --locked --profile warren-ci \
            -p mullvad-daemon -p mullvad-api -p mullvad-types \
            -p mullvad-management-interface -p mullvad-cli -p mullvad-paths \
            -p mullvad-setup \
            -p talpid-warren-tunnel -p talpid-core -p talpid-dns -p warren-jni \
            -p warren-forum -p warren-product-env -p warren-ios \
            -p mullvad-update -p mullvad-release

      - name: cargo clippy Warren scope
        # --no-deps: lint only these Warren crates, not their entire upstream
        # Mullvad dependency tree. Without it, clippy -D warnings also fails on
        # unrelated upstream crates (e.g. mullvad-relay-selector doc-style nits)
        # that are not part of the Warren surface and carry their own upstream CI.
        timeout-minutes: 20
        run: |
          crates="mullvad-daemon mullvad-api mullvad-cli talpid-warren-tunnel talpid-core talpid-dns"
          crates="$crates warren-jni warren-forum warren-product-env warren-ios"
          crates="$crates mullvad-paths mullvad-setup"
          crates="$crates mullvad-update mullvad-release"
          for crate in $crates; do
            cargo clippy --no-deps --locked -p "$crate" -- -D warnings
          done

  talpid-dns-macos:
    name: talpid-dns on macOS (cargo test)
    # talpid-dns picks its implementation by target, so on the Linux job above
    # the macOS DNS monitor compiles nowhere: it owns the host's resolver while
    # a tunnel is up and has stranded a Mac without DNS three times, each time
    # with its macOS tests never having run in CI. This job runs exactly that
    # crate on a macOS runner, and the reusable scope puts it in the release
    # gate as well.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: cargo test talpid-dns (macOS implementation)
        timeout-minutes: 20
        run: cargo test --locked -p talpid-dns

      - name: cargo clippy talpid-dns (macOS implementation)
        timeout-minutes: 10
        run: cargo clippy --no-deps --locked -p talpid-dns --all-targets -- -D warnings

      # warren-ios's FFI modules are `#![cfg(target_os = "ios")]`, so the Linux
      # job above compiles none of them: the whole forum login preflight (the
      # reqwest client, the SessionPreflight match, the corrected timestamp)
      # was compiled by nothing but a dispatch-only Xcode workflow. This is the
      # only leg with the iOS SDK, so it is where the device target belongs.
      - name: Add the iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: cargo check warren-ios (device target)
        timeout-minutes: 20
        run: cargo check --locked -p warren-ios --target aarch64-apple-ios

  desktop-warren-typecheck:
    name: Desktop Warren UI (type-check + lint)
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    # Backstop so a wedged npm/tsc/eslint can never sit on the shared runner
    # until the GitHub 6h max. A healthy run is ~2 min.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/packages/mullvad-vpn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: desktop/package.json
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: desktop
        run: npm ci

      # mullvad-vpn imports types from the sibling workspace packages
      # `windows-utils` and `nseventforwarder`, whose `.d.cts` are emitted
      # by their own `build-typescript` (pure tsc, no native build) into
      # `lib/`. Without this, `tsc --noEmit` fails with TS2307 (cannot find
      # module) on those imports.
      - name: Build workspace package types
        working-directory: desktop
        run: npm run build-typescript -w windows-utils -w nseventforwarder

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint (zero warnings)
        run: npm run lint

      # The desktop unit suite existed but nothing ran it: `frontend.yml` is
      # dispatch-only in this fork, so the only gate on the renderer and main
      # process logic was type-check + lint, neither of which observes
      # behaviour. It is a few seconds on top of an install this job already
      # does.
      - name: Unit tests (vitest)
        run: npm run test

      # Type-checking and linting both pass on a renderer bundle that throws on
      # load: 1.1.5 shipped exactly that and no desktop window could paint. This
      # checks the built artifact, which is the only place the failure is
      # visible without launching the app.
      - name: Renderer bundle carries no Node-only globals
        run: npm run verify:renderer-bundle

      - name: Verify messages.pot is up-to-date
        # If TS code calls pgettext/gettext without an update-translations
        # re-run being committed, this check breaks. Prevents
        # divergence between pot and source.
        shell: bash
        run: |
          npm run update-translations
          if ! git diff --quiet -- locales/messages.pot; then
            echo "::error::messages.pot is stale. Run npm run update-translations and commit."
            git --no-pager diff -- locales/messages.pot | head -50
            exit 1
          fi

      # The generator decides the installer URLs that go INSIDE the signed
      # update manifests, so a mistake there ships under a signature and cannot
      # be repaired by editing a served file. Gated on the release path because
      # release.yml needs this suite green before it builds anything.
      - name: Update-metadata generator unit tests
        working-directory: .
        shell: bash
        run: python3 ci/test_build_version_metadata.py

      # The macOS pkg scripts only ever run inside a real install, so a wrong
      # abort there is invisible until a user double-clicks the installer. It
      # shipped once: every FIRST install failed. Gated on the release path
      # because release.yml needs this suite green before it builds anything.
      - name: macOS pkg preinstall behaviour
        working-directory: .
        shell: bash
        run: scripts/ci/test-macos-pkg-preinstall.sh

      # `ci/git-config-global.sh` now fronts every `git config --global` of the
      # build-env action, on every OS, including the two that install the
      # WarrenBrowse token rewrites. A regression in its retry loop, its lock
      # grep or its stale-lock removal breaks the sibling checkouts and the
      # quinn fork fetch for every job in the fleet, and its own tests ran
      # nowhere: the script had to be typed by hand to be exercised at all. The
      # stale-lock arm, which deletes another process's lock after a minute, is
      # the branch most worth holding.
      - name: git config --global wrapper behaviour
        working-directory: .
        shell: bash
        run: bash ci/test-git-config-global.sh
