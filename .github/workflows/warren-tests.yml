---
# Warren: reusable test suite (the single source of truth for "the Warren tests").
#
# Called by:
#   - warren-checks.yml  -> fast feedback on push to main/warren-base + PRs
#   - release.yml        -> preliminary gate that must pass BEFORE any build job
#                           runs on a version tag (tests-before-builds).
#
# Kept as a reusable workflow (workflow_call) so the test scope is defined once
# and can never drift between the push/PR gate and the release gate.

name: Warren tests (reusable)

on:
  workflow_call:

jobs:
  daemon-warren-tests:
    name: Daemon Warren crates (cargo test)
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    # Hard ceiling: a hung test must fail the job in minutes, never sit at the
    # GitHub 6h max and block the serialized runner for everyone. A healthy run
    # is 6-11 min (the runner volume persists the cargo target cache), so 45 is
    # a generous backstop; the real anti-hang guard is the per-invocation
    # `timeout` in each cargo step below (a wedged compile is killed and retried
    # long before this ceiling, so the job self-heals instead of burning it).
    timeout-minutes: 45
    env:
      # Cap build parallelism. Under x86_64-Rosetta emulation the GNU jobserver
      # plus emulated rustc threads can DEADLOCK at high -j (a crashed rustc
      # never returns its jobserver token -> cargo waits on a free token
      # forever, 0% CPU). Fewer concurrent rustc = far lower deadlock odds, and
      # a healthy build stays well under 15 min on the 16-core VM. Paired with
      # the container reaper (docker --init) and the per-invocation `timeout`
      # retry, this makes the class of hang that wedged the runner impossible to
      # sit forever.
      CARGO_BUILD_JOBS: "6"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
          # This job runs `cargo fmt --check` in addition to clippy, so the
          # toolchain needs the rustfmt component (the action installs only
          # clippy by default).
          rustup-components: clippy rustfmt

      - name: cargo fmt --check (Warren scope)
        # Gate fmt in addition to clippy/test to avoid style drifts
        # on the fork branch (= consistent with the warren-core ci.yml
        # workflow which also gates fmt).
        run: cargo fmt --all -- --check

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo test Warren scope
        # Targets the Warren-specific crates. We avoid --workspace so we do not
        # run Android / iOS / Windows specific tests on Linux (already covered by
        # upstream daemon.yml). Run via nextest with the `warren-ci` profile,
        # whose slow-timeout TERMINATES a test that blocks > 60s and names it:
        # some upstream daemon tests hang under the x86_64-Rosetta sandbox (they
        # pass in seconds natively). cargo check warren-ios separately (it is
        # cfg(target_os = "ios"), compile-only on Linux).
        timeout-minutes: 30
        run: |
          # retry_flaky retries on the two Rosetta-emulation failure modes that
          # are NOT real errors:
          #   1. CRASH: rustc/cc1 intermittently SIGSEGVs on a random crate.
          #   2. HANG: the GNU jobserver deadlocks (a crashed rustc never returns
          #      its token -> cargo waits forever at 0% CPU). nextest's own
          #      `slow-timeout` only covers test EXECUTION, never the build, so
          #      wrap each invocation in `timeout`: a wedged compile is SIGKILLed
          #      (rc 124/137) and retried on a fresh jobserver instead of sitting
          #      until the job ceiling and blocking the runner for everyone.
          # A real compile error still fails immediately on the first pass.
          # 18m is ~2x a healthy full build, so it never fires on a slow-but-live
          # build; -k gives a live process a grace SIGTERM before the SIGKILL.
          retry_flaky() {
            for attempt in 1 2 3; do
              if timeout -k 60s 18m "$@" 2>&1 | tee /tmp/flaky-out.txt; then return 0; fi
              rc=${PIPESTATUS[0]}
              if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
                echo "::warning::cargo hung under Rosetta and was killed (attempt $attempt/3); retrying"
                continue
              fi
              if grep -qE "SIGSEGV|signal: 11|signal: 4|signal: 6|Illegal instruction" /tmp/flaky-out.txt; then
                echo "::warning::rustc crashed under Rosetta (attempt $attempt/3); retrying"
                continue
              fi
              return "$rc"
            done
            return 1
          }
          retry_flaky cargo nextest run --locked --profile warren-ci \
            -p mullvad-daemon -p mullvad-api -p mullvad-types \
            -p mullvad-management-interface -p mullvad-cli \
            -p talpid-warren-tunnel -p talpid-core -p warren-jni
          retry_flaky cargo check --locked -p warren-ios

      - name: cargo clippy Warren scope
        # --no-deps: lint only these Warren crates, not their entire upstream
        # Mullvad dependency tree. Without it, clippy -D warnings also fails on
        # unrelated upstream crates (e.g. mullvad-relay-selector doc-style nits)
        # that are not part of the Warren surface and carry their own upstream CI.
        timeout-minutes: 20
        run: |
          # clippy-driver crashes AND the jobserver can hang under Rosetta the
          # same way rustc does (see the test step); kill a wedged clippy with
          # `timeout` and retry on crash/hang, fail real lints immediately.
          retry_flaky() {
            for attempt in 1 2 3; do
              if timeout -k 60s 12m "$@" 2>&1 | tee /tmp/flaky-clippy.txt; then return 0; fi
              rc=${PIPESTATUS[0]}
              if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
                echo "::warning::clippy hung under Rosetta and was killed (attempt $attempt/3); retrying"
                continue
              fi
              if grep -qE "SIGSEGV|signal: 11|signal: 4|signal: 6|Illegal instruction" /tmp/flaky-clippy.txt; then
                echo "::warning::clippy-driver crashed under Rosetta (attempt $attempt/3); retrying"
                continue
              fi
              return "$rc"
            done
            return 1
          }
          for crate in mullvad-daemon mullvad-api mullvad-cli talpid-warren-tunnel talpid-core warren-jni; do
            retry_flaky cargo clippy --no-deps --locked -p "$crate" -- -D warnings
          done

  desktop-warren-typecheck:
    name: Desktop Warren UI (type-check + lint)
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    # Backstop so a wedged npm/tsc/eslint can never sit on the shared runner
    # until the GitHub 6h max. A healthy run is ~2 min.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/packages/mullvad-vpn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: desktop
        run: npm ci

      # mullvad-vpn imports types from the sibling workspace packages
      # `windows-utils` and `nseventforwarder`, whose `.d.cts` are emitted
      # by their own `build-typescript` (pure tsc, no native build) into
      # `lib/`. Without this, `tsc --noEmit` fails with TS2307 (cannot find
      # module) on those imports.
      - name: Build workspace package types
        working-directory: desktop
        run: npm run build-typescript -w windows-utils -w nseventforwarder

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Verify messages.pot is up-to-date
        # If TS code calls pgettext/gettext without an update-translations
        # re-run being committed, this check breaks. Prevents
        # divergence between pot and source.
        shell: bash
        run: |
          npm run update-translations
          if ! git diff --quiet -- locales/messages.pot; then
            echo "::error::messages.pot is stale. Run npm run update-translations and commit."
            git --no-pager diff -- locales/messages.pot | head -50
            exit 1
          fi
