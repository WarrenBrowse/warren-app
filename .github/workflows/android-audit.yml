---
name: Android - Audit dependencies
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: android-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Use custom container image if specified
        if: ${{ github.event.inputs.override_container_image != '' }}
        run: echo "inner_container_image=${{ github.event.inputs.override_container_image }}"
          >> $GITHUB_ENV

      - name: Use default container image and resolve digest
        if: ${{ github.event.inputs.override_container_image == '' }}
        run: echo "inner_container_image=$(cat ./building/android-container-image.txt)" >> $GITHUB_ENV

    outputs:
      container_image: ${{ env.inner_container_image }}

  ensure-clean-lockfile:
    needs: prepare
    name: Ensure clean lockfile
    runs-on: android-build
    container:
      image: ${{ needs.prepare.outputs.container_image }}
      volumes:
        # node is symlinked in, w/o mounting it, when using a image node won't be found for the
        # checkout action
        # https://github.com/NixOS/nixpkgs/issues/306373
        - /nix:/nix
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # Needed to run git diff later
      - name: Fix git dir
        run: git config --global --add safe.directory $(pwd)

      - name: Re-generate lockfile
        run: android/scripts/lockfile -u

      - name: Ensure no changes
        run: git diff --exit-code

  verify-lockfile-keys:
    needs: prepare
    name: Verify lockfile keys
    runs-on: android-build
    container:
      image: ${{ needs.prepare.outputs.container_image }}
      volumes:
        # node is symlinked in, w/o mounting it, when using a image node won't be found for the
        # checkout action
        # https://github.com/NixOS/nixpkgs/issues/306373
        - /nix:/nix
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify lockfile keys metadata
        run: android/scripts/lockfile -v
