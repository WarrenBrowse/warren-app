---
# Warren VPN - Release pipeline
#
# Builds Warren VPN installers for macOS (DMG/PKG), Linux (.deb + .rpm),
# Windows (MSI/NSIS) and Android (AAB/APK), and uploads them to a GitHub
# Release. Code signing is opt-in per platform: when the signing secrets are
# absent the jobs produce UNSIGNED builds (the current default, since Warren
# has no company/store accounts yet). iOS is disabled until an Apple Developer
# account exists (re-enable by setting the repo variable WARREN_ENABLE_IOS=true).
#
# Trigger: tag push matching v*.*.* (e.g., v1.0.0, v1.0.0-beta1).
#
# Required GitHub Secrets (configured at WarrenBrowse/warren-app repo Settings
# > Secrets and variables > Actions):
#
#   WARREN_CORE_RO_TOKEN
#     PAT with read access to WarrenBrowse/warren-core. Used by all build
#     jobs to checkout the path-dep sibling repo.
#
#   WARREN_CSC_LINK_MACOS, WARREN_CSC_KEY_PASSWORD_MACOS
#     macOS Developer ID Application certificate (.p12 base64-encoded) and
#     its password. The .p12 is decoded into a temp file during the job.
#
#   WARREN_NOTARIZE_KEYCHAIN, WARREN_NOTARIZE_KEYCHAIN_PROFILE
#     Apple notarytool credentials for stapling the .pkg installer.
#
#   WARREN_CSC_LINK_WIN, WARREN_CSC_KEY_PASSWORD_WIN
#     Windows Authenticode certificate (.pfx base64-encoded) and its password.
#     The .pfx is imported into the Windows cert store and the thumbprint is
#     resolved at runtime, then signtool references that thumbprint.
#
#   WARREN_UPDATE_SIGNING_KEY  (publish-update-metadata)
#     Dedicated, offline-generated Ed25519 secret (hex) that signs the
#     auto-update manifests. Its public key must match
#     `mullvad-update/warren-trusted-metadata-signing-pubkeys`. Generate with
#     `cargo run -p mullvad-release -- generate-key`. NEVER reuse the
#     relay/admin signing key. When unset, update metadata is not published.
#
#   WARREN_UPDATES_SSH_KEY / _HOST / _USER / _PATH  (publish-update-metadata)
#     SSH private key + target for scp'ing the signed `*.json` manifests to the
#     Hetzner/Caddy host that serves them (Let's Encrypt cert, matching the
#     client pin) at https://api.warrenbrowse.com/updates/desktop/. Values:
#     _USER=warren-deploy, _HOST=204.168.244.76 (the API VPS IP),
#     _PATH=/srv/warren-updates/desktop. When unset, the signed manifests are
#     only attached as a run artifact.
#
# Optional repository variable:
#   WARREN_UPDATE_MIN_VERSION
#     If set, becomes the manifest `minimum_supported_version`: clients older
#     than this are hard-blocked by the forced-update screen until they update.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  # Preliminary gate: the full Warren test suite (daemon cargo test/clippy/fmt +
  # desktop UI type-check/lint) must pass BEFORE any platform build runs. Every
  # build-* job `needs: [tests]`, so a red test skips all builds and the publish.
  # Same reusable suite as the push/PR warren-checks.yml (single source of truth).
  tests:
    uses: ./.github/workflows/warren-tests.yml
    secrets: inherit

  build-macos:
    name: Build macOS DMG/PKG
    needs: [tests]
    runs-on: [self-hosted, macOS, ARM64]
    env:
      WARREN_CSC_LINK_MACOS_B64: ${{ secrets.WARREN_CSC_LINK_MACOS }}
      WARREN_CSC_KEY_PASSWORD_MACOS: ${{ secrets.WARREN_CSC_KEY_PASSWORD_MACOS }}
      WARREN_NOTARIZE_KEYCHAIN: ${{ secrets.WARREN_NOTARIZE_KEYCHAIN }}
      WARREN_NOTARIZE_KEYCHAIN_PROFILE: ${{ secrets.WARREN_NOTARIZE_KEYCHAIN_PROFILE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays

      - name: Decode signing certificate
        if: env.WARREN_CSC_LINK_MACOS_B64 != ''
        run: |
          tmp=$(mktemp -t warren-csc-XXXXXX.p12)
          printf '%s' "$WARREN_CSC_LINK_MACOS_B64" | base64 -d > "$tmp"
          echo "WARREN_CSC_LINK_MACOS=$tmp" >> "$GITHUB_ENV"

      - name: Build (signed + notarized)
        if: env.WARREN_CSC_LINK_MACOS != ''
        run: ./build.sh --optimize --sign --notarize

      - name: Build (unsigned, signing assets missing)
        if: env.WARREN_CSC_LINK_MACOS == ''
        run: |
          echo "::warning::WARREN_CSC_LINK_MACOS secret not set; producing unsigned dev build."
          ./build.sh --optimize

      - name: Wipe signing certificate from runner
        if: always() && env.WARREN_CSC_LINK_MACOS != ''
        run: rm -f "$WARREN_CSC_LINK_MACOS" || true

      # Upload installers directly as GitHub Release assets instead of Actions
      # artifacts: release assets live in separate storage that is NOT subject to
      # the Actions artifact storage quota (which the artifact path kept hitting).
      - name: Publish macOS installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/WarrenVPN-*.dmg
            dist/WarrenVPN-*.pkg

  build-linux:
    name: Build Linux .deb/.rpm
    needs: [tests]
    # Routed to the Mac Studio x86_64 Rosetta container runner (macstudio-rosetta).
    # The Debian LXC runner stays registered but lacks this label, so it is no
    # longer selected for this job.
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    # Build C dependencies (tikv-jemalloc-sys, etc.) with clang, not gcc: under
    # the x86_64-Rosetta emulation gcc's cc1 intermittently SIGSEGVs mid-compile
    # ("internal compiler error: Segmentation fault ... cc1"), failing the build
    # nondeterministically. clang is stable under Rosetta (same fix warren-core
    # CI uses for its vendored-OpenSSL build). cc-rs honours CC/CXX for all C/C++
    # deps the Rust build shells out to.
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays

      - name: Verify Linux packaging deps (preinstalled on self-hosted runner)
        run: |
          # The self-hosted Linux runner is pre-provisioned (rpm, build toolchain).
          # No `sudo apt-get` here: the runner user has no passwordless sudo, and
          # `fpm` is not an apt package (the build packages .deb/.rpm itself).
          rpm --version

      - name: Build
        run: ./build.sh --optimize

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/WarrenVPN-*.deb
            dist/WarrenVPN-*.rpm
            dist/warren-vpn-daemon_*.deb
            dist/warren-vpn-daemon_*.rpm
          if-no-files-found: warn
          retention-days: 1

  build-windows:
    name: Build Windows MSI
    needs: [tests]
    runs-on: [self-hosted, Windows, X64]
    # Windows binaries are signed with Azure Trusted Signing (cloud HSM).
    # Since 1 June 2023 (CA/Browser Forum Code Signing Baseline Requirements),
    # OV/EV code-signing private keys must live on FIPS 140-2 hardware, so the
    # legacy "import a downloadable .pfx and sign by thumbprint" model no longer
    # works for newly issued public certificates. Trusted Signing keeps the key
    # in Azure and signs via signtool's dlib, so no key material ever touches
    # the runner. build.sh selects this path via WARREN_WIN_SIGN_BACKEND.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
    steps:
      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          rust-cache-targets: "true"
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays

      - name: Install Trusted Signing client (resolve signtool dlib)
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgRoot = Join-Path $env:RUNNER_TEMP "trusted-signing"
          New-Item -ItemType Directory -Force -Path $pkgRoot | Out-Null
          # Ensure nuget.exe is available (self-hosted runners may not ship it).
          $nuget = 'nuget'
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
            Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
          }
          # Azure.CodeSigning.Dlib.dll ships in the Microsoft.Trusted.Signing.Client package.
          & $nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $pkgRoot -Source https://api.nuget.org/v3/index.json
          $dlib = Get-ChildItem -Path $pkgRoot -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll not found under $pkgRoot" }
          "WARREN_TS_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV

      - name: Write Trusted Signing metadata
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = @{
            Endpoint               = $env:TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
            CertificateProfileName = $env:TRUSTED_SIGNING_PROFILE
          } | ConvertTo-Json
          $metaPath = Join-Path $env:RUNNER_TEMP "trusted-signing-metadata.json"
          $meta | Out-File -FilePath $metaPath -Encoding ascii
          "WARREN_TS_METADATA=$metaPath" >> $env:GITHUB_ENV
          "WARREN_WIN_SIGN_BACKEND=trusted-signing" >> $env:GITHUB_ENV

      - name: Build (signed via Trusted Signing)
        if: env.AZURE_CLIENT_ID != ''
        shell: bash
        run: ./build.sh --optimize --sign --universal

      - name: Build (unsigned, signing assets missing)
        if: env.AZURE_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::warning::AZURE_CLIENT_ID secret not set; producing unsigned dev build."
          ./build.sh --optimize --universal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/WarrenVPN-*.exe
            dist/WarrenVPN-*.msi
          if-no-files-found: warn
          retention-days: 1

  build-ios:
    name: Build iOS IPA + TestFlight upload
    # iOS is DISABLED for now: Warren has no Apple Developer account yet (it
    # requires a registered company + D-U-N-S number to open App Store Connect).
    # To RE-ENABLE iOS later, set the repository variable WARREN_ENABLE_IOS to
    # 'true' (Settings -> Secrets and variables -> Actions -> Variables tab).
    # No code change needed; publish-release already treats iOS as non-blocking.
    if: ${{ vars.WARREN_ENABLE_IOS == 'true' }}
    needs: [tests]
    runs-on: macos-15
    env:
      IOS_DISTRIBUTION_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
      IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
      IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORECONNECT_API_KEY_B64: ${{ secrets.APPSTORECONNECT_API_KEY_BASE64 }}
      APPSTORECONNECT_API_KEY_ID: ${{ secrets.APPSTORECONNECT_API_KEY_ID }}
      APPSTORECONNECT_API_ISSUER_ID: ${{ secrets.APPSTORECONNECT_API_ISSUER_ID }}
      APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup iOS project toolchain
        uses: ./.github/actions/ios/setup-project-toolchain

      - name: Decode signing cert + provisioning profile
        if: env.IOS_DISTRIBUTION_CERT_B64 != ''
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          tmp_cert=$(mktemp -t warren-ios-cert-XXXXXX.p12)
          tmp_prov=$(mktemp -t warren-ios-prov-XXXXXX.mobileprovision)
          printf '%s' "$IOS_DISTRIBUTION_CERT_B64" | base64 -d > "$tmp_cert"
          printf '%s' "$IOS_PROVISIONING_PROFILE_B64" | base64 -d > "$tmp_prov"
          security create-keychain -p "" warren-ios.keychain
          security default-keychain -s warren-ios.keychain
          security unlock-keychain -p "" warren-ios.keychain
          security import "$tmp_cert" -k warren-ios.keychain -P "$IOS_DISTRIBUTION_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" warren-ios.keychain
          cp "$tmp_prov" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "IOS_CERT_TMP=$tmp_cert" >> "$GITHUB_ENV"
          echo "IOS_PROV_TMP=$tmp_prov" >> "$GITHUB_ENV"

      - name: Archive WarrenVPN (signed)
        if: env.IOS_DISTRIBUTION_CERT_B64 != ''
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPN \
            -configuration Release \
            -archivePath build/WarrenVPN.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA (signed)
        if: env.IOS_DISTRIBUTION_CERT_B64 != ''
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_DEVELOPER_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/WarrenVPN.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Upload to TestFlight
        if: env.APPSTORECONNECT_API_KEY_B64 != ''
        run: |
          set -euo pipefail
          tmp_key=$(mktemp -t appstore-api-key-XXXXXX.p8)
          printf '%s' "$APPSTORECONNECT_API_KEY_B64" | base64 -d > "$tmp_key"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$tmp_key" ~/.appstoreconnect/private_keys/AuthKey_"$APPSTORECONNECT_API_KEY_ID".p8
          ipa_path=$(ls ios/build/ipa/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APPSTORECONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORECONNECT_API_ISSUER_ID"
          rm -f "$tmp_key" ~/.appstoreconnect/private_keys/AuthKey_"$APPSTORECONNECT_API_KEY_ID".p8

      - name: Build (unsigned, signing assets missing)
        if: env.IOS_DISTRIBUTION_CERT_B64 == ''
        working-directory: ios
        run: |
          echo "::warning::IOS_DISTRIBUTION_CERT_BASE64 secret not set; producing unsigned dev archive."
          xcodebuild archive \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPN \
            -configuration Release \
            -archivePath build/WarrenVPN.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Wipe signing material from runner
        if: always() && env.IOS_DISTRIBUTION_CERT_B64 != ''
        run: |
          security delete-keychain warren-ios.keychain || true
          [ -n "${IOS_CERT_TMP:-}" ] && rm -f "$IOS_CERT_TMP" || true
          [ -n "${IOS_PROV_TMP:-}" ] && rm -f "$IOS_PROV_TMP" || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-installers
          path: |
            ios/build/ipa/*.ipa
            ios/build/WarrenVPN.xcarchive
          if-no-files-found: warn
          retention-days: 1

  build-android:
    name: Build Android APK/AAB + Play Store internal-test upload
    # Android is a first-class release platform: it builds and publishes the APK
    # (attached to the GitHub Release by publish-release) on every version tag,
    # and it blocks the release like the desktop builds. Signing is opt-in: with
    # ANDROID_KEYSTORE_BASE64 set it produces a signed release APK + AAB and
    # uploads the AAB to the Play internal-test track; without it, an unsigned
    # debug APK is built and published (same opt-in model as the desktop builds).
    needs: [tests]
    runs-on: [self-hosted, macOS, ARM64]
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Raw service-account JSON (NOT base64): r0adkll/upload-google-play
      # expects the plain JSON via serviceAccountJsonPlainText.
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: ./.github/actions/mullvad-build-env
        with:
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          tmp=$(mktemp -t warren-android-keystore-XXXXXX.jks)
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$tmp"
          echo "WARREN_KEYSTORE_PATH=$tmp" >> "$GITHUB_ENV"
          echo "WARREN_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WARREN_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WARREN_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed AAB + APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew app:assembleRelease app:bundleRelease --parallel

      - name: Build unsigned AAB + APK
        if: env.ANDROID_KEYSTORE_B64 == ''
        working-directory: android
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; producing unsigned dev build."
          ./gradlew app:assembleDebug --parallel

      - name: Upload to Google Play internal-test
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_B64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.warrenbrowse.vpn
          releaseFiles: android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed

      - name: Wipe keystore from runner
        if: always() && env.ANDROID_KEYSTORE_B64 != ''
        run: |
          [ -n "${WARREN_KEYSTORE_PATH:-}" ] && rm -f "$WARREN_KEYSTORE_PATH" || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows, build-ios, build-android]
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    # Publish as long as it's a tag and the desktop builds (macOS/Linux/Windows)
    # AND Android all succeed. iOS stays non-blocking: it only builds when
    # WARREN_ENABLE_IOS is 'true', and is never required for the release.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success'
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p release-files
          find artifacts -type f \( \
            -name 'WarrenVPN-*.dmg' -o \
            -name 'WarrenVPN-*.pkg' -o \
            -name 'WarrenVPN-*.deb' -o \
            -name 'WarrenVPN-*.rpm' -o \
            -name 'WarrenVPN-*.exe' -o \
            -name 'WarrenVPN-*.msi' -o \
            -name 'warren-vpn-daemon_*.deb' -o \
            -name 'warren-vpn-daemon_*.rpm' -o \
            -name '*.ipa' -o \
            -name '*.aab' -o \
            -name '*.apk' \
          \) -exec cp {} release-files/ \;
          ls -lh release-files/ || true

      - name: Compute SHA-256 checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Warren VPN $TAG_NAME" \
            --notes-file CHANGELOG.md \
            --draft \
            release-files/*

  publish-update-metadata:
    name: Sign + publish update metadata
    needs: [publish-release]
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    # Signs the per-platform version manifests and serves them so existing apps
    # detect the new release. Gated on a signing key being present: without it
    # the whole step is a no-op (same opt-in philosophy as the build signing).
    #
    # The installer URLs inside the manifest point at the GitHub Release assets,
    # which only resolve once the DRAFT release created above is published.
    # Publish the GitHub Release before (or together with) flipping these
    # manifests live, otherwise clients see "update available" but the download
    # 404s. The forced-update floor is the repo variable WARREN_UPDATE_MIN_VERSION.
    if: >-
      !cancelled() &&
      needs.publish-release.result == 'success'
    env:
      TAG_NAME: ${{ github.ref_name }}
      WARREN_UPDATE_SIGNING_KEY: ${{ secrets.WARREN_UPDATE_SIGNING_KEY }}
      WARREN_UPDATES_SSH_KEY: ${{ secrets.WARREN_UPDATES_SSH_KEY }}
      WARREN_UPDATES_SSH_HOST: ${{ secrets.WARREN_UPDATES_SSH_HOST }}
      WARREN_UPDATES_SSH_USER: ${{ secrets.WARREN_UPDATES_SSH_USER }}
      WARREN_UPDATES_SSH_PATH: ${{ secrets.WARREN_UPDATES_SSH_PATH }}
      WARREN_UPDATE_METADATA_BASE: https://api.warrenbrowse.com/updates/desktop
      WARREN_UPDATE_MIN_VERSION: ${{ vars.WARREN_UPDATE_MIN_VERSION }}
    steps:
      - name: Skip if no signing key
        if: env.WARREN_UPDATE_SIGNING_KEY == ''
        run: echo "::warning::WARREN_UPDATE_SIGNING_KEY not set; skipping update metadata publish."

      - name: Checkout repository
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        uses: actions/checkout@v4

      - name: Set up build env (Rust + warren-core)
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        uses: ./.github/actions/mullvad-build-env
        with:
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Download installers from the release
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh release download "$TAG_NAME" --dir release-files --pattern 'WarrenVPN-*'
          ls -lh release-files

      - name: Build the metadata signer
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        run: cargo build --release -p mullvad-update --bin mullvad-version-metadata --features sign,client

      - name: Generate unsigned metadata
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        run: |
          version="${TAG_NAME#v}"
          python3 ci/build-version-metadata.py \
            --tag "$TAG_NAME" \
            --version "$version" \
            --release-dir release-files \
            --repo "$GITHUB_REPOSITORY" \
            --changelog CHANGELOG.md \
            --metadata-base-url "$WARREN_UPDATE_METADATA_BASE" \
            --out-dir unsigned \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ${WARREN_UPDATE_MIN_VERSION:+--min-version "$WARREN_UPDATE_MIN_VERSION"}

      - name: Sign metadata
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        run: |
          mkdir -p signed
          signer=target/release/mullvad-version-metadata
          for platform in macos windows linux android ios; do
            [ -f "unsigned/${platform}.json" ] || continue
            # The key is passed on argv: the runner is ephemeral and single-tenant
            # and GitHub masks the value in logs.
            "$signer" sign --file "unsigned/${platform}.json" --secret "$WARREN_UPDATE_SIGNING_KEY" \
              > "signed/${platform}.json"
          done
          ls -lh signed

      - name: Upload metadata to the update host
        if: env.WARREN_UPDATE_SIGNING_KEY != '' && env.WARREN_UPDATES_SSH_KEY != ''
        run: |
          key="$RUNNER_TEMP/updates_ssh_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$WARREN_UPDATES_SSH_KEY" > "$key"
          scp -i "$key" -o StrictHostKeyChecking=accept-new \
            signed/*.json \
            "${WARREN_UPDATES_SSH_USER}@${WARREN_UPDATES_SSH_HOST}:${WARREN_UPDATES_SSH_PATH}/"
          rm -f "$key"

      - name: Warn when upload is skipped
        if: env.WARREN_UPDATE_SIGNING_KEY != '' && env.WARREN_UPDATES_SSH_KEY == ''
        run: echo "::warning::Signed metadata built but WARREN_UPDATES_SSH_* not set; not uploaded (see the update-metadata artifact)."

      - name: Attach signed metadata to the run (audit + manual upload fallback)
        if: env.WARREN_UPDATE_SIGNING_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: update-metadata
          path: signed/*.json
          if-no-files-found: warn
