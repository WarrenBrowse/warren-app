---
# Warren VPN - Release pipeline
#
# Builds Warren VPN installers for macOS (DMG/PKG), Linux (.deb + .rpm +
# .pacman, for x86_64 and arm64, plus a sysvinit .deb and a NixOS flake),
# Windows (MSI/NSIS) and Android (AAB/APK), and uploads them to a GitHub
# Release. Code signing is opt-in per platform: when the signing secrets are
# absent the desktop jobs produce UNSIGNED builds (the current default, since
# Warren has no company/store accounts yet) and the Android job signs its
# release build with the runner's AGP debug key (see build-android), because
# an unsigned APK installs nowhere. iOS is disabled until an Apple Developer
# account exists (re-enable by setting the repo variable
# WARREN_ENABLE_IOS=true).
#
# The two Linux architectures are built by two jobs, each native:
# build-linux on ubuntu-24.04, build-linux-arm64 on ubuntu-24.04-arm, both in
# the Debian 11 build image. Nothing is cross-compiled.
#
# Every installer above 8 MiB also ships as a BitTorrent download: the
# metadata job writes a single-file .torrent beside it (web seeded on the
# update host, announced on tracker.opentrackr.org) and puts the magnet link
# on the asset's downloads.json entry, which is what the website renders. It
# is generated from the very bytes that were just hashed, so the magnet and
# the direct link can never name different content, and a rerun reproduces
# the same infohash. See ci/torrentlib.py.
#
# The two extra Linux artifacts cover distributions the deb/rpm/pacman set
# cannot reach, and neither recompiles anything: both consume the amd64 .deb
# the Linux job published to the draft release.
#
#   WarrenVPN-<ver>-linux-amd64-sysvinit.deb    MX Linux, antiX, Devuan
#     The systemd package leaves dpkg half-configured on a host with no
#     systemctl. This one ships LSB init scripts, a supervisor standing in for
#     Restart=always, and update-rc.d maintainer scripts. build-linux-sysvinit
#     installs, starts, crashes, stops and purges it inside a systemd-less
#     Debian before it is published.
#
#   WarrenVPN-<ver>-linux-x86_64-nixos.tar.gz   NixOS
#     A tarball flake pinning that release's .deb by URL and hash, with a
#     package that relinks it against the Nix store and a NixOS module
#     (services.warren-vpn). build-nixos runs a real `nix build` and evaluates
#     the module into a unit before it is published. See nix/warren-vpn/.
#
# Trigger: a tag push, whose shape picks the channel. A run builds and
# publishes exactly ONE channel, so a beta fix can never push an update to prod
# clients (workspace rule shared/rules/50-release-channels.md):
#
#   v*.*.*       prod: prod artifacts, api.warrenbrowse.com update manifests
#   beta-v*.*.*  beta: WARREN_PRODUCT_ENV=beta artifacts,
#                api.beta.warrenbrowse.com update manifests
#
# The two version series are independent (beta-v0.0.1 is legal while v1.16.2
# exists), so every version derivation strips the channel prefix and every
# per-channel step is gated on the channel resolved by tag-guard.
#
# Required GitHub Secrets (configured at WarrenBrowse/warren-app repo Settings
# > Secrets and variables > Actions):
#
#   WARREN_CORE_RO_TOKEN
#     PAT with read access to the WarrenBrowse org sibling repos (warrenguard,
#     warren-sdk-rs, warren-contract). Used by all build jobs to checkout the
#     path-dep sibling repos (the secret name is historical; the app no longer
#     depends on warren-core).
#
#   WARREN_CSC_LINK_MACOS, WARREN_CSC_KEY_PASSWORD_MACOS
#     macOS Developer ID Application certificate (.p12 base64-encoded) and
#     its password. The .p12 is decoded into a temp file during the job.
#
#   WARREN_NOTARIZE_KEYCHAIN, WARREN_NOTARIZE_KEYCHAIN_PROFILE
#     Apple notarytool credentials for stapling the .pkg installer.
#
#   WARREN_UPDATE_SIGNING_KEY  (publish-update-metadata)
#     Ed25519 secret (hex) that signs the auto-update manifests and the
#     desktop checksum list. Its public key must be listed in
#     `mullvad-update/warren-trusted-metadata-signing-pubkeys`. Only the
#     signing job of update-metadata.yml reads it, in a single step. NEVER
#     reuse the relay/admin signing key. When unset, update metadata is not
#     published.
#
#   WARREN_UPDATES_SSH_KEY / _HOST / _USER  (publish-update-metadata)
#     Deploy key and target of the update host's receiver
#     (ci/publish-to-update-host.sh), which serves the manifests and the
#     installers beside them. When unset, the signed manifests are only kept
#     as a run artifact.
#
# Optional repository variables:
#   WARREN_UPDATE_MIN_VERSION
#     If set, becomes the manifest `minimum_supported_version`: clients older
#     than this are hard-blocked by the forced-update screen until they update.
#     Applies to desktop and Android (Android bakes the desktop tag version).
#     Prod channel only: the beta series is independent (shared rule 2), so
#     the prod floor never reaches a beta manifest.
#   WARREN_UPDATE_MIN_VERSION_BETA
#     The same lever for the beta manifests, in the beta version series. Set
#     to 1.0.0 since 2026-09-03: the 0.0.x betas carry no forum-login intent
#     filter and were still listed as supported.
#   WARREN_UPDATE_MIN_VERSION_IOS
#     Same lever for ios.json, in the iOS calendar scheme (e.g. 2026.3). Keep
#     it set: without a minimum, clients fall back to "version listed in
#     releases", which would block iOS builds newer than the manifest.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'beta-v*.*.*'
  # Re-runs a release: dispatch it on the tag itself (`--ref beta-v1.2.3`).
  # From a branch, tag-guard refuses to start.
  workflow_dispatch:

# Read-only by default. The jobs that upload to the draft release, read it
# back (a draft is invisible to a read-only token) or publish it get
# `contents: write` of their own.
permissions:
  contents: read

jobs:
  # Preliminary gate: the full Warren test suite (daemon cargo test/clippy/fmt +
  # desktop UI type-check/lint) must pass BEFORE any platform build runs. A
  # release version IS its tag (the builds bake the tag version), so a
  # stale-tagged operator clone can ship a version REGRESSION: v1.9.1 was cut
  # while v1.11.0 was live because `git tag -l | tail` sorts lexicographically
  # (v1.10... sorts before v1.8...) and hid the real latest (2026-07-19). The
  # guard makes that mistake impossible: the pushed tag must be the strictly
  # highest version tag OF ITS OWN SERIES on origin or every build and publish
  # is skipped. The two series never sort together, so the beta line can start
  # at beta-v0.0.1 while the prod line sits at v1.16.2.
  tag-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
      api-url: ${{ steps.channel.outputs.api-url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the release channel and version from the tag
        id: channel
        run: |
          set -euo pipefail
          # The API host follows the channel here and nowhere else, so a job
          # can never bake one environment's exit list into the other's app.
          bash ci/resolve-release-channel.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      # The version guard below compares numbers only: a tag on a commit that
      # never reached main would otherwise be built, signed and served.
      - name: Refuse a tag on a commit main does not carry
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          bash ci/require-tag-on-main.sh "$GITHUB_SHA"
      # A release is defined by what it CONTAINS, and the guard below only ever
      # compared numbers. On 2026-08-08 `beta-v1.1.5` was cut from a `main`
      # carrying three unreviewed commits; one imported `electron` into the
      # sandboxed renderer, so no desktop window could paint at all. The version
      # was correct throughout. Printing the range does not block anything, it
      # puts the contents in the run's own log where the tagger and the next
      # reader both see them.
      - name: Show what this release contains
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WARREN_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          git fetch --tags --force origin
          if [ "$WARREN_CHANNEL" = beta ]; then pattern='beta-v[0-9]*'; else pattern='v[0-9]*'; fi
          previous=$(git tag -l "$pattern" | sort -V | grep -vFx "${GITHUB_REF_NAME}" | tail -1)
          if [ -z "$previous" ]; then
            echo "::notice::${GITHUB_REF_NAME} opens the $WARREN_CHANNEL series; no range to review"
            exit 0
          fi
          count=$(git log --oneline "$previous..${GITHUB_REF_NAME}" | wc -l | tr -d ' ')
          echo "### ${GITHUB_REF_NAME}: $count commit(s) since $previous" >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          git log --pretty='- `%h` %s (%an)' "$previous..${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "$count commit(s) since $previous:"
          git log --oneline "$previous..${GITHUB_REF_NAME}"

      # Shared with the headless pipeline, which cuts tags into the same version
      # space (an app release and a standalone CLI release must never both call
      # themselves 1.1.15 while being built from different commits).
      - name: Refuse a version-regressing release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WARREN_CHANNEL: ${{ steps.channel.outputs.channel }}
          WARREN_VERSION: ${{ steps.channel.outputs.version }}
        run: |
          git fetch --tags --force origin
          bash ci/check-release-version.sh "$WARREN_CHANNEL" "$WARREN_VERSION"

      # The GitHub release body, the in-app "What's new" and the signed
      # manifests all show the tag's notes, in three languages.
      - name: Refuse a release tag without release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WARREN_VERSION: ${{ steps.channel.outputs.version }}
        run: bash ci/require-release-notes.sh "$WARREN_VERSION"

      # A production release never ships unsigned nor on the beta debug key.
      - name: Refuse a production tag without every signing identity
        env:
          WARREN_CSC_LINK_MACOS: ${{ secrets.WARREN_CSC_LINK_MACOS }}
          WARREN_CSC_KEY_PASSWORD_MACOS: ${{ secrets.WARREN_CSC_KEY_PASSWORD_MACOS }}
          WARREN_NOTARIZE_KEYCHAIN_PROFILE: ${{ secrets.WARREN_NOTARIZE_KEYCHAIN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WARREN_UPDATE_SIGNING_KEY: ${{ secrets.WARREN_UPDATE_SIGNING_KEY }}
          WARREN_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: bash ci/require-signing-identities.sh "$WARREN_CHANNEL"

  # build-* job `needs: [tests]`, so a red test skips all builds and the publish.
  # Same reusable suite as the push/PR warren-checks.yml (single source of truth).
  tests:
    needs: [tag-guard]
    uses: ./.github/workflows/warren-tests.yml
    secrets:
      WARREN_CORE_RO_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}

  # The headless client (daemon + CLI, no GUI) ships on the SAME tag as the
  # app, always. It is the same daemon binary and the same version, so a CLI
  # release that lags the app is a second, invisible version of Warren running
  # on people's servers: warren-cli served a June build while the app shipped
  # weekly, and by the time the production API host was retired that build
  # pointed at a host answering 410.
  #
  # Coupling it here is what removes the "someone remembers to also tag
  # daemon-vX" step. publish-release requires this job, so an app release
  # cannot be published without its CLI counterpart. Cutting the CLI alone
  # stays possible: push a `daemon-v*` / `daemon-beta-v*` tag, which triggers
  # the same workflow directly.
  release-headless:
    name: Headless (daemon + CLI) release
    needs: [tag-guard, tests]
    uses: ./.github/workflows/release-daemon.yml
    with:
      channel: ${{ needs.tag-guard.outputs.channel }}
      version: ${{ needs.tag-guard.outputs.version }}
      api-url: ${{ needs.tag-guard.outputs.api-url }}
    secrets:
      WARREN_CORE_RO_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      WARREN_CLI_RELEASE_TOKEN: ${{ secrets.WARREN_CLI_RELEASE_TOKEN }}
      WARREN_UPDATE_SIGNING_KEY: ${{ secrets.WARREN_UPDATE_SIGNING_KEY }}

  build-macos:
    name: Build macOS DMG/PKG
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    needs: [tag-guard, tests]
    runs-on: [self-hosted, macOS, ARM64]
    # The universal build compiles the Rust workspace twice (the native aarch64
    # slice, then x86_64), and the second slice has no warm cache on a runner
    # that has only ever built the native one.
    timeout-minutes: 120
    env:
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
      WARREN_CSC_LINK_MACOS_B64: ${{ secrets.WARREN_CSC_LINK_MACOS }}
      WARREN_CSC_KEY_PASSWORD_MACOS: ${{ secrets.WARREN_CSC_KEY_PASSWORD_MACOS }}
      WARREN_NOTARIZE_KEYCHAIN: ${{ secrets.WARREN_NOTARIZE_KEYCHAIN }}
      WARREN_NOTARIZE_KEYCHAIN_PROFILE: ${{ secrets.WARREN_NOTARIZE_KEYCHAIN_PROFILE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.tag-guard.outputs.api-url }}

      - name: Decode signing certificate
        if: env.WARREN_CSC_LINK_MACOS_B64 != ''
        run: |
          tmp=$(mktemp -t warren-csc-XXXXXX.p12)
          printf '%s' "$WARREN_CSC_LINK_MACOS_B64" | base64 -d > "$tmp"
          echo "WARREN_CSC_LINK_MACOS=$tmp" >> "$GITHUB_ENV"

      # `--universal` is what makes the shipped pkg installable on Intel Macs.
      # Without it the runner (Apple Silicon) produces an arm64-only payload,
      # whose Distribution then carries hostArchitectures="arm64" and makes
      # Installer refuse every Intel Mac with "cannot be installed on this
      # computer". The name the asset is staged under, the update manifest that
      # serves it for x86 and the website all say universal, so the build is the
      # part that has to agree. `x86_64-apple-darwin` is installed for this by
      # the build-env action.
      - name: Build (signed + notarized)
        if: env.WARREN_CHANNEL == 'prod' && env.WARREN_CSC_LINK_MACOS != ''
        run: bash ci/build-with-retry.sh --optimize --universal --sign --notarize

      - name: Build (unsigned, signing assets missing)
        if: env.WARREN_CHANNEL == 'prod' && env.WARREN_CSC_LINK_MACOS == ''
        run: |
          echo "::warning::WARREN_CSC_LINK_MACOS secret not set; producing unsigned dev build."
          bash ci/build-with-retry.sh --optimize --universal

      - name: Stage release assets (harmonized names)
        if: env.WARREN_CHANNEL == 'prod'
        run: bash ci/stage-release-assets.sh macos "$WARREN_VERSION"

      # Beta channel: the separately-installable app compiled with
      # WARREN_PRODUCT_ENV=beta (own bundle id, product name, API host and
      # update channel; artifacts named WarrenVPN-Beta-*). Same signing
      # posture as the prod build.
      - name: Build beta (signed + notarized)
        if: env.WARREN_CHANNEL == 'beta' && env.WARREN_CSC_LINK_MACOS != ''
        env:
          WARREN_PRODUCT_ENV: beta
        run: bash ci/build-with-retry.sh --optimize --universal --sign --notarize

      - name: Build beta (unsigned, signing assets missing)
        if: env.WARREN_CHANNEL == 'beta' && env.WARREN_CSC_LINK_MACOS == ''
        env:
          WARREN_PRODUCT_ENV: beta
        run: bash ci/build-with-retry.sh --optimize --universal

      - name: Stage beta release assets
        if: env.WARREN_CHANNEL == 'beta'
        run: bash ci/stage-release-assets.sh macos "$WARREN_VERSION" beta

      - name: Wipe signing certificate from runner
        if: always() && env.WARREN_CSC_LINK_MACOS != ''
        run: rm -f "$WARREN_CSC_LINK_MACOS" || true

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        run: bash ci/release-asset-sums.sh record release-assets

      # Upload installers directly as GitHub Release assets instead of Actions
      # artifacts: release assets live in separate storage that is NOT subject to
      # the Actions artifact storage quota (which the artifact path kept hitting).
      - name: Publish macOS installers to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

  build-linux:
    name: Build Linux .deb/.rpm/.pacman
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    needs: [tag-guard, tests]
    # GitHub-hosted, inside the Debian 11 job image (glibc 2.31): the floor of
    # every Linux binary shipped to users, which ubuntu-24.04 itself (2.39)
    # would raise. Image: workspace scripts/ci-runners/Dockerfile.job. The
    # digest after the tag is what docker pulls, so a tag pushed again cannot
    # change the toolchain a release is built with; every workflow naming this
    # image carries the same digest.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/warrenbrowse/warren-ci-linux:bullseye-e03e4fc686d82f6b1cbea663ec9032c76960b5ee@sha256:51723886b8894945cab72fbf5c1d1becbbf755367c2cb1f3279108370f86ed70
      options: --user root
    # A container job's steps default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    timeout-minutes: 130
    # C dependencies (tikv-jemalloc-sys, etc.) are built with clang, as every
    # shipped x86_64 package has been since the Rosetta runners, whose gcc cc1
    # crashed mid-compile. cc-rs honours CC/CXX.
    env:
      CC: clang
      CXX: clang++
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.tag-guard.outputs.api-url }}

      - name: Verify Linux packaging deps (baked into the build image)
        run: |
          # The job image carries rpm and the build toolchain; electron-builder
          # brings its own fpm.
          rpm --version

      - name: Build
        if: env.WARREN_CHANNEL == 'prod'
        # Two Rosetta failure modes, both infra, and the classifier in
        # ci/run-with-runner-retry.sh tells them from a real compile error:
        # rustc/cc1 SIGSEGVs mid-compile on a random crate (a signature in the
        # log), or a zombie rustc keeps its jobserver token and cargo waits at
        # 0 % CPU printing NOTHING until something kills it (no signature at
        # all, only an exit code). The `timeout` is the backstop for a wedge the
        # zombie watchdog does not catch; 2 attempts at 55 min fit the job's
        # 130 min budget with a healthy build's headroom intact.
        env:
          WARREN_RETRY_ATTEMPTS: 2
        run: bash ci/run-with-runner-retry.sh timeout -k 60s 55m ./build.sh --optimize

      - name: Stage release assets (harmonized names)
        if: env.WARREN_CHANNEL == 'prod'
        run: bash ci/stage-release-assets.sh linux "$WARREN_VERSION"

      # Beta channel: WARREN_PRODUCT_ENV=beta build (own package name
      # warren-vpn-beta, own unit names, artifacts WarrenVPN-Beta-*).
      # Same runner-transient discipline as the prod build above.
      - name: Build beta
        if: env.WARREN_CHANNEL == 'beta'
        env:
          WARREN_PRODUCT_ENV: beta
          WARREN_RETRY_ATTEMPTS: 2
        run: bash ci/run-with-runner-retry.sh timeout -k 60s 55m ./build.sh --optimize

      - name: Stage beta release assets
        if: env.WARREN_CHANNEL == 'beta'
        run: bash ci/stage-release-assets.sh linux "$WARREN_VERSION" beta

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        run: bash ci/release-asset-sums.sh record release-assets

      # Publish straight to the GitHub Release (release-asset storage), which is
      # NOT subject to the Actions artifact storage quota that blocks
      # upload-artifact. Mirrors the macOS job; runs on every ref (draft keyed by
      # github.ref_name) so a v* tag run assembles the full multi-platform draft.
      - name: Publish Linux installers to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        continue-on-error: true
        with:
          name: linux-installers
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 1

  # The same three packages for 64-bit ARM (Raspberry Pi 4/5 and the ARM cloud
  # instances), built NATIVELY on GitHub's arm64 runners rather than
  # cross-compiled from x86_64: cross-compiling would need a second sysroot and
  # would leave the aarch64 packages built by a path nothing else exercises.
  build-linux-arm64:
    name: Build Linux arm64 .deb/.rpm/.pacman
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    needs: [tag-guard, tests]
    # GitHub-hosted, inside the Debian 11 job image (glibc 2.31): the floor of
    # every Linux binary shipped to users, which ubuntu-24.04 itself (2.39)
    # would raise. Image: workspace scripts/ci-runners/Dockerfile.job.
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/warrenbrowse/warren-ci-linux:bullseye-e03e4fc686d82f6b1cbea663ec9032c76960b5ee@sha256:51723886b8894945cab72fbf5c1d1becbbf755367c2cb1f3279108370f86ed70
      options: --user root
    # A container job's steps default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    timeout-minutes: 130
    env:
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
      # Several arm64 runners share one 16-core Colima VM, so cap the build
      # parallelism the way warren-tests.yml does. Neighbourliness, not safety.
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.tag-guard.outputs.api-url }}

      - name: Verify Linux packaging deps (baked into the build image)
        # rpm feeds fpm's rpm target; bsdtar (libarchive-tools, installed by the
        # build-env action) feeds the pacman one. electron-builder downloads its
        # own aarch64 fpm, so nothing here needs a system ruby.
        run: rpm --version

      - name: Build
        if: env.WARREN_CHANNEL == 'prod'
        # No TARGETS: the runner IS aarch64, so build.sh takes its local-target
        # path and electron-builder packages for the host architecture. That
        # names the artifacts _arm64.deb / _aarch64.rpm / _aarch64.pacman, which
        # ci/stage-release-assets.sh maps to the harmonized release names. The
        # retry wrapper absorbs an OOM kill of a rustc by the shared Colima VM.
        run: bash ci/run-with-runner-retry.sh timeout -k 60s 55m ./build.sh --optimize

      - name: Stage release assets (harmonized names)
        if: env.WARREN_CHANNEL == 'prod'
        run: bash ci/stage-release-assets.sh linux "$WARREN_VERSION"

      - name: Build beta
        if: env.WARREN_CHANNEL == 'beta'
        env:
          WARREN_PRODUCT_ENV: beta
        run: bash ci/run-with-runner-retry.sh timeout -k 60s 55m ./build.sh --optimize

      - name: Stage beta release assets
        if: env.WARREN_CHANNEL == 'beta'
        run: bash ci/stage-release-assets.sh linux "$WARREN_VERSION" beta

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        run: bash ci/release-asset-sums.sh record release-assets

      - name: Publish Linux arm64 installers to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        continue-on-error: true
        with:
          name: linux-arm64-installers
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 1

  # Two Linux distributions the .deb/.rpm/.pacman set does not reach, each
  # getting the artifact it can actually install. Both jobs consume the .deb
  # build-linux already published to the draft release, so neither recompiles
  # anything: they add minutes, not another hour of build. Both are amd64
  # only, by the artifact they name: the sysvinit distributions and the NixOS
  # flake target the x86_64 desktop, and neither script is arch-generic.
  #
  # Both need docker on the runner itself: a systemd-less Debian to install
  # into, and a nix container, which the build image cannot host.
  build-linux-sysvinit:
    name: Build Linux .deb (sysvinit)
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    needs: [tag-guard, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TAG_NAME: ${{ github.ref_name }}
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Resolve the artifact names of this channel
        run: |
          if [ "$WARREN_CHANNEL" = beta ]; then prefix=WarrenVPN-Beta; else prefix=WarrenVPN; fi
          {
            echo "WARREN_DEB=${prefix}-${WARREN_VERSION}-linux-amd64.deb"
            echo "WARREN_SYSVINIT_DEB=${prefix}-${WARREN_VERSION}-linux-amd64-sysvinit.deb"
          } >> "$GITHUB_ENV"

      - name: Download the Linux .deb from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download "$TAG_NAME" --dir downloads --pattern "$WARREN_DEB"
          ls -lh downloads

      - name: Repack it for sysvinit
        run: bash ci/build-sysvinit-deb.sh "downloads/$WARREN_DEB" "release-assets/$WARREN_SYSVINIT_DEB"

      # The failure this guards against is invisible until a user hits it: the
      # systemd package leaves dpkg half-configured on a host with no systemctl.
      # So the package is installed, started, crashed, restarted and purged for
      # real inside a systemd-less Debian.
      - name: Install-test it on a systemd-less Debian
        run: |
          bash ci/test-sysvinit-deb.sh \
            "release-assets/$WARREN_SYSVINIT_DEB" \
            "downloads/$WARREN_DEB"

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        run: bash ci/release-asset-sums.sh record release-assets

      - name: Publish it to the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

  build-nixos:
    name: Build NixOS flake
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    needs: [tag-guard, build-linux]
    runs-on: ubuntu-24.04
    # The first run on a fresh runner downloads the whole nixpkgs closure the
    # Electron dependencies pull in; later runs reuse the /nix docker volume.
    timeout-minutes: 90
    env:
      TAG_NAME: ${{ github.ref_name }}
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Resolve the artifact names and the pinned download host
        run: |
          if [ "$WARREN_CHANNEL" = beta ]; then
            prefix=WarrenVPN-Beta
            base=https://api.beta.warrenbrowse.com/updates/desktop
          else
            prefix=WarrenVPN
            base=https://api.warrenbrowse.com/updates/desktop
          fi
          {
            echo "WARREN_DEB=${prefix}-${WARREN_VERSION}-linux-amd64.deb"
            echo "WARREN_NIXOS_TARBALL=${prefix}-${WARREN_VERSION}-linux-x86_64-nixos.tar.gz"
            # The flake pins the update host, which serves every installer
            # beside the manifests, never the GitHub asset.
            echo "WARREN_ASSET_BASE=$base"
          } >> "$GITHUB_ENV"

      - name: Download the Linux .deb from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download "$TAG_NAME" --dir downloads --pattern "$WARREN_DEB"
          ls -lh downloads

      - name: Pin this release in the flake
        run: |
          bash ci/stage-nixos-flake.sh \
            "downloads/$WARREN_DEB" nixos-stage "$WARREN_VERSION" "$WARREN_ASSET_BASE"

      # A flake that only evaluates proves nothing: what breaks when packaging a
      # prebuilt Electron app on NixOS is a shared library nobody provides, and
      # that only shows up once the binaries are relinked. So the package is
      # built, its binaries are run out of the store, and the NixOS module is
      # evaluated into a real unit before anything is published.
      - name: Build it with nix and pack the published tarball
        run: |
          bash ci/build-nixos-flake.sh \
            nixos-stage "downloads/$WARREN_DEB" "release-assets/$WARREN_NIXOS_TARBALL"

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        run: bash ci/release-asset-sums.sh record release-assets

      - name: Publish it to the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

  build-windows:
    name: Build Windows MSI
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    needs: [tag-guard, tests]
    # Built natively on a GitHub-hosted Windows runner (free for a public
    # repo) by ci/codemagic/windows-release.sh, each phase under the step
    # watchdog. A fresh VM for every build and no restored build cache, so no
    # intermediate of another channel can reach a release (the beta-v1.1.9
    # winfw.dll carried prod WFP keys through a restored cache).
    #
    # Windows binaries are signed with Azure Trusted Signing (cloud HSM) once
    # AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
    # TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT and
    # TRUSTED_SIGNING_PROFILE reach the build's environment; since 1 June 2023
    # an OV/EV code-signing key must live on FIPS 140-2 hardware, so the
    # downloadable-.pfx model no longer works. None is set today and the
    # installers ship unsigned; the job hands them to the build the day they
    # exist, and a prod tag is refused without them (tag-guard).
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      WARREN_SHA: ${{ github.sha }}
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
      WARREN_API_URL: ${{ needs.tag-guard.outputs.api-url }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: ./.github/actions/windows-build
        with:
          script: ci/codemagic/windows-release.sh
          phases: prepare sources build stage
          out-dir: release-assets

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        shell: bash
        run: bash ci/release-asset-sums.sh record release-assets

      # Release-asset storage is not subject to the Actions artifact quota (see
      # the Linux job). Publish the installer straight to the draft release.
      - name: Publish Windows installers to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        continue-on-error: true
        with:
          name: windows-installers
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 1

  build-ios:
    name: Build iOS IPA + TestFlight upload
    # Dormant until Warren has an Apple Developer account (App Store Connect
    # needs a registered company and a D-U-N-S number). Setting the repository
    # variable WARREN_ENABLE_IOS to 'true' turns it on; publish-release treats
    # iOS as non-blocking either way.
    #
    # Built the way ios-checks.yml builds on every push, so turning it on does
    # not meet a step nobody ran: macos-26 with the image's Xcode (App Store
    # Connect refuses uploads made with an SDK older than iOS 26), the pinned
    # sibling engines, the vectors submodule alone (the recursive checkout
    # reaches git.netfilter.org, which no hosted runner can).
    #
    # Both channels: the tag picks WARREN_PRODUCT_ENV, which suffixes the
    # bundle ids and the App Group (ios/Configurations/ProductEnv.xcconfig).
    # Each channel signs with its own two profiles, one for the app and one for
    # the packet tunnel extension; the beta secrets carry a _BETA suffix:
    #   IOS_DISTRIBUTION_CERT_BASE64, IOS_DISTRIBUTION_PASSWORD
    #   IOS_APP_PROVISIONING_PROFILE_BASE64[_BETA]
    #   IOS_TUNNEL_PROVISIONING_PROFILE_BASE64[_BETA]
    #   APPLE_DEVELOPER_TEAM_ID
    #   APPSTORECONNECT_API_KEY_BASE64, _ID, APPSTORECONNECT_API_ISSUER_ID
    # Without the certificate, the team id and the channel's two profiles, a
    # beta tag skips the build with a notice and a production tag is refused
    # (ci/ios-signing-ready.sh).
    if: ${{ vars.WARREN_ENABLE_IOS == 'true' }}
    needs: [tag-guard, tests]
    runs-on: macos-26
    timeout-minutes: 120
    env:
      WARREN_PRODUCT_ENV: ${{ needs.tag-guard.outputs.channel }}
      SOURCE_PACKAGES_PATH: .spm
      IOS_DISTRIBUTION_CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
      IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
      # Each channel's profiles under their own name: an `a && b || c`
      # expression would hand a beta build the production profiles whenever
      # the beta ones are absent.
      IOS_APP_PROFILE_PROD_B64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
      IOS_TUNNEL_PROFILE_PROD_B64: ${{ secrets.IOS_TUNNEL_PROVISIONING_PROFILE_BASE64 }}
      IOS_APP_PROFILE_BETA_B64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64_BETA }}
      IOS_TUNNEL_PROFILE_BETA_B64: ${{ secrets.IOS_TUNNEL_PROVISIONING_PROFILE_BASE64_BETA }}
      APPSTORECONNECT_API_KEY_B64: ${{ secrets.APPSTORECONNECT_API_KEY_BASE64 }}
      APPSTORECONNECT_API_KEY_ID: ${{ secrets.APPSTORECONNECT_API_KEY_ID }}
      APPSTORECONNECT_API_ISSUER_ID: ${{ secrets.APPSTORECONNECT_API_ISSUER_ID }}
      APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          submodules: false

      - name: Decide whether this channel can sign
        id: signing
        run: |
          set -euo pipefail
          bash ci/ios-signing-ready.sh "$WARREN_PRODUCT_ENV" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout the golden vectors submodule
        if: steps.signing.outputs.ready == 'true'
        env:
          ENGINE_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ENGINE_TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              submodule update --init vectors
          else
            git submodule update --init vectors
          fi

      - if: steps.signing.outputs.ready == 'true'
        uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
          product-env: ${{ needs.tag-guard.outputs.channel }}

      - name: Setup iOS project toolchain
        if: steps.signing.outputs.ready == 'true'
        uses: ./.github/actions/ios/setup-project-toolchain
        with:
          ios_rust_target: aarch64-apple-ios
          xcode_version: ''

      - name: Install the signing certificate and both provisioning profiles
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          channel=$(printf '%s' "$WARREN_PRODUCT_ENV" | tr '[:lower:]' '[:upper:]')
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          tmp_cert=$(mktemp -t warren-ios-cert-XXXXXX.p12)
          printf '%s' "$IOS_DISTRIBUTION_CERT_B64" | base64 -d > "$tmp_cert"
          security create-keychain -p "" warren-ios.keychain
          security default-keychain -s warren-ios.keychain
          security unlock-keychain -p "" warren-ios.keychain
          security import "$tmp_cert" -k warren-ios.keychain -P "$IOS_DISTRIBUTION_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" warren-ios.keychain
          rm -f "$tmp_cert"
          # Each profile is installed under its UUID and handed to the build by
          # its Name, which the export options map to its bundle id below.
          for role in APP TUNNEL; do
            var="IOS_${role}_PROFILE_${channel}_B64"
            tmp_prov=$(mktemp -t warren-ios-prov-XXXXXX.mobileprovision)
            printf '%s' "${!var}" | base64 -d > "$tmp_prov"
            security cms -D -i "$tmp_prov" > "$tmp_prov.plist"
            uuid=$(plutil -extract UUID raw -o - "$tmp_prov.plist")
            name=$(plutil -extract Name raw -o - "$tmp_prov.plist")
            cp "$tmp_prov" "$profiles/$uuid.mobileprovision"
            rm -f "$tmp_prov" "$tmp_prov.plist"
            echo "IOS_${role}_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          done

      # The app and the extension each need their own profile, so the name
      # goes into each target's configuration: a PROVISIONING_PROFILE_SPECIFIER
      # on the command line would apply one profile to every target.
      - name: Name the profiles in the generated target configurations
        if: steps.signing.outputs.ready == 'true'
        working-directory: ios/Configurations
        run: |
          set -euo pipefail
          printf 'PROVISIONING_PROFILE_SPECIFIER[config=Release] = %s\n' "$IOS_APP_PROFILE_NAME" >> App.xcconfig
          printf 'PROVISIONING_PROFILE_SPECIFIER[config=Release] = %s\n' "$IOS_TUNNEL_PROFILE_NAME" >> PacketTunnel.xcconfig

      - name: Archive WarrenVPN (signed)
        if: steps.signing.outputs.ready == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPN \
            -configuration Release \
            -archivePath build/WarrenVPN.xcarchive \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            WARREN_PRODUCT_ENV="$WARREN_PRODUCT_ENV" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM_ID" \
            CODE_SIGN_STYLE=Manual 2>&1 | xcbeautify

      - name: Export IPA (signed)
        if: steps.signing.outputs.ready == 'true'
        working-directory: ios
        run: |
          set -euo pipefail
          case "$WARREN_PRODUCT_ENV" in
            prod) suffix= ;;
            *) suffix=".$WARREN_PRODUCT_ENV" ;;
          esac
          app_id="com.warrenbrowse.vpn.ios${suffix}"
          plist=build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_DEVELOPER_TEAM_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$plist"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$app_id string $IOS_APP_PROFILE_NAME" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$app_id.PacketTunnel string $IOS_TUNNEL_PROFILE_NAME" "$plist"
          plutil -lint "$plist"
          xcodebuild -exportArchive \
            -archivePath build/WarrenVPN.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$plist"

      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true' && env.APPSTORECONNECT_API_KEY_B64 != ''
        run: |
          set -euo pipefail
          tmp_key=$(mktemp -t appstore-api-key-XXXXXX.p8)
          printf '%s' "$APPSTORECONNECT_API_KEY_B64" | base64 -d > "$tmp_key"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$tmp_key" ~/.appstoreconnect/private_keys/AuthKey_"$APPSTORECONNECT_API_KEY_ID".p8
          ipa_path=$(find ios/build/ipa -name '*.ipa' | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa_path" \
            --apiKey "$APPSTORECONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORECONNECT_API_ISSUER_ID"
          rm -f "$tmp_key" ~/.appstoreconnect/private_keys/AuthKey_"$APPSTORECONNECT_API_KEY_ID".p8

      - name: Wipe signing material from runner
        if: always() && steps.signing.outputs.ready == 'true'
        run: |
          security delete-keychain warren-ios.keychain || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision

      - name: Upload iOS artifacts
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ios-installers
          path: |
            ios/build/ipa/*.ipa
            ios/build/WarrenVPN.xcarchive
          if-no-files-found: warn
          retention-days: 1

  build-android:
    name: Build Android APK/AAB + Play Store internal-test upload
    permissions:
      contents: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    # Android is a first-class release platform: it builds and publishes the APK
    # (attached to the GitHub Release by publish-release) on every version tag,
    # and it blocks the release like the desktop builds. Signing is opt-in: with
    # ANDROID_KEYSTORE_BASE64 set it produces a signed release APK + AAB and
    # uploads the AAB to the Play internal-test track; without it, the same
    # release build type is signed with the runner's AGP debug key and the
    # signer is asserted against android/fallback-signer.sha256 (rationale:
    # android/docs/BuildInstructions.md, "Release build without a keystore").
    needs: [tag-guard, tests]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Raw service-account JSON (NOT base64): r0adkll/upload-google-play
      # expects the plain JSON via serviceAccountJsonPlainText.
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          submodules: recursive

      # checkout's `clean` stops at the superproject. On this persistent runner a
      # submodule dropped upstream (dist-assets/binaries/wireguard-nt, beta-v1.1.41)
      # stays on disk as untracked files, and releasePreflight refuses the dirty tree.
      - name: Remove untracked files left in submodules
        run: git submodule foreach --recursive --quiet git clean -ffdxq

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          # The action's default is `tools platform-tools`, and the legacy
          # `tools` package is gone from Google's repository: sdkmanager answers
          # "Failed to find package 'tools'" and the step fails before a single
          # line is built. `android-checks.yml` was fixed for it on 2026-09-17
          # and this job was not, so it took the first release tag cut after
          # that date (beta-v1.1.31) down before build-android started.
          # `cmdline-tools` replaced it and the action installs it by itself.
          packages: platform-tools

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          tmp=$(mktemp -t warren-android-keystore-XXXXXX.jks)
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$tmp"
          {
            echo "WARREN_KEYSTORE_PATH=$tmp"
            echo "WARREN_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "WARREN_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "WARREN_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # The beta app packs its own versionCode from the tag
      # (ci/android-beta-version-code.sh). A device holding a beta from before
      # the 0.0.1 restart must uninstall first, Android refuses a versionCode
      # downgrade. The prod flavor keeps the shared derivation untouched.
      - name: Compute the beta Android versionCode
        if: env.WARREN_CHANNEL == 'beta'
        run: |
          set -euo pipefail
          code=$(bash ci/android-beta-version-code.sh "${WARREN_VERSION%%-*}")
          echo "WARREN_BETA_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "beta versionCode $code for $WARREN_VERSION"

      # ONE flavor per invocation: the variant-agnostic assembleRelease would
      # request prod AND beta in a single Gradle run, which the per-variant
      # WARREN_PRODUCT_ENV guard refuses (cargoBuild compiles the Rust .so
      # for exactly one environment per invocation).
      - name: Build signed AAB + APK (prod)
        if: env.WARREN_CHANNEL == 'prod' && env.ANDROID_KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew app:assembleProdRelease app:bundleProdRelease --parallel

      - name: Build signed AAB + APK (beta)
        if: env.WARREN_CHANNEL == 'beta' && env.ANDROID_KEYSTORE_B64 != ''
        working-directory: android
        run: |
          ./gradlew app:assembleBetaRelease app:bundleBetaRelease --parallel \
            -Pwarren.app.config.override.versionCode="$WARREN_BETA_VERSION_CODE"

      # Prod never takes the debug-key fallback: its installs would be bound to
      # a key living on a runner (the Gradle build refuses it too,
      # checkProdReleaseSigning).
      - name: Refuse a prod release without the release keystore
        if: env.WARREN_CHANNEL == 'prod' && env.ANDROID_KEYSTORE_B64 == ''
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 secret not set; a prod release must be signed with the release keystore."
          exit 1

      # No keystore: the release build type, signed with the runner's AGP debug
      # key. APK only, a debug-signed AAB has no store to go to.

      - name: Build release APK signed with the runner debug key (beta)
        if: env.WARREN_CHANNEL == 'beta' && env.ANDROID_KEYSTORE_B64 == ''
        working-directory: android
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; the release APK is signed with the runner's AGP debug key."
          ./gradlew app:assembleBetaRelease --parallel \
            -Pwarren.app.config.override.versionCode="$WARREN_BETA_VERSION_CODE"

      # The fallback's whole promise is that the key never changes, and AGP
      # creates a fresh ~/.android/debug.keystore wherever it finds none: a
      # runner rebuilt on another HOME would sign a green build with a new key
      # and every install would answer INSTALL_FAILED_UPDATE_INCOMPATIBLE. The
      # committed fingerprint makes that a red job instead.
      - name: Assert the fallback signer is the key the published betas carry
        if: env.ANDROID_KEYSTORE_B64 == ''
        run: |
          bash ci/verify-android-signer.sh \
            "android/app/build/outputs/apk/$WARREN_CHANNEL/release/app-$WARREN_CHANNEL-release.apk" \
            android/fallback-signer.sha256

      # Prod only: the Play listing is the prod applicationId; the beta app is
      # distributed as a direct APK and never uploaded.
      - name: Upload to Google Play internal-test
        if: env.WARREN_CHANNEL == 'prod' && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_B64 != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.warrenbrowse.vpn
          releaseFiles: android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed

      - name: Wipe keystore from runner
        if: always() && env.ANDROID_KEYSTORE_B64 != ''
        run: |
          if [ -n "${WARREN_KEYSTORE_PATH:-}" ]; then rm -f "$WARREN_KEYSTORE_PATH"; fi

      - name: Stage release assets (harmonized names)
        if: env.WARREN_CHANNEL == 'prod'
        run: bash ci/stage-release-assets.sh android "$WARREN_VERSION"

      - name: Stage beta release assets
        if: env.WARREN_CHANNEL == 'beta'
        run: bash ci/stage-release-assets.sh android "$WARREN_VERSION" beta

      # publish-release compares the draft with these hashes before it
      # writes the checksum list (ci/release-asset-sums.sh).
      - name: Record the hashes of what this job uploads
        id: sums
        run: bash ci/release-asset-sums.sh record release-assets

      # Release-asset storage is not subject to the Actions artifact quota (see
      # the Linux job). Publish the APK/AAB straight to the draft release.
      - name: Publish Android installers to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/*

      - name: Upload Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        continue-on-error: true
        with:
          name: android-installers
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    permissions:
      contents: write
      # The build provenance attestation below: a Sigstore certificate bound
      # to this run, recorded in the repository's attestations.
      id-token: write
      attestations: write
    needs:
      - tag-guard
      - build-macos
      - build-linux
      - build-linux-arm64
      - build-linux-sysvinit
      - build-nixos
      - build-windows
      - build-ios
      - build-android
      - release-headless
    # GitHub-hosted: it only needs gh and sha256sum, and holds a token that
    # writes this repository's releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Publish as long as it's a tag and the desktop builds (macOS, Linux x86_64
    # and arm64, Windows, the two extra Linux flavours included) AND Android all
    # succeed. iOS stays non-blocking: it only builds when WARREN_ENABLE_IOS is
    # 'true', and is never required for the release.
    #
    # The arm64, sysvinit and NixOS jobs gate the release like any other
    # platform. The last two install-test what they produce, so a red one means
    # the artifact does not work; and shipping a release without any of the
    # three would quietly drop rows off the download page, which is exactly the
    # failure nobody notices until a user cannot find their build.
    #
    # release-headless gates it too: the headless client is the same daemon at
    # the same version, and a release that ships one without the other leaves
    # servers on an older Warren than every desktop.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-linux-sysvinit.result == 'success' &&
      needs.build-nixos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.release-headless.result == 'success'
    env:
      TAG_NAME: ${{ github.ref_name }}
      WARREN_CHANNEL: ${{ needs.tag-guard.outputs.channel }}
      WARREN_VERSION: ${{ needs.tag-guard.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # The per-platform build jobs already uploaded their installers straight to
      # the draft release via softprops (release-asset storage bypasses the
      # Actions artifact quota). This job only FINALISES that draft: it checks
      # the draft against the hashes each build job recorded, writes the
      # checksum list from those hashes, and sets the title/notes. It does NOT
      # re-create the release (that would clash with the existing draft).
      - name: Download release assets (assembled by the build jobs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          gh release download "$TAG_NAME" --dir release-files --pattern '*'
          ls -lh release-files/

      - name: The draft holds exactly what the builds produced
        env:
          SUMS_MACOS: ${{ needs.build-macos.outputs.sums }}
          SUMS_LINUX: ${{ needs.build-linux.outputs.sums }}
          SUMS_LINUX_ARM64: ${{ needs.build-linux-arm64.outputs.sums }}
          SUMS_LINUX_SYSVINIT: ${{ needs.build-linux-sysvinit.outputs.sums }}
          SUMS_NIXOS: ${{ needs.build-nixos.outputs.sums }}
          SUMS_WINDOWS: ${{ needs.build-windows.outputs.sums }}
          SUMS_ANDROID: ${{ needs.build-android.outputs.sums }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SUMS_MACOS" "$SUMS_LINUX" "$SUMS_LINUX_ARM64" "$SUMS_LINUX_SYSVINIT" \
            "$SUMS_NIXOS" "$SUMS_WINDOWS" "$SUMS_ANDROID" > "$RUNNER_TEMP/expected-sums"
          bash ci/release-asset-sums.sh check "$RUNNER_TEMP/expected-sums" release-files

      # Ties every published file to this workflow run, its commit and its
      # tag: `gh attestation verify <file> --repo WarrenBrowse/warren-app`
      # checks a download without trusting the release page that served it.
      - name: Attest the build provenance of every release file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS

      - name: Finalise and publish the release (checksums + title + notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" release-files/SHA256SUMS --clobber
          # Build the release body. Do NOT pass the whole CHANGELOG.md: it is
          # well over GitHub's ~125k-char release-body limit and the edit fails
          # with HTTP 422. Extract just this version's section; cap defensively
          # below the limit.
          notes="$RUNNER_TEMP/release-notes.md"
          # One reader for every surface that shows release notes, so the body,
          # the in-app what's-new and the signed manifests cannot disagree:
          # ci/extract-changelog-section.sh, pinned by
          # ci/test-extract-changelog-section.sh. `--with-heading` keeps the
          # `## [1.0.10] - 2026-06-24` line, which the body displays and the
          # in-app screen does not. The version has its channel prefix
          # stripped, so both series find their section.
          bash ci/extract-changelog-section.sh --with-heading \
            CHANGELOG.md "$WARREN_VERSION" > "$notes" || true
          # Release notes are optional: a tag without a CHANGELOG [version]
          # section still ships, rather than failing the whole release after
          # every platform already built. When the section is absent, fall back
          # to GitHub's auto-generated notes (the commit list since the previous
          # tag), then to a bare title. Write a CHANGELOG section when a release
          # deserves curated user-facing notes; skip it for a quick fix.
          if [ ! -s "$notes" ]; then
            echo "::warning::CHANGELOG.md has no [$WARREN_VERSION] section; using auto-generated notes." >&2
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG_NAME" --jq .body > "$notes" 2>/dev/null || true
            [ -s "$notes" ] || printf 'Warren VPN %s\n' "$TAG_NAME" > "$notes"
          fi
          # The placeholder what's-new renders verbatim in the in-app GUI, so it
          # is never intended, but it is baked into installers already built:
          # warn loudly instead of failing a finished release.
          if grep -q 'CHANGE THIS BEFORE A RELEASE' desktop/packages/mullvad-vpn/changes.txt; then
            echo "::warning::desktop changes.txt still carries the placeholder; the in-app what's-new will show it." >&2
          fi
          # GitHub caps the release body at 125000 chars; stay safely under it.
          head -c 120000 "$notes" > "$notes.cut" && mv "$notes.cut" "$notes"
          # Every build job succeeded (this job's `if` gate), so the draft is
          # complete: publish it here. It MUST go non-draft before
          # publish-update-metadata runs, because a draft release's asset URLs
          # 404 and the signed manifests point straight at them: clients would
          # see "update available" and fail to download it.
          # A beta release NEVER moves the prod "latest" pointer: the beta
          # channel is a pre-release line of its own. On the prod channel a tag
          # with a pre-release suffix (v1.2.3-beta1) is also published as a
          # pre-release and does not become "latest".
          if [ "$WARREN_CHANNEL" = beta ]; then
            title="Warren VPN Beta $WARREN_VERSION"
            prerelease=true
            latest=false
          else
            title="Warren VPN $WARREN_VERSION"
            case "$WARREN_VERSION" in
              *-*) prerelease=true;  latest=false ;;
              *)   prerelease=false; latest=true  ;;
            esac
          fi
          gh release edit "$TAG_NAME" \
            --title "$title" \
            --notes-file "$notes" \
            --draft=false \
            --prerelease="$prerelease" \
            --latest="$latest"

      - name: Verify the release is published (assets must resolve)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Releases API is eventually consistent right after the flip; give
          # it a few seconds rather than letting the metadata job race it.
          for _ in $(seq 1 10); do
            if [ "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = "false" ]; then
              echo "release $TAG_NAME is published"
              exit 0
            fi
            sleep 3
          done
          echo "::error::release $TAG_NAME is still a draft; refusing to publish update metadata against 404 asset URLs"
          exit 1

  # Signs the channel's update manifests and serves them so existing apps
  # detect the new release. ONE channel per run: the other channel's manifests
  # are never regenerated nor re-uploaded here, which is what keeps a beta
  # release from ever reaching a prod client. The installer URLs inside the
  # manifests point at the update host, which receives the installers in the
  # same run, after the release is published (publish-release flips and checks
  # it first). How the key is kept apart from the build: update-metadata.yml.
  publish-update-metadata:
    name: Sign + publish update metadata
    needs: [tag-guard, publish-release]
    if: >-
      !cancelled() &&
      needs.publish-release.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/update-metadata.yml
    with:
      channel: ${{ needs.tag-guard.outputs.channel }}
      tag: ${{ github.ref_name }}
    secrets:
      WARREN_CORE_RO_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      WARREN_UPDATE_SIGNING_KEY: ${{ secrets.WARREN_UPDATE_SIGNING_KEY }}
      WARREN_UPDATES_SSH_KEY: ${{ secrets.WARREN_UPDATES_SSH_KEY }}
      WARREN_UPDATES_SSH_HOST: ${{ secrets.WARREN_UPDATES_SSH_HOST }}
      WARREN_UPDATES_SSH_USER: ${{ secrets.WARREN_UPDATES_SSH_USER }}
