# Throwaway: proves the native Windows release builds on this branch before it
# lands. Removed before merge.
name: tmp windows proof
on:
  push:
    branches: [ci/github-hosted]
permissions:
  contents: read
jobs:
  linux-x64-app:
    name: linux x64 app packages in the job image
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/warrenbrowse/warren-ci-linux:bullseye-e03e4fc686d82f6b1cbea663ec9032c76960b5ee
      options: --user root
    # A container job's steps default to sh, which has no pipefail.
    defaults:
      run:
        shell: bash
    timeout-minutes: 130
    env:
      CC: clang
      CXX: clang++
      WARREN_CHANNEL: beta
      WARREN_VERSION: "1.1.35"
      WARREN_PRODUCT_ENV: beta
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: https://api.beta.warrenbrowse.com
      - run: rpm --version
      - run: bash ci/run-with-runner-retry.sh timeout -k 60s 55m ./build.sh --optimize
      - run: bash ci/stage-release-assets.sh linux "$WARREN_VERSION" beta
      - name: glibc floor of the shipped binaries
        run: |
          set -euo pipefail
          ls -lh release-assets
          mkdir -p x && for d in release-assets/*.deb; do dpkg-deb -x "$d" x; done
          find x -type f \( -path '*/bin/*' -o -name '*.so*' -o -name 'warren*' -o -name 'mullvad*' \) -print0 \
            | xargs -0 -I{} sh -c 'objdump -T "{}" 2>/dev/null | grep -o "GLIBC_[0-9.]*" || true' | sort -uV | tail -3
          df -h / .
