---
# Lints every workflow and composite action on each change to them.
#
# release.yml and the update-metadata workflows only run on a release tag, so
# an expression error or a broken script in them used to surface at the next
# release, after every build had already run. actionlint (with shellcheck,
# preinstalled on the runner) reads them here instead, and pinact refuses an
# action that is not pinned by commit.
name: Workflow check

on:
  push:
    branches:
      - main
    paths: &workflow_paths
      - ".github/**"
  pull_request:
    branches:
      - main
    paths: *workflow_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  PINACT_VERSION: 5.0.2
  PINACT_SHA256: 7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7

jobs:
  workflow-check:
    name: actionlint and pinned actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      # Both tools are checked against the checksums their releases publish
      # before anything runs them.
      - name: Install actionlint and pinact
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          curl -fsSL -o pinact.tar.gz \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "$PINACT_SHA256  pinact.tar.gz" | sha256sum -c -
          tar -xzf pinact.tar.gz -C "$bin" pinact
          echo "$bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: |
          shellcheck --version | head -2
          actionlint

      - name: Every action is pinned by commit
        run: pinact run --check
