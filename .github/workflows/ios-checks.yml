---
# Warren: the iOS app's push/PR gate.
#
# No Swift line was compiled by any automatic CI. Every inherited `ios-*.yml`
# workflow is dispatch-only in this fork AND disabled in the Actions tab (a
# dispatch answers "Cannot trigger a 'workflow_dispatch' on a disabled
# workflow"), and `warren-checks.yml` matches four narrow iOS paths
# (Configurations, Info.plist, project.pbxproj, Assets.xcassets) to run Rust
# and desktop tests, never a Swift step. An iOS-only change therefore
# triggered nothing at all, which is how a deep link that routed nowhere, a
# log cap that never fired and a link to Mullvad's App Store listing all
# reached main.
#
# This is the Android gate's twin (`android-checks.yml`): the fast, hermetic
# signal, no device and no signing identity. The runner is GitHub-hosted and
# free on this public repository, so the gate needs nothing from the
# self-hosted pool. One UI smoke test runs on the simulator; the rest of the UI
# suite and the screenshots stay local.

name: iOS checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - warren-base
    paths: &ios_paths
      - "ios/**"
      - "warren-ios/**"
      # Compiled into the iOS FFI: the forum wire and the incident reports are
      # shared crates, so a change there reaches this app without touching a
      # path named after it.
      - "warren-forum/**"
      - "warren-incidents/**"
      - "warren-standing/**"
      - "warren-product-env/**"
      # Replayed by the Swift unit tests: the scenery placement formula, the
      # forum link classes, the outcome envelopes.
      - "fixtures/client-rules/**"
      - ".github/workflows/ios-checks.yml"
      - ".github/actions/ios/**"
  pull_request:
    branches:
      - main
      - warren-base
    paths: *ios_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main finishes, so every pushed commit keeps a verdict; a newer push
  # still replaces the one pending behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `./format.sh lint -s` is excluded on purpose, the way `android-checks.yml`
# excludes detekt and `:test:arch`: swift-format reports hundreds of
# pre-existing findings across the inherited Mullvad tree (OrderedImports alone
# covers most of PacketTunnel, PacketTunnelCore and Operations), so gating it
# today paints main red for reasons unrelated to any change under review.
# Adopting the style is its own cleanup.

jobs:
  unit-tests:
    name: iOS unit tests
    # macos-26, not macos-15: the test sources use `SendableMetatype`, a Swift
    # 6.2 type, and the Xcode 16.4 the shared setup action pins cannot compile
    # it. CI has to build with the toolchain the app is actually written for.
    runs-on: macos-26
    # A cold run compiles warren-ios for the simulator target from scratch,
    # which takes most of an hour on a hosted macOS runner. The build-env
    # action warms Swatinem/rust-cache, so a warm run is a fraction of that;
    # this ceiling is sized for the cold one rather than flaking on it.
    timeout-minutes: 120
    env:
      SOURCE_PACKAGES_PATH: .spm
    steps:
      # NOT `submodules: recursive`: the inherited Mullvad binaries submodule
      # pulls libmnl and libnftnl over `git://git.netfilter.org`, which no
      # hosted runner reaches (the first run of this workflow spent four
      # minutes timing out on it before failing). Nothing under ios/ needs
      # them; `vectors` is taken on its own below, as warren-tests.yml does.
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          submodules: false

      # The token rides the request for the reason warren-tests.yml gives: the
      # fleet egresses through one IP and GitHub's anonymous throttle answers a
      # first unauthenticated request with a fatal error.
      - name: Checkout the golden vectors submodule
        env:
          ENGINE_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ENGINE_TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              submodule update --init vectors
          else
            git submodule update --init vectors
          fi
          test -f vectors/forum_login_v1.json
          test -f vectors/forum_login_v2.json

      # Checks out the pinned sibling engines (warrenguard, warren-sdk-rs,
      # warren-contract) that warren-ios consumes by path. The Xcode build
      # phase that cross-compiles the crate needs them present.
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/ios/setup-project-toolchain
        with:
          # Empty keeps the image's own Xcode, which carries Swift 6.2.
          xcode_version: ''

      # `WarrenVPNCI` is the plan the release job already runs: the six unit
      # test targets, no UI suite, no booted app.
      #
      # Ad-hoc signing rather than `CODE_SIGNING_ALLOWED=NO`: the app force
      # unwraps its App Group container at startup
      # (`ApplicationConfiguration.swift`), and stripping entitlements makes
      # every host-application test crash on launch with no useful message.
      #
      # One simulator, no parallel clones. With the plan's targets marked
      # parallelizable, xcodebuild boots a second clone of the simulator and
      # launches a second test host while the first clone is running tests,
      # and the hosted runner freezes the running test process for one to two
      # minutes while it does. Whatever test is on the clock then "exceeds its
      # execution time allowance of 1 minute" and still passes once the
      # process thaws, or misses a 10-second expectation it would have met.
      # 14 of 42 attempts failed between 2026-09-23 and 2026-09-28; the
      # reports read name a dozen unrelated tests, and in each one checked the
      # timeout landed while the other clone was booting, installing or
      # launching its host. The clones did not buy speed either: the test
      # phase took 12 minutes with them and 98 seconds on one simulator
      # (run 36404582454).
      - name: Run unit tests
        run: |
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPN \
            -testPlan WarrenVPNCI \
            -parallel-testing-enabled NO \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            -resultBundlePath xcode-test-report \
            CODE_SIGN_IDENTITY="-" \
            test 2>&1 | xcbeautify
        working-directory: ios/

      - name: Store test report artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ios-test-report
          path: ios/xcode-test-report.xcresult

      # One UI test, the wallet chooser a first launch lands on: it needs no
      # network and no wallet, and it is what proves the app still launches
      # and draws its first screen. The full UI suite stays local.
      - name: Run the UI smoke test
        run: |
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPNUITests \
            -parallel-testing-enabled NO \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            -only-testing:WarrenVPNUITests/WalletFlowTests/testLoginChooserExposesCreateAndRestore \
            CODE_SIGN_IDENTITY="-" \
            test 2>&1 | xcbeautify
        working-directory: ios/

  # The unit tests above build Debug for the simulator only. What ships is
  # Release for devices: another Rust target, the `--locked` build, the
  # features build-rust-library.sh strips there, and Swift compiled without
  # the debug conditions. A link error of that build alone once reached main
  # unseen, so it is built here on every push, unsigned.
  device-release:
    name: iOS device build (Release) and tunnel FFI tests
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SOURCE_PACKAGES_PATH: .spm
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          submodules: false

      - name: Checkout the golden vectors submodule
        env:
          ENGINE_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ENGINE_TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              submodule update --init vectors
          else
            git submodule update --init vectors
          fi

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/ios/setup-project-toolchain
        with:
          ios_rust_target: aarch64-apple-ios
          xcode_version: ''

      - name: Clippy for the device target
        run: |
          cargo clippy --locked --all-targets --all-features -p warren-ios \
            --target aarch64-apple-ios -- -D warnings

      # The tunnel handle only compiles for iOS with the `tunnel` feature, so
      # its tests cannot run on the macOS host. The test binary runs on the
      # simulator instead, which executes a plain iOS command-line binary.
      - name: Tunnel FFI tests on the simulator
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios-sim
          bin=$(cargo test --locked --lib -p warren-ios --features tunnel \
            --target aarch64-apple-ios-sim --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null
                and .target.name == "warren_ios") | .executable' | tail -1)
          test -n "$bin"
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name == "iPhone 17")][0].udid')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" "$bin"

      - name: Release build for devices, unsigned
        run: |
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify
        working-directory: ios/
