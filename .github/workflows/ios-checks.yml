---
# Warren: the iOS app's push/PR gate.
#
# No Swift line was compiled by any automatic CI. Every inherited `ios-*.yml`
# workflow is dispatch-only in this fork AND disabled in the Actions tab (a
# dispatch answers "Cannot trigger a 'workflow_dispatch' on a disabled
# workflow"), and `warren-checks.yml` matches four narrow iOS paths
# (Configurations, Info.plist, project.pbxproj, Assets.xcassets) to run Rust
# and desktop tests, never a Swift step. An iOS-only change therefore
# triggered nothing at all, which is how a deep link that routed nowhere, a
# log cap that never fired and a link to Mullvad's App Store listing all
# reached main.
#
# This is the Android gate's twin (`android-checks.yml`): the fast, hermetic
# signal, no device and no signing identity. The runner is GitHub-hosted and
# free on this public repository, so the gate needs nothing from the
# self-hosted pool. The UI and screenshot suites need a booted app and stay on
# the dispatch-only workflows.

name: iOS checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - warren-base
    paths: &ios_paths
      - "ios/**"
      - "warren-ios/**"
      # Replayed by the Swift unit tests: the scenery placement formula, the
      # forum link classes, the outcome envelopes.
      - "fixtures/client-rules/**"
      - ".github/workflows/ios-checks.yml"
      - ".github/actions/ios/**"
  pull_request:
    branches:
      - main
      - warren-base
    paths: *ios_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `./format.sh lint -s` is excluded on purpose, the way `android-checks.yml`
# excludes detekt and `:test:arch`: swift-format reports hundreds of
# pre-existing findings across the inherited Mullvad tree (OrderedImports alone
# covers most of PacketTunnel, PacketTunnelCore and Operations), so gating it
# today paints main red for reasons unrelated to any change under review.
# Adopting the style is its own cleanup.

jobs:
  unit-tests:
    name: iOS unit tests
    # macos-26, not macos-15: the test sources use `SendableMetatype`, a Swift
    # 6.2 type, and the Xcode 16.4 the shared setup action pins cannot compile
    # it. CI has to build with the toolchain the app is actually written for.
    runs-on: macos-26
    # A cold run compiles warren-ios for the simulator target from scratch,
    # which takes most of an hour on a hosted macOS runner. The build-env
    # action warms Swatinem/rust-cache, so a warm run is a fraction of that;
    # this ceiling is sized for the cold one rather than flaking on it.
    timeout-minutes: 120
    env:
      SOURCE_PACKAGES_PATH: .spm
    steps:
      # NOT `submodules: recursive`: the inherited Mullvad binaries submodule
      # pulls libmnl and libnftnl over `git://git.netfilter.org`, which no
      # hosted runner reaches (the first run of this workflow spent four
      # minutes timing out on it before failing). Nothing under ios/ needs
      # them; `vectors` is taken on its own below, as warren-tests.yml does.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      # The token rides the request for the reason warren-tests.yml gives: the
      # fleet egresses through one IP and GitHub's anonymous throttle answers a
      # first unauthenticated request with a fatal error.
      - name: Checkout the golden vectors submodule
        env:
          ENGINE_TOKEN: ${{ secrets.WARREN_CORE_RO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ENGINE_TOKEN" ]; then
            auth="$(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
              submodule update --init vectors
          else
            git submodule update --init vectors
          fi
          test -f vectors/forum_login_v1.json

      # Checks out the pinned sibling engines (warrenguard, warren-sdk-rs,
      # warren-contract) that warren-ios consumes by path. The Xcode build
      # phase that cross-compiles the crate needs them present.
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Setup project
        uses: ./.github/actions/ios/setup-project-toolchain
        with:
          # Empty keeps the image's own Xcode, which carries Swift 6.2.
          xcode_version: ''

      # `WarrenVPNCI` is the plan the release job already runs: the six unit
      # test targets, no UI suite, no booted app.
      #
      # Ad-hoc signing rather than `CODE_SIGNING_ALLOWED=NO`: the app force
      # unwraps its App Group container at startup
      # (`ApplicationConfiguration.swift`), and stripping entitlements makes
      # every host-application test crash on launch with no useful message.
      - name: Run unit tests
        run: |
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild \
            -project WarrenVPN.xcodeproj \
            -scheme WarrenVPN \
            -testPlan WarrenVPNCI \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            -resultBundlePath xcode-test-report \
            CODE_SIGN_IDENTITY="-" \
            test 2>&1 | xcbeautify
        working-directory: ios/

      - name: Store test report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report
          path: ios/xcode-test-report.xcresult
