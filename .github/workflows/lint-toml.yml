name: TOML Validation
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: tombi-toml/setup-tombi@v1

      - name: Lint TOML files
        run: tombi lint

      - name: Validate TOML formatting
        run: tombi format --check --diff
