---
# Warren: the Android app's push/PR gate.
#
# The whole android/ tree had NO automatic gate: every inherited
# `android-*.yml` workflow is dispatch-only in this fork, and
# `warren-checks.yml` is paths-filtered to the daemon/desktop tree. An
# Android-only change therefore triggered nothing at all, which is how a
# blocking network call on the UI thread reached main unnoticed.
#
# Scope is the Rust cross-compile, the static analysis (ktfmt, detekt, lint)
# and the JVM unit tests, `:test:arch` included: the fast, hermetic signal (no
# emulator, no device). The instrumented and e2e suites need a device runner
# and stay on the dispatch-only workflows.
#
# detekt runs against `android/config/detekt-baseline.xml`, which lists the
# findings that predate the gate: a new finding fails the job, and an old one
# leaves the baseline when its code is fixed. Regenerate the file with
# `./gradlew detektBaseline` only to remove entries, never to admit new ones.

name: Android checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - warren-base
    paths: &android_paths
      - "android/**"
      - "warren-jni/**"
      # Every in-repo crate warren-jni compiles, the lock and the sibling pins:
      # a change to any of them changes the Android library.
      - "warren-standing/**"
      - "warren-forum/**"
      - "warren-incidents/**"
      - "warren-product-env/**"
      - "warren-app-routes/**"
      - "talpid-app-routing/**"
      - "talpid-types/**"
      - "talpid-platform-metadata/**"
      - "mullvad-update/**"
      - "mullvad-version/**"
      - "mullvad-problem-report/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".warrenguard-version"
      - ".warren-sdk-version"
      - ".warren-contract-version"
      - ".github/actions/mullvad-build-env/**"
      # The client-rule fixtures are replayed by the JVM unit tests (the forum
      # link classes, the outcome envelopes, the per-flavor BuildConfig).
      - "fixtures/client-rules/**"
      - ".github/workflows/android-checks.yml"
  pull_request:
    branches:
      - main
      - warren-base
    paths: *android_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main finishes, so every pushed commit keeps a verdict; a newer push
  # still replaces the one pending behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests (JVM)
    # Self-hosted runners keep their state between jobs, so code from a fork
    # never runs on them: a pull request opened from another repository skips
    # this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          # The action's default is `tools platform-tools`, and the legacy
          # `tools` package is gone from Google's repository: sdkmanager now
          # answers "Failed to find package 'tools'" and the step fails. That
          # turned main red on 2026-09-17 with nothing in this repo having
          # changed since the last green run on 09-08. `cmdline-tools`
          # replaced it and the action installs it by itself.
          packages: platform-tools

      # Checks out the pinned sibling engines (warrenguard, warren-sdk-rs,
      # warren-contract) that the Rust workspace consumes by path.
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android

      # The ONLY thing that ever compiles warren-jni's Android code.
      # `warren-jni/src/tunnel.rs` is `#![cfg(all(target_os = "android", ...))]`,
      # so the `cargo test -p warren-jni` in warren-checks compiles none of it on
      # the desktop runner, and the JVM unit tests below need no native library.
      # A struct field added on the desktop side therefore reached main
      # uncompiled and only surfaced in the release job, where build-android
      # blocks publish-release and took the whole release down with it
      # (2026-08-14, beta-v1.1.13).
      #
      # Two ABIs out of the four the release builds: arm64 and arm cover both
      # pointer widths, which is where a per-ABI break would live, at half the
      # cost. A 32-bit-only x86 break would still reach the release job.
      - name: Cross-compile the Rust JNI library (arm64 + arm)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace app:cargoBuildArm64 app:cargoBuildArm

      # Lints the same Android-only code with warnings denied. The cross-compile
      # above builds it but lets a lint through, and the desktop clippy in
      # warren-checks never sees it: two lint errors sat in warren-jni unnoticed
      # until a manual run on 2026-10-14. The gradle step has installed the
      # pinned NDK under ANDROID_HOME by now; clippy only needs its clang for the
      # C build scripts.
      - name: Clippy, Android arm64
        run: |
          NDK="$ANDROID_HOME/ndk/$(sed -n 's/^ndk = "\(.*\)"/\1/p' android/gradle/libs.versions.toml)"
          TC="$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang"
          cargo clippy --locked --target aarch64-linux-android -p warren-jni --all-targets -- -D warnings
          cargo clippy --locked --target aarch64-linux-android -p warren-jni --all-features --all-targets -- -D warnings

      - name: Kotlin format
        run: android/gradlew -p android --no-daemon --stacktrace ktfmtCheck

      - name: Detekt
        run: android/gradlew -p android --no-daemon --stacktrace detekt

      - name: Lint
        run: android/gradlew -p android --no-daemon --stacktrace :app:lintProdDebug

      - name: Unit tests
        run: |
          android/gradlew -p android --no-daemon --stacktrace testAllUnitTests
