---
# Warren VPN: HEADLESS (daemon + CLI) release pipeline.
#
# Produces every artifact the `warren-cli` distribution repo serves, and
# publishes them there as a finished (non-draft) release:
#
#   Linux x86_64   warren-vpn-daemon[-<env>]_<ver>_amd64.deb / _x86_64.rpm
#   Linux arm64    warren-vpn-daemon[-<env>]_<ver>_arm64.deb / _aarch64.rpm
#   Linux generic  warren-headless[-<env>]-<ver>-linux-{x86_64,aarch64}.tar.gz
#   macOS          warren-headless[-<env>]-<ver>-macos-universal.tar.gz
#   Windows        warren-headless[-<env>]-<ver>-windows-x64.zip
#   SHA256SUMS
#
# The generic Linux tarball is what makes "any Linux" true: the .deb and .rpm
# reach Debian/Ubuntu and Fedora/RHEL/SUSE families, and the tarball covers
# Arch, Void, Gentoo, Artix, Slackware and NixOS-outside-the-flake, wiring up
# systemd, OpenRC or sysvinit depending on what the host actually runs. All of
# it is glibc: a musl host (Alpine) is refused by the installer with a reason
# rather than by the loader with an error nobody can read.
#
# TWO WAYS IN, one behaviour:
#
#   * called by release.yml on every app tag, so a new app version always
#     ships a matching CLI. This is the normal path and it is not optional:
#     release.yml's publish job requires this workflow to have succeeded.
#   * a `daemon-v*` / `daemon-beta-v*` tag pushed on its own, to ship the CLI
#     without cutting an app release.
#
# The channel comes from the tag shape in both cases (shared rule
# 50-release-channels.md), and one run publishes exactly one channel.
#
# Required secrets:
#   WARREN_CORE_RO_TOKEN       read access to the sibling repos, as release.yml
#   WARREN_CLI_RELEASE_TOKEN   contents:write on WarrenBrowse/warren-cli

name: release-daemon

on:
  workflow_call:
    inputs:
      channel:
        description: "prod | beta, resolved by the caller's tag guard"
        type: string
        required: true
      version:
        description: "Release version without the channel prefix (e.g. 1.1.15)"
        type: string
        required: true
      api-url:
        description: "API host of the channel, for the baked exit list"
        type: string
        required: true
  push:
    tags:
      - "daemon-v*"
      - "daemon-beta-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One place decides the channel, the version and the warren-cli tag, whether
  # this run was called by release.yml or triggered by its own tag. Every job
  # below reads these outputs and nothing re-derives them, so a called run and
  # a standalone run cannot disagree about what they are building.
  resolve:
    name: Resolve channel and version
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      api-url: ${{ steps.resolve.outputs.api-url }}
      cli-tag: ${{ steps.resolve.outputs.cli-tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: resolve
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_API_URL: ${{ inputs.api-url }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            channel="$INPUT_CHANNEL"
            version="$INPUT_VERSION"
            api_url="$INPUT_API_URL"
          else
            ref="${GITHUB_REF_NAME}"
            case "$ref" in
              daemon-beta-v*) channel=beta; version="${ref#daemon-beta-v}" ;;
              daemon-v*)      channel=prod; version="${ref#daemon-v}" ;;
              *)
                # workflow_dispatch off a branch: build everything, publish
                # nothing. The version is whatever the checkout says.
                channel=prod; version="" ;;
            esac
            case "$channel" in
              beta) api_url=https://api.beta.warrenbrowse.com ;;
              *)    api_url=https://api.warrenbrowse.com ;;
            esac
          fi

          # A version with a pre-release suffix (daemon-v1.2.3-rc1) keeps the
          # -dev- suffix and is never published: it is a build to look at, not
          # a release.
          publish=false
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            publish=true
          fi

          case "$channel" in
            beta) cli_tag="daemon-beta-v${version}" ;;
            *)    cli_tag="daemon-v${version}" ;;
          esac

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "api-url=$api_url"
            echo "cli-tag=$cli_tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "channel=$channel version=${version:-<none>} api=$api_url cli-tag=$cli_tag publish=$publish"

      # Only on the standalone path: a run called by release.yml has already
      # been through the same guard in its tag-guard job, on the same version.
      # The two series share one version space, so this refuses both a
      # regression and a number the app series already used.
      - name: Refuse a version-regressing headless tag
        if: inputs.version == '' && steps.resolve.outputs.publish == 'true'
        run: |
          git fetch --tags --force origin
          bash ci/check-release-version.sh \
            "${{ steps.resolve.outputs.channel }}" "${{ steps.resolve.outputs.version }}"

  linux:
    name: Linux x86_64 (.deb / .rpm / tarball)
    needs: [resolve]
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    timeout-minutes: 90
    # clang avoids the intermittent gcc cc1 SIGSEGV under x86_64-Rosetta (same as release.yml).
    env:
      CC: clang
      CXX: clang++
      WARREN_PRODUCT_ENV: ${{ needs.resolve.outputs.channel }}
      WARREN_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the release version
        uses: ./.github/actions/stamp-headless-version
        with:
          version: ${{ needs.resolve.outputs.version }}
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Checkout warren-cli (install assets)
        uses: actions/checkout@v5
        with:
          repository: WarrenBrowse/warren-cli
          path: warren-cli
          token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.resolve.outputs.api-url }}
      - name: Verify packaging deps
        # rpm is preinstalled on the runner; cargo-deb / cargo-generate-rpm are
        # NOT (the GUI release.sh packages via electron-builder, not cargo-deb),
        # so the daemon-only path must install them itself (user-level, no sudo).
        run: |
          rpm --version
          cargo deb --version          >/dev/null 2>&1 || cargo install cargo-deb --locked
          cargo generate-rpm --version >/dev/null 2>&1 || cargo install cargo-generate-rpm --locked
      - name: Build daemon-only packages
        # Retry on the Rosetta compiler-crash signature (not a real build error).
        # pipefail so a real build.sh failure fails the step (without it the pipe
        # returns tee's exit code and masks the error).
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./build.sh --daemon-only --optimize 2>&1 | tee /tmp/build-daemon.log; then exit 0; fi
            if grep -qE "SIGSEGV|signal: 11|signal: 4|signal: 6|Illegal instruction|internal compiler error: Segmentation" /tmp/build-daemon.log; then
              echo "::warning::compiler crashed under Rosetta (attempt $attempt/3); retrying"
              continue
            fi
            exit 1
          done
          exit 1
      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp dist/warren-vpn-daemon* release-assets/
          bash ci/build-headless-bundle.sh linux "${WARREN_VERSION:-0.0.0}" warren-cli
          ls -lh release-assets
      - name: Publish artifacts to the warren-cli release (draft)
        # Published to the public-facing distribution repo (warren-cli), not
        # this one, so the public install one-liner only needs warren-cli to be
        # public. The `finalise` job below flips the draft.
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: WarrenBrowse/warren-cli
          token: ${{ secrets.WARREN_CLI_RELEASE_TOKEN }}
          target_commitish: main
          tag_name: ${{ needs.resolve.outputs.cli-tag }}
          draft: true
          files: release-assets/*
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: warren-headless-linux
          path: release-assets/*
          retention-days: 7

  linux-arm64:
    name: Linux arm64 (.deb / .rpm / tarball)
    needs: [resolve]
    # Native aarch64 pool on the same Mac, so no Rosetta: no CC=clang against
    # the emulated gcc cc1 crash and no whole-build retry on a crash signature.
    # This job is what makes the one-line installer work on an ARM server
    # (Raspberry Pi, Ampere/Graviton instances).
    runs-on: [self-hosted, Linux, ARM64, macstudio-arm64]
    timeout-minutes: 90
    env:
      # Several arm64 runners share one 16-core Colima VM; same cap as
      # warren-tests.yml, for neighbourliness.
      CARGO_BUILD_JOBS: "6"
      WARREN_PRODUCT_ENV: ${{ needs.resolve.outputs.channel }}
      WARREN_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the release version
        uses: ./.github/actions/stamp-headless-version
        with:
          version: ${{ needs.resolve.outputs.version }}
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Checkout warren-cli (install assets)
        uses: actions/checkout@v5
        with:
          repository: WarrenBrowse/warren-cli
          path: warren-cli
          token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.resolve.outputs.api-url }}
      - name: Verify packaging deps
        # They persist in the runner volume, so only a fresh volume pays for it.
        run: |
          rpm --version
          cargo deb --version          >/dev/null 2>&1 || cargo install cargo-deb --locked
          cargo generate-rpm --version >/dev/null 2>&1 || cargo install cargo-generate-rpm --locked
      - name: Build daemon-only packages
        # No TARGETS: the runner is aarch64, so build.sh packages for its own
        # host and cargo-deb / cargo-generate-rpm name the output _arm64.deb and
        # _aarch64.rpm.
        run: ./build.sh --daemon-only --optimize
      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp dist/warren-vpn-daemon* release-assets/
          bash ci/build-headless-bundle.sh linux "${WARREN_VERSION:-0.0.0}" warren-cli
          ls -lh release-assets
      - name: Assert the packages really are arm64
        # cargo-deb and cargo-generate-rpm read the architecture from the build
        # target, so a package named arm64 while carrying x86_64 binaries can
        # only come from a misrouted job. It installs cleanly and then fails to
        # start, which is a much more expensive way to find out.
        run: |
          set -euo pipefail
          ls release-assets/warren-vpn-daemon*_arm64.deb >/dev/null
          ls release-assets/warren-vpn-daemon*_aarch64.rpm >/dev/null
          ls release-assets/warren-headless*-linux-aarch64.tar.gz >/dev/null
          readelf -h "${CARGO_TARGET_DIR:-target}/release/warren-daemon" | grep -q AArch64
      - name: Publish artifacts to the warren-cli release (draft)
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: WarrenBrowse/warren-cli
          token: ${{ secrets.WARREN_CLI_RELEASE_TOKEN }}
          target_commitish: main
          tag_name: ${{ needs.resolve.outputs.cli-tag }}
          draft: true
          files: release-assets/*
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: warren-headless-linux-arm64
          path: release-assets/*
          retention-days: 7

  macos:
    name: macOS universal bundle
    needs: [resolve]
    runs-on: [self-hosted, macOS, ARM64]
    # Two slices, so two compiles of the workspace. The x86_64 one has no warm
    # cache on a runner that has only ever built the native arm64 half.
    timeout-minutes: 120
    env:
      WARREN_PRODUCT_ENV: ${{ needs.resolve.outputs.channel }}
      WARREN_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the release version
        uses: ./.github/actions/stamp-headless-version
        with:
          version: ${{ needs.resolve.outputs.version }}
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Checkout warren-cli (install assets)
        uses: actions/checkout@v5
        with:
          repository: WarrenBrowse/warren-cli
          path: warren-cli
          token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.resolve.outputs.api-url }}
      - name: Build daemon + CLI (both architectures)
        # Explicit targets for BOTH slices. The bundle this job used to produce
        # was arm64-only, which no Intel Mac could run, and nothing said so
        # until the binary refused to exec. x86_64-apple-darwin is installed by
        # the build-env action.
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" \
              -p mullvad-daemon -p mullvad-cli -p mullvad-setup -p mullvad-problem-report
          done
      - name: Assemble the universal bundle
        run: bash ci/build-headless-bundle.sh macos "${WARREN_VERSION:-0.0.0}" warren-cli
      - name: Publish artifacts to the warren-cli release (draft)
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: WarrenBrowse/warren-cli
          token: ${{ secrets.WARREN_CLI_RELEASE_TOKEN }}
          target_commitish: main
          tag_name: ${{ needs.resolve.outputs.cli-tag }}
          draft: true
          files: release-assets/*
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: warren-headless-macos
          path: release-assets/*
          retention-days: 7

  windows:
    name: Windows x64 bundle
    needs: [resolve]
    runs-on: [self-hosted, Windows, macstudio-win]
    timeout-minutes: 140
    # Blocking, like every other platform, since daemon-beta-v1.1.15 (the first
    # run to produce a complete bundle: winfw.dll, wintun.dll and the
    # split-tunnel driver, with the WFP keys salt-verified). A release that
    # advertises Windows and silently ships without its zip is the failure
    # nobody notices until a user cannot find their build, which is the same
    # reason the sysvinit and NixOS jobs gate the app release.
    #
    # The marginal risk is small: the GUI's own Windows job already gates every
    # app release and runs on this same pool, so the two fail together far more
    # often than apart.
    env:
      WARREN_PRODUCT_ENV: ${{ needs.resolve.outputs.channel }}
      WARREN_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Set git config for long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v5
      - name: Stamp the release version
        uses: ./.github/actions/stamp-headless-version
        with:
          version: ${{ needs.resolve.outputs.version }}
      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
          # Keyed into the Windows modules cache: the channel decides the WFP
          # GUID salt, and a slot shared across channels ships the wrong keys.
          product-env: ${{ needs.resolve.outputs.channel }}
      - name: Checkout warren-cli (install assets)
        uses: actions/checkout@v5
        with:
          repository: WarrenBrowse/warren-cli
          path: warren-cli
          token: ${{ secrets.WARREN_CORE_RO_TOKEN }}
      - name: Bake Warren exit list bootstrap
        uses: ./.github/actions/fetch-warren-relays
        with:
          warren-api-url: ${{ needs.resolve.outputs.api-url }}
      - name: Build Windows C modules (winfw, Release)
        shell: bash
        # winfw must be built in Release: talpid-core links the release cargo
        # build against windows/winfw/bin/x64-Release/winfw.lib. The script
        # defaults to Debug, which left x64-Release/winfw.lib missing -> LNK1181.
        env:
          CPP_BUILD_MODES: Release
          CPP_BUILD_TARGETS: x64
        run: ./build-windows-modules.sh --max-concurrent-processes 2 build winfw
      - name: Verify the winfw WFP keys carry this channel's salt
        shell: bash
        # beta-v1.1.9 shipped a beta build whose winfw.dll carried PRODUCTION
        # WFP keys, and every connected Windows host updating into it was walled
        # by its predecessor's kill switch. The headless bundle ships the same
        # dll, so it runs the same check on its own output.
        run: |
          bash ci/verify-winfw-salt.sh windows/winfw/bin/x64-Release/winfw.dll \
            "${{ needs.resolve.outputs.channel }}"
      - name: Build daemon + CLI (release)
        shell: bash
        # The runner is Windows-on-ARM (macstudio-win); Warren ships x64 only, so
        # build the x86_64 target explicitly instead of the host default (arm64),
        # which would otherwise emit an aarch64 daemon into target/release.
        run: |
          cargo build --release --target x86_64-pc-windows-msvc \
            -p mullvad-daemon -p mullvad-cli -p mullvad-setup -p mullvad-problem-report
      - name: Assemble the bundle
        shell: bash
        run: bash ci/build-headless-bundle.sh windows "${WARREN_VERSION:-0.0.0}" warren-cli
      - name: Publish artifacts to the warren-cli release (draft)
        if: needs.resolve.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: WarrenBrowse/warren-cli
          token: ${{ secrets.WARREN_CLI_RELEASE_TOKEN }}
          target_commitish: main
          tag_name: ${{ needs.resolve.outputs.cli-tag }}
          draft: true
          files: release-assets/*
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: warren-headless-windows
          path: release-assets/*
          retention-days: 7

  finalise:
    name: Publish the warren-cli release
    needs: [resolve, linux, linux-arm64, macos, windows]
    runs-on: [self-hosted, Linux, X64, macstudio-rosetta]
    timeout-minutes: 20
    # A draft release is invisible to the install one-liner: its asset URLs
    # answer 404 without a token, and the API does not list it. The pipeline
    # left one behind on every run until now, which is why warren-cli served a
    # release from June while the app shipped weekly.
    #
    # Every platform gates: a release is the whole artifact set or it is not a
    # release.
    if: >-
      !cancelled() &&
      needs.resolve.outputs.publish == 'true' &&
      needs.linux.result == 'success' &&
      needs.linux-arm64.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success'
    env:
      GH_TOKEN: ${{ secrets.WARREN_CLI_RELEASE_TOKEN }}
      CLI_REPO: WarrenBrowse/warren-cli
      CLI_TAG: ${{ needs.resolve.outputs.cli-tag }}
      WARREN_CHANNEL: ${{ needs.resolve.outputs.channel }}
      WARREN_VERSION: ${{ needs.resolve.outputs.version }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
    steps:
      - uses: actions/checkout@v5
      - name: Ensure gh CLI
        # The self-hosted Rosetta runner does not ship it.
        run: |
          if command -v gh >/dev/null 2>&1; then echo "gh present: $(gh --version | head -1)"; exit 0; fi
          ver=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
                  | sed -nE 's/.*"tag_name": *"v?([0-9.]+)".*/\1/p' | head -1)
          [ -n "$ver" ] || ver=2.62.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          echo "/tmp/gh_${ver}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Download what the build jobs published
        run: |
          mkdir -p release-files
          gh release download "$CLI_TAG" --repo "$CLI_REPO" --dir release-files --pattern '*'
          ls -lh release-files

      # The set is asserted rather than assumed: a build job that succeeded
      # while uploading nothing (a glob that matched no file, a rename) would
      # otherwise publish a release with a hole in it, and the hole is only
      # found by the user whose platform is missing.
      - name: Assert every expected artifact is present
        run: |
          set -euo pipefail
          if [ "$WARREN_CHANNEL" = prod ]; then tag=""; else tag="-$WARREN_CHANNEL"; fi
          expected="
          warren-vpn-daemon${tag}_${WARREN_VERSION}_amd64.deb
          warren-vpn-daemon${tag}_${WARREN_VERSION}_x86_64.rpm
          warren-vpn-daemon${tag}_${WARREN_VERSION}_arm64.deb
          warren-vpn-daemon${tag}_${WARREN_VERSION}_aarch64.rpm
          warren-headless${tag}-${WARREN_VERSION}-linux-x86_64.tar.gz
          warren-headless${tag}-${WARREN_VERSION}-linux-aarch64.tar.gz
          warren-headless${tag}-${WARREN_VERSION}-macos-universal.tar.gz
          warren-headless${tag}-${WARREN_VERSION}-windows-x64.zip
          "
          missing=""
          for asset in $expected; do
            [ -f "release-files/$asset" ] || missing="$missing $asset"
          done
          if [ -n "$missing" ]; then
            echo "::error::the release is missing:$missing"
            exit 1
          fi
          echo "every expected artifact is present (windows job: $WINDOWS_RESULT)"

      - name: Compute SHA-256 checksums
        # The installers verify against this, which is what catches a download
        # truncated by a flaky link before it is unpacked as a corrupt package.
        run: |
          cd release-files
          rm -f SHA256SUMS
          shopt -s nullglob
          files=(*)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish it
        run: |
          set -euo pipefail
          gh release upload "$CLI_TAG" release-files/SHA256SUMS --repo "$CLI_REPO" --clobber
          notes="$RUNNER_TEMP/notes.md"
          awk -v ver="$WARREN_VERSION" '
            /^## /{ if (cap) exit; cap = index($0, "[" ver "]") > 0 }
            cap { print }
          ' CHANGELOG.md > "$notes" || true
          if [ ! -s "$notes" ]; then
            printf 'Warren headless (daemon + CLI) %s\n' "$WARREN_VERSION" > "$notes"
          fi
          installer="https://raw.githubusercontent.com/$CLI_REPO/main/scripts/install.sh"
          if [ "$WARREN_CHANNEL" = prod ]; then run="sudo CHANNEL=prod sh"; else run="sudo sh"; fi
          {
            echo
            echo '### Install (Linux and macOS)'
            echo
            echo '```sh'
            echo "curl -fsSL $installer | $run"
            echo '```'
          } >> "$notes"

          # A beta release never becomes the prod "latest": the two series are
          # independent lines, and an installer resolving "latest" must not be
          # handed the other channel's build.
          if [ "$WARREN_CHANNEL" = beta ]; then
            title="Warren headless Beta $WARREN_VERSION"
            prerelease=true
            latest=false
          else
            title="Warren headless (daemon + CLI) $WARREN_VERSION"
            prerelease=false
            latest=true
          fi
          gh release edit "$CLI_TAG" --repo "$CLI_REPO" \
            --title "$title" \
            --notes-file "$notes" \
            --draft=false \
            --prerelease="$prerelease" \
            --latest="$latest"

      - name: Verify the release is really published
        run: |
          for _ in $(seq 1 10); do
            if [ "$(gh release view "$CLI_TAG" --repo "$CLI_REPO" --json isDraft --jq .isDraft)" = "false" ]; then
              echo "https://github.com/$CLI_REPO/releases/tag/$CLI_TAG is published"
              exit 0
            fi
            sleep 3
          done
          echo "::error::$CLI_TAG is still a draft; the install one-liner cannot see it"
          exit 1
