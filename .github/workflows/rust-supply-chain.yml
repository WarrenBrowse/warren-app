---
name: Rust - Supply chain
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/rust-supply-chain.yml'
  # Daily so newly published advisories are caught even without a dependency change.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The daily run opens an issue when a newly published advisory fails it.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      # The cargo-deny action runs in a container that sees only this
      # checkout, not the sibling crates the workspace takes by path.
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny --locked --log-level warn check all

      # Run an additional license check for the iOS crate to catch GPL3 issues
      - name: Run cargo deny for iOS (GPL3 check)
        run: cargo deny --manifest-path warren-ios/Cargo.toml --log-level error check licenses

      - name: Open an issue when the daily scan finds something
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily supply-chain scan failed"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "an open issue already tracks it"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "cargo deny failed on the scheduled run: $RUN_URL"
