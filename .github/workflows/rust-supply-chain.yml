---
name: Rust - Supply chain
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/rust-supply-chain.yml'
  # Daily so newly published advisories are caught even without a dependency change.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The daily run opens an issue when a newly published advisory fails it.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: ./.github/actions/mullvad-build-env
        with:
          engine-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9  # v2.1.2
        with:
          log-level: warn
          rust-version: stable
          command: check all

      # Run an additional license check for the iOS crate to catch GPL3 issues
      - name: Run cargo deny for iOS (GPL3 check)
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9  # v2.1.2
        with:
          manifest-path: warren-ios/Cargo.toml
          log-level: error
          rust-version: stable
          command: check licenses

      - name: Open an issue when the daily scan finds something
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily supply-chain scan failed"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "an open issue already tracks it"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "cargo deny failed on the scheduled run: $RUN_URL"
