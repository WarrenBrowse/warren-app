---
# Warren: lightweight CI workflow for Warren-specific regressions.
#
# Why a workflow distinct from the broader `daemon.yml` / `clippy.yml`:
# those take ~30-60 min (cross-OS Android + desktop + iOS build).
# This one gives a fast signal (~5 min) on Warren-specific regressions
# (toggles, BIP39 identity, Local/Remote backends, Settings UI).
#
# Trigger: direct push to `main` / `warren-base` (the normal dev flow here),
# PRs targeting those branches, plus on-demand dispatch. Kept cheap so it does
# not burden direct main pushes: it is the only lightweight (~5 min) workflow,
# is paths-filtered to Warren code, and uses concurrency cancel-in-progress so
# rapid successive pushes supersede each other (at most one run at a time).

name: Warren checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - warren-base
    paths: &warren_paths
      - "mullvad-daemon/**"
      - "mullvad-api/**"
      - "mullvad-types/**"
      - "mullvad-management-interface/**"
      - "mullvad-cli/**"
      # Carries the signed update manifest and the force-update decision: a bug
      # here can hard-block every installed app, and it was ungated until a
      # "newer than the manifest is unsupported" verdict did exactly that.
      - "mullvad-update/**"
      - "talpid-warren-tunnel/**"
      - "talpid-core/**"
      - "warren-jni/**"
      - "warren-ios/**"
      # The iOS endpoint xcconfig is drift-gated against the product anchors by
      # a mullvad-daemon test, so an edit here must run the Warren test scope.
      - "ios/Configurations/**"
      - "mullvad-management-interface/proto/**"
      - "desktop/**"
      # The scenery layers only register if all three clients ship the same
      # canvas, and the test that pins them together lives in the desktop unit
      # suite, so an edit that touches only the Android or iOS copy must still
      # run this scope.
      - "android/lib/ui/resource/src/main/res/drawable-nodpi/**"
      - "ios/WarrenVPN/Supporting Files/Assets.xcassets/**"
      # The update-metadata generator decides the installer URLs that go inside
      # the signed manifests, and its unit tests run in this scope. Nothing else
      # gates the file, so an edit touching only it reached main untested.
      - "ci/build-version-metadata.py"
      - "ci/test_build_version_metadata.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".warrenguard-version"
      - ".warren-sdk-version"
      - ".warren-contract-version"
      - ".github/workflows/warren-checks.yml"
      - ".github/workflows/warren-tests.yml"
      - ".config/nextest.toml"
      - ".github/actions/mullvad-build-env/**"
  pull_request:
    branches:
      - main
      - warren-base
    paths: *warren_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Warren test scope (daemon cargo test/clippy/fmt + desktop UI
  # type-check/lint) lives in the reusable warren-tests.yml so the exact same
  # gate runs here (push/PR, fast feedback) and in release.yml (before any build
  # on a version tag). secrets: inherit forwards WARREN_CORE_RO_TOKEN for the
  # sibling repos checkout (warrenguard, warren-sdk-rs, warren-contract).
  warren-tests:
    uses: ./.github/workflows/warren-tests.yml
    secrets: inherit
