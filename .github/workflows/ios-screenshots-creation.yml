---
name: iOS create screenshots
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Take screenshots
    runs-on: macos-15-xlarge
    env:
      SOURCE_PACKAGES_PATH: .spm
      TEST_ACCOUNT: ${{ secrets.IOS_TEST_ACCOUNT_NUMBER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup project
        uses: ./.github/actions/ios/setup-project-toolchain

      - name: Copy relay list
        run: cp WarrenREST/Assets/relays-test-data.json WarrenREST/Assets/relays.json
        working-directory: ios

      - name: Add test account to config
        run: |
          sed -i "" \
            "/HAS_TIME_ACCOUNT_NUMBER =/ s#= .*#= 1234123412341234#" \
            UITests.xcconfig
        working-directory: ios/Configurations

      - name: Bundle
        run: bundle install
        working-directory: ios

      - name: Create screenshots
        run: bundle exec fastlane snapshot --cloned_source_packages_path "$SOURCE_PACKAGES_PATH"
        working-directory: ios

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ios-screenshots
          path: ios/Screenshots
