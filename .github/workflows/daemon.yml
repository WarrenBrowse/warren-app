---
name: Daemon+CLI - Build and test
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # mullvad-build-env checks out the ../warren-core path-dep target (needed for
      # `cargo metadata` to resolve) and sets up the toolchain, mirroring the
      # macOS/Windows jobs below. Without the warren-core checkout this job fails
      # at `cargo metadata`.
      - uses: ./.github/actions/mullvad-build-env
        with:
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Test crates
        run: ci/cargo-ci.sh test --workspace

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Test crates
        run: ci/cargo-ci.sh test --workspace

  build-windows:
    strategy:
      # Even if onw of the Windows jobs fail, the other should not be cancelled.
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.config.os }}
    steps:
      # By default, the longest path a filename can have in git on Windows is 260 character.
      - name: Set git config for long paths
        run: |
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          rust-cache-targets: "true"
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Build Windows modules (x86_64)
        if: ${{ matrix.config.arch == 'x64' }}
        shell: bash
        run: ./build-windows-modules.sh build winfw

      - name: Build Windows modules (ARM64)
        if: ${{ matrix.config.arch == 'arm64' }}
        shell: bash
        # By default, ./build-windows-modules.sh will use 4 concurrent processes during compilation
        # because the Windows 11 ARM runner has 4 cores:
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#standard-github-hosted-runners-for-public-repositories
        #
        # Cap the number of concurrent processes to something less than 4 to avoid OOM issues.
        run: ./build-windows-modules.sh --max-concurrent-processes 2 build winfw

      # Excluding windows-installer because it builds an actual full installer
      # at the build step, which is not desired in a CI environment. Instead
      # we just `cargo check` it below.
      - name: Test crates
        shell: bash
        run: ci/cargo-ci.sh test --workspace  --exclude windows-installer
