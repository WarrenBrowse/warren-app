---
# Warren fork — lightweight CI workflow specific to the `warren-base` branch.
#
# Why a workflow distinct from the existing Mullvad `daemon.yml` /
# `clippy.yml`: those trigger on `pull_request` (upstream Mullvad
# sync) and take ~30-60 min (cross-OS Android + desktop + iOS build).
# For daily dev on `warren-base` (direct push), we want a fast signal
# (~5 min) on Warren-specific regressions (toggles, BIP39 identity,
# Local/Remote backends, Settings UI).
#
# Trigger: direct push on `warren-base` or PR targeting that branch.
# Filtered by paths to only run when Warren code changes.

name: Warren fork CI

on:
  push:
    branches: [warren-base]
    paths:
      - 'mullvad-daemon/src/warren_*.rs'
      - 'mullvad-daemon/src/device/account_backend.rs'
      - 'mullvad-daemon/src/device/device_backend.rs'
      - 'mullvad-daemon/src/lib.rs'
      - 'mullvad-daemon/src/management_interface.rs'
      - 'mullvad-types/src/settings/mod.rs'
      - 'mullvad-api/src/warren_auth.rs'
      - 'mullvad-api/src/rest.rs'
      - 'mullvad-api/src/lib.rs'
      - 'mullvad-cli/src/cmds/warren.rs'
      - 'mullvad-management-interface/proto/management_interface.proto'
      - 'mullvad-management-interface/src/client.rs'
      - 'desktop/packages/mullvad-vpn/src/renderer/features/warren-mode/**'
      - 'desktop/packages/mullvad-vpn/src/renderer/components/views/vpn-settings/VpnSettingsView.tsx'
      - 'desktop/packages/mullvad-vpn/src/main/daemon-rpc.ts'
      - 'desktop/packages/mullvad-vpn/src/main/settings.ts'
      - 'desktop/packages/mullvad-vpn/src/main/default-settings.ts'
      - 'desktop/packages/mullvad-vpn/src/main/grpc-type-convertions.ts'
      - 'desktop/packages/mullvad-vpn/src/shared/daemon-rpc-types.ts'
      - 'desktop/packages/mullvad-vpn/src/shared/ipc-schema.ts'
      - 'desktop/packages/mullvad-vpn/src/shared/ipc-types.ts'
      - 'desktop/packages/mullvad-vpn/src/renderer/redux/settings/**'
      - 'desktop/packages/mullvad-vpn/src/renderer/app.tsx'
      - 'desktop/packages/management-interface/dist/**'
      - 'desktop/packages/mullvad-vpn/locales/messages.pot'
      - 'docs/warren-fork.md'
      - '.github/workflows/warren-fork.yml'
  pull_request:
    branches: [warren-base]

permissions:
  contents: read

jobs:
  daemon-warren-tests:
    name: Daemon Warren crates (cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env

      - name: cargo fmt --check (Warren scope)
        # Gate fmt in addition to clippy/test to avoid style drifts
        # on the fork branch (= consistent with the warren-core ci.yml
        # workflow which also gates fmt).
        run: cargo fmt --all -- --check

      - name: cargo test mullvad-daemon
        # Targets the crates touched by the fork. We avoid cargo test
        # --workspace so we do not run Android / iOS / Windows
        # specific tests on Linux (already covered by upstream daemon.yml).
        run: |
          cargo test --locked -p mullvad-daemon
          cargo test --locked -p mullvad-api
          cargo test --locked -p mullvad-types
          cargo test --locked -p mullvad-management-interface
          cargo test --locked -p mullvad-cli

      - name: cargo clippy mullvad-daemon
        run: |
          cargo clippy --locked -p mullvad-daemon -- -D warnings
          cargo clippy --locked -p mullvad-api -- -D warnings
          cargo clippy --locked -p mullvad-cli -- -D warnings

  desktop-warren-typecheck:
    name: Desktop Warren UI (type-check + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/packages/mullvad-vpn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies (workspace root)
        working-directory: desktop
        run: npm ci

      - name: TypeScript type-check
        # Includes the manual TS Phase H patches for the gRPC bindings.
        # Will regen automatically once we have executed the
        # mullvadvpn-app-build-node-grpc-bindings container (see warren-fork.md).
        run: npm run type-check

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Verify messages.pot is up-to-date
        # If TS code calls pgettext/gettext without an update-translations
        # re-run being committed, this check breaks. Prevents
        # divergence between pot and source.
        shell: bash
        run: |
          npm run update-translations
          if ! git diff --quiet -- locales/messages.pot; then
            echo "::error::messages.pot is stale. Run npm run update-translations and commit."
            git --no-pager diff -- locales/messages.pot | head -50
            exit 1
          fi
