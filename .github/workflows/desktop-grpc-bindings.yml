---
name: Desktop check gRPC bindings
on:
  # The desktop talks to the daemon through the committed bindings, so a .proto
  # change that is not regenerated reaches main as a silent IPC mismatch.
  push:
    branches: [main]
    paths: &grpc_paths
      - "mullvad-management-interface/proto/**"
      - "desktop/packages/management-interface/**"
      - ".github/workflows/desktop-grpc-bindings.yml"
  pull_request:
    paths: *grpc_paths
  workflow_dispatch:

# checkout needs contents:read to clone this PRIVATE fork; an empty permissions
# block (fine upstream where the repo is public) makes checkout 404.
permissions:
  contents: read

jobs:
  check-grpc-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The generator runs in its container, so the job needs no toolchain.
      - name: Generate bindings
        working-directory: desktop/packages/management-interface
        run: bash scripts/container-run-generate-bindings.sh

      - name: Check working directory is clean
        run: git diff --exit-code HEAD
