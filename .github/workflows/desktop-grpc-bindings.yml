---
name: Desktop check gRPC bindings
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  check-grpc-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env

      - name: Generate bindings
        working-directory: desktop
        run: npm run build -w management-interface

      - name: Check working directory is clean
        run: git diff --exit-code HEAD
