name: Win iterate (temp)
# Temporary workflow to iterate ONLY the Windows build on win-runner1
# without running macOS/Linux/Android. Delete once build-windows is green.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    name: Build Windows (iterate)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/mullvad-build-env
        with:
          rust-cache-targets: "true"
          warren-core-token: ${{ secrets.WARREN_CORE_RO_TOKEN }}

      - name: Build (unsigned)
        shell: bash
        run: ./build.sh --optimize --universal
