---
name: Translation check
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: desktop/package.json
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install JS dependencies
        working-directory: desktop
        shell: bash
        run: npm run ci

      - name: Check apostrophe style
        shell: bash
        run: scripts/check-apostrophe-style

      - name: Verify translations
        shell: bash
        run: scripts/localization verify
