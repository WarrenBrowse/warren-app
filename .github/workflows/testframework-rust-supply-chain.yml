---
name: Rust - Supply chain (Test framework)
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  check-test-framework-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo deny (test workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./test/Cargo.toml
          log-level: warn
          rust-version: stable
          command: check all
