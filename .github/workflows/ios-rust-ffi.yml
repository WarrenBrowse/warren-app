---
name: iOS - Build and test Rust FFI (warren-ios and mullvad-api)
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  build-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory '*'

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      - name: Build and test crates
        shell: bash
        # NOTE: Tests actually target macOS here. This is because we do not have an iOS runner
        #       handy.
        run: |
          time ci/cargo-ci.sh build --verbose --lib -p warren-ios -p mullvad-api --target ${{ matrix.target }}
          time ci/cargo-ci.sh test --verbose --lib -p warren-ios -p mullvad-api

  clippy-check-ios:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        run: |
          rustup target add ${{ matrix.target }}
          rustup component add clippy

      - name: Clippy check
        shell: bash
        run: |
          time ci/cargo-ci.sh clippy --all-targets --no-default-features -p warren-ios -p mullvad-api \
            --target ${{ matrix.target }}
          time ci/cargo-ci.sh clippy --all-targets --all-features -p warren-ios -p mullvad-api \
            --target ${{ matrix.target }}
