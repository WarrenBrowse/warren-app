---
name: Rust - Unused dependencies
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-shear
        uses: taiki-e/install-action@cargo-shear

      - name: Run cargo shear in all workspaces
        shell: bash
        run: |
          workspaces=$(find . -name Cargo.lock -type f -exec dirname {} \;)
          for workspace in $workspaces; do
              echo ""
              echo "[#] Checking workspace: $workspace"
              echo ""
              cargo shear "$workspace"
          done
