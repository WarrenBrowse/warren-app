name: Daemon+CLI - Build (Nix)
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --depth=1 dist-assets/binaries

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build desktop app
        run: nix develop -c build
