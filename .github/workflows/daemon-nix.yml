name: Daemon+CLI - Build (Nix)
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Checkout submodules
        run: git submodule update --init --depth=1 dist-assets/binaries

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590  # main, 2026-11-17

      - name: Build desktop app
        run: nix develop -c build
