---
name: Android - Static analysis
on:
  # Auto-triggers disabled in this fork: only release.yml runs on tag push.
  # Kept runnable on-demand via the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  mobsfscan:
    name: Code scanning using mobsfscan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Scan code
        uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353  # 0.4.5
        with:
          args: '--type android --config android/config/config.mobsf --exit-warning android'
