name: "Warren build env"
description: "Set up build environment for Warren (fork of Mullvad)"
inputs:
  rust-toolchain:
    description: "Rust toolchain (stable, beta, nightly, or version)"
    default: stable
    required: false
  rustup-components:
    description: "Space-separated Rustup components to install (e.g. rustfmt, clippy)"
    default: clippy
    required: false
  protoc-token:
    description: "Token for setup-protoc (defaults to GITHUB_TOKEN)"
    default: "${{ github.token }}"
    required: false
  rust-cache-targets:
    description: >-
      Determines whether workspace `target` directories are cached. If `false`,
      only the cargo registry will be cached. If `true`, the `target` directories
      will be cached as well.
    default: "false"
    required: false
  warren-core-token:
    description: >-
      PAT with read access to WarrenBrowse/warren-core. Required because
      warren-app's Cargo.toml has path-deps to ../warren-core/crates/*.
      Configure as secrets.WARREN_CORE_RO_TOKEN in workflow callers.
    default: ""
    required: false
  skip-warren-core:
    description: >-
      Set to 'true' to skip checking out the sibling repos (warren-core +
      warrenguard). Only safe for jobs that do not invoke cargo (e.g.,
      shellcheck, yamllint).
    default: "false"
    required: false
  engine-token:
    description: >-
      PAT with read access to WarrenBrowse/warrenguard (the AGPL engine repo
      that warren-core's keepers and the app's tunnel crates path-dep). If left
      empty, the warrenguard checkout falls back to warren-core-token (a
      composite-action input default cannot reference another input, so the
      fallback is applied in the checkout step).
    default: ""
    required: false
runs:
  using: "composite"
  steps:
    - name: Ensure rustup is on PATH
      # The self-hosted Linux runner ships rustup preinstalled for the runner
      # user (~/.cargo/bin) but does not export it to the job PATH, so the bare
      # `rustup` calls below (override/component/target add) fail with exit 127.
      # Prepend it here. Harmless where rustup is already on PATH (GitHub-hosted).
      shell: bash
      run: |
        if [ -d "$HOME/.cargo/bin" ]; then
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Read pinned warren-core SHA
      if: ${{ inputs.skip-warren-core != 'true' && inputs.warren-core-token != '' }}
      id: warren-core-pin
      shell: bash
      run: echo "sha=$(cat .warren-core-version)" >> "$GITHUB_OUTPUT"

    - name: Checkout warren-core (sibling repo, path-dep target)
      # Cloned manually instead of actions/checkout: the path-dep target lives at
      # ../warren-core (sibling of the workspace), which actions/checkout refuses
      # to write to ("not under $GITHUB_WORKSPACE"). git clone has no such limit.
      if: ${{ inputs.skip-warren-core != 'true' && inputs.warren-core-token != '' }}
      shell: bash
      env:
        WARREN_CORE_TOKEN: ${{ inputs.warren-core-token }}
        WARREN_CORE_SHA: ${{ steps.warren-core-pin.outputs.sha }}
      run: |
        set -euo pipefail
        dest="$(cd "$GITHUB_WORKSPACE/.." && pwd)/warren-core"
        rm -rf "$dest"
        git clone --filter=blob:none \
          "https://x-access-token:${WARREN_CORE_TOKEN}@github.com/WarrenBrowse/warren-core.git" "$dest"
        git -C "$dest" checkout --detach "$WARREN_CORE_SHA"
        git -C "$dest" remote set-url origin "https://github.com/WarrenBrowse/warren-core.git"
        # warren-core vendors a patched Quinn fork (gitignored) required by the
        # workspace [patch.crates-io] quinn/quinn-proto/quinn-udp entries. Regenerate
        # it (clones quinn 0.11.9 + applies Warren GSO/obfuscation patches) before cargo.
        ( cd "$dest" && ./bench/scripts/setup-quinn-fork.sh )

    - name: Read pinned warrenguard SHA
      if: ${{ inputs.skip-warren-core != 'true' && inputs.warren-core-token != '' }}
      id: warrenguard-pin
      shell: bash
      run: echo "sha=$(cat .warrenguard-version)" >> "$GITHUB_OUTPUT"

    - name: Checkout warrenguard (sibling engine repo, path-dep target)
      # The AGPL engine lives in its own repo; warren-core's keeper crates and
      # the app's tunnel crates path-dep ../warrenguard/crates/*. Same sibling
      # clone pattern as warren-core. No quinn-fork setup here: the app builds
      # the engine against warren-core's patched quinn via the workspace
      # [patch.crates-io], so warrenguard's own gitignored vendor/ is not needed.
      if: ${{ inputs.skip-warren-core != 'true' && inputs.warren-core-token != '' }}
      shell: bash
      env:
        ENGINE_TOKEN: ${{ inputs.engine-token != '' && inputs.engine-token || inputs.warren-core-token }}
        WARRENGUARD_SHA: ${{ steps.warrenguard-pin.outputs.sha }}
      run: |
        set -euo pipefail
        dest="$(cd "$GITHUB_WORKSPACE/.." && pwd)/warrenguard"
        rm -rf "$dest"
        git clone --filter=blob:none \
          "https://x-access-token:${ENGINE_TOKEN}@github.com/WarrenBrowse/warrenguard.git" "$dest"
        git -C "$dest" checkout --detach "$WARRENGUARD_SHA"
        git -C "$dest" remote set-url origin "https://github.com/WarrenBrowse/warrenguard.git"

    - name: Warn if warren-core checkout was skipped
      if: ${{ inputs.skip-warren-core != 'true' && inputs.warren-core-token == '' }}
      shell: bash
      run: |
        echo "::warning::warren-core was not checked out (no warren-core-token input)."
        echo "::warning::cargo commands relying on path-deps to ../warren-core/crates/* will fail."
        echo "::warning::Pass warren-core-token from the WARREN_CORE_RO_TOKEN secret in the calling workflow."

    - name: Ensure rustup is available (self-heal rust-cache cache-bin deletion)
      shell: bash
      run: |
        if command -v rustup >/dev/null 2>&1; then
          echo "rustup present: $(rustup --version 2>/dev/null | head -1)"
          exit 0
        fi
        # Swatinem/rust-cache's cache-bin deletes ~/.cargo/bin/rustup on the
        # persistent self-hosted runners (see the Setup Rust cache step). cache-bin
        # is false here, but a runner can already be missing rustup from an earlier
        # run, which surfaces as "rustup: command not found" in the steps below.
        # Reinstall it for this job only (no machine-PATH change); the toolchain
        # itself comes from rust-toolchain.toml on first cargo/rustup use.
        echo "::warning::rustup not found on this runner; reinstalling for the job"
        if [ "$RUNNER_OS" = "Windows" ]; then
          curl -sSfL https://win.rustup.rs/x86_64 -o "$RUNNER_TEMP/rustup-init.exe"
          "$RUNNER_TEMP/rustup-init.exe" -y --default-toolchain none --no-modify-path --profile minimal
          printf '%s\\.cargo\\bin\n' "$USERPROFILE" >> "$GITHUB_PATH"
        else
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    - name: Override Rust toolchain
      if: ${{ inputs.rust-toolchain != 'stable' }}
      shell: bash
      run: rustup override set ${{ inputs.rust-toolchain }}

    - name: Install Rust components
      if: ${{ inputs.rustup-components != '' }}
      shell: bash
      run: rustup component add ${{ inputs.rustup-components }}

    - name: Assert Cargo.lock <-> warren-core coherence (prevents silent quinn-patch drop)
      # GUARD: the warren-app Cargo.lock and the pinned warren-core (.warren-core-version)
      # must stay in lockstep. If they drift, cargo silently re-resolves on unsigned builds
      # (build.sh only enforces --locked when signing) and DROPS the [patch.crates-io] quinn
      # fork -> the app ships WITHOUT the Warren GSO/obfuscation patches. Fail loudly here
      # instead of building the wrong artifact. (Root-caused 2026-05-29.)
      if: ${{ inputs.skip-warren-core != 'true' && inputs.warren-core-token != '' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! grep -Eq 'version = "[0-9.]+-warren\.[0-9]+"' Cargo.lock; then
          echo "::error::Cargo.lock does not pin the Warren quinn fork (…-warren.N); the [patch.crates-io] is not locked. Regenerate Cargo.lock with the quinn-fork present and commit it."
          exit 1
        fi
        if ! cargo metadata --locked --format-version=1 >/dev/null; then
          echo "::error::Cargo.lock is out of sync with the pinned warren-core (.warren-core-version=$(cat .warren-core-version))."
          echo "::error::Fix: bump .warren-core-version to the warren-core commit Cargo.lock was generated against, OR regenerate Cargo.lock with the quinn-fork present (cargo update -p quinn -p quinn-proto -p quinn-udp) and commit it."
          exit 1
        fi
        echo "coherence OK: Cargo.lock pins the Warren quinn fork and matches the pinned warren-core."

    # x86 for NSIS plugins; aarch64 for the --universal (x64+ARM64) Windows build
    - name: Install Rust Windows targets
      if: runner.os == 'Windows'
      shell: bash
      run: rustup target add i686-pc-windows-msvc aarch64-pc-windows-msvc

    # Universal macOS builds (build.sh --universal) link both arch slices
    - name: Install Rust x86_64 target (macOS universal builds)
      if: runner.os == 'macOS'
      shell: bash
      run: rustup target add x86_64-apple-darwin

    - name: Set CARGO_TARGET_DIR env
      shell: bash
      run: |
        if [[ -n "$CARGO_TARGET_DIR" ]]; then
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> $GITHUB_ENV
        fi

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        add-job-id-key: "false"  # Preserve cache across jobs
        cache-directories: >-
          ${{ inputs.rust-cache-targets == 'true' && env.CARGO_TARGET_DIR || '' }}
        cache-targets: ${{ inputs.rust-cache-targets }}
        # `cache-bin` causes `~/.cargo/bin/rustup` to be deleted for self-hosted runners
        # See https://github.com/Swatinem/rust-cache/issues/16
        cache-bin: false

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ inputs.protoc-token }}

    - name: Checkout Mullvad binaries submodule
      # macOS does not depend on any of our binaries.
      if: runner.os != 'macOS'
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --depth=1 dist-assets/binaries

    - name: Checkout Windows libraries submodule
      # These libraries are only required if building for Windows.
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global --add safe.directory '*'
        git submodule update --init --depth=1 windows

    - name: Calculate Windows libraries cache hash
      if: runner.os == 'Windows'
      id: windows-modules-hash
      shell: bash
      run: |
        hash="$(git grep --recurse-submodules --cached -l '' -- './windows/' \
          | grep -v '\.exe$\|\.md$' \
          | xargs sha1sum \
          | sha1sum \
          | cut -d" " -f1)"
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache Windows libraries
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ./windows/*/bin/
        key: windows-modules-${{ steps.windows-modules-hash.outputs.hash }}

    - name: Install msbuild
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: latest

    - name: Install latest zig
      if: runner.os == 'Windows'
      uses: mlugg/setup-zig@v2
      with:
        version: 0.14.1

    - name: Install build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install libdbus-1-dev

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.21.3

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version-file: desktop/package.json
        cache: "npm"
        cache-dependency-path: desktop/package-lock.json
