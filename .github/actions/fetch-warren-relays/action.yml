name: Fetch + verify Warren exit list bootstrap
description: >
  Fetches the live signed Warren exit list from GET {warren-api-url}/v1/exits,
  verifies its Ed25519 signature against the pinned production server pubkey
  (build-time, authoritative canonicalization via warren-core's
  warren_relays_verify), and writes it to dist-assets/warren-relays.json so the
  packaged client ships with an up-to-date bootstrap cache. Freshly installed
  clients then start pre-populated; the daemon's WarrenRelayListUpdater keeps it
  refreshed at runtime.

  Robustness: a fetch failure (API down / offline runner) is a WARNING, not a
  failure — the client ships without a baked list and fetches on first launch.
  A successfully fetched but signature-INVALID list FAILS the build (never bake
  an unverifiable bootstrap).

inputs:
  warren-api-url:
    description: Base URL of the warren-api backend.
    required: false
    default: https://api.warrenbrowse.com
  expected-pubkey:
    description: >
      Pinned Ed25519 server pubkey (64-char hex). MUST mirror
      warren_config::WARREN_SERVER_PUBKEY_HEX in warren-core.
    required: false
    default: 4c2c9253c426ae4db4cc88703f9ac802a020420c7fea6479c87af530ada72c3e

runs:
  using: composite
  steps:
    - name: Fetch + verify + bake warren-relays.json
      shell: bash
      run: |
        set -uo pipefail
        OUT="dist-assets/warren-relays.json"
        URL="${{ inputs.warren-api-url }}/v1/exits"
        echo "Fetching signed Warren exit list: $URL"
        if ! curl -fsS --max-time 30 "$URL" -o "$OUT"; then
          echo "::warning title=Warren bootstrap::could not fetch $URL; shipping WITHOUT a baked exit list (clients fetch on first launch)"
          rm -f "$OUT"
          exit 0
        fi
        echo "Verifying signature against pinned server pubkey (build-time gate)…"
        # warren-core is checked out as a sibling by the mullvad-build-env
        # action; the verifier reuses the daemon's exact canonicalization.
        if ! cargo run --quiet \
            --manifest-path ../warren-core/Cargo.toml \
            -p warren-relay-selector --bin warren_relays_verify -- \
            "$OUT" --expected-pubkey "${{ inputs.expected-pubkey }}"; then
          echo "::error title=Warren bootstrap::fetched exit list FAILED signature verification; refusing to bake into the release"
          rm -f "$OUT"
          exit 1
        fi
        echo "Baked verified warren-relays.json ($(wc -c < "$OUT" | tr -d ' ') bytes)"
