name: Codemagic build
description: >
  Run one workflow of this repository's codemagic.yaml on a Codemagic machine,
  on the job's exact commit, and wait for it. Each Codemagic step log is
  replayed into this job's log as the step ends, cancelling this job cancels
  the build, and on success the build's outputs are rebuilt into out-dir and
  verified against the checksum list the build wrote. Every Warren Windows job
  runs through it. Canonical copy in warren-app; warren-sdk-rs, warren-sdk-ts
  and wclaude carry byte-identical copies of this directory, because GitHub
  cannot fetch an action out of warren-app (its tree holds an absolute
  symlink the action extractor refuses). Contract and trade-offs: the
  warren-codemagic skill in the workspace.
inputs:
  app-id:
    description: Codemagic application id of this repository (repo variable CODEMAGIC_APP_ID).
    required: true
  workflow:
    description: Workflow id in codemagic.yaml.
    required: true
  inputs:
    description: >
      KEY=VALUE lines passed as the workflow's build inputs. The commit is
      always passed as `sha` by the action itself and cannot be overridden.
    required: false
    default: ""
  out-dir:
    description: Where the verified outputs land. Empty skips the download.
    required: false
    default: ""
  token:
    description: Codemagic API token (org secret CODEMAGIC_API_TOKEN).
    required: true
outputs:
  build-id:
    description: Codemagic build id.
    value: ${{ steps.run.outputs.build-id }}
  build-url:
    description: Codemagic build page.
    value: ${{ steps.run.outputs.build-url }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        CODEMAGIC_API_TOKEN: ${{ inputs.token }}
        CM_APP_ID: ${{ inputs.app-id }}
        CM_WORKFLOW: ${{ inputs.workflow }}
        CM_INPUTS: ${{ inputs.inputs }}
        CM_OUT_DIR: ${{ inputs.out-dir }}
      run: |
        exec python3 "$GITHUB_ACTION_PATH/codemagic_build.py" \
          --app-id "$CM_APP_ID" --workflow "$CM_WORKFLOW" \
          --inputs "$CM_INPUTS" --out-dir "$CM_OUT_DIR"
