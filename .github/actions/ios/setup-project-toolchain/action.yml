name: 'Setup project toolchain'
description: 'Setup Xcode project and install toolchain'
inputs:
  ios_rust_target:
    description: 'iOS target device'
    type: choice
    default: aarch64-apple-ios-sim
    options:
      - aarch64-apple-ios-sim
      - aarch64-apple-ios
    required: true
  xcode_version:
    description: >
      Xcode to select. Empty keeps the runner image's own default, which is
      what a toolchain newer than the pin below needs: the test sources use
      `SendableMetatype` (Swift 6.2), and 16.4 cannot compile it.
    default: '16.4'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Checkout submodules
      run: |
        git config --global --add safe.directory '*'
      shell: bash

    - name: Configure cache
      uses: actions/cache@v3
      with:
        path: ios/${{ env.SOURCE_PACKAGES_PATH }}
        key: ${{ runner.os }}-spm-${{ hashFiles('ios/**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Setup go-lang
      uses: actions/setup-go@v3
      with:
        go-version: 1.21.13

    - name: Configure Rust
      run: rustup target add ${{ inputs.ios_rust_target }}
      shell: bash

    - name: Update brew's internal repository
      run: brew update
      shell: bash

    - name: Install xcbeautify
      run: |
        brew install xcbeautify
      shell: bash

    - name: Install protobuf
      run: |
        brew install protobuf
      shell: bash

    - name: Setup Xcode
      if: inputs.xcode_version != ''
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode_version }}

    - name: Configure Xcode project
      run: |
          for file in *.xcconfig.template ; do cp $file ${file//.template/} ; done
      working-directory: ios/Configurations
      shell: bash
