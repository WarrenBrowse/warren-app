[package]
name = "warren-jni"
edition.workspace = true
rust-version.workspace = true
description = "JNI interface for Warren VPN Android client"
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Cross-platform deps. The pure-rust `wallet` module is unit-tested on the
# host, so its transitive deps (`warren-identity`, `bip39`, `ed25519-dalek`)
# must not be Android-only. `thiserror` is here for the same reason.
[dependencies]
thiserror = { workspace = true }
hex = "0.4"
# 16 bytes of OS entropy for the forum-login request nonce. This is the only
# JNI call site that mints its own nonce (every other signed call goes through
# the warren-api client, which nonces internally); cross-platform so the nonce
# helper stays host-testable.
getrandom = "0.2"
# Explicit versions (rather than `{ workspace = true }`): warren-app's
# workspace.dependencies does not pin bip39 / ed25519-dalek. Both are
# pinned with `=` to the same exact versions that warren-core uses so
# the resolved graph stays single-version AND no silent minor bump of
# a crypto crate that produces signed requests can sneak through.
# cf. AUDIT_COMPLET.md M-3.
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize", "rand_core"] }
warren-identity = { path = "../../warren-sdk-rs/crates/warren-identity" }
# Fix L-2: wrap the mnemonic string in Zeroizing<String> so it is wiped
# from memory immediately after the signing key is derived.
zeroize = { workspace = true }
# Fix M-3: parking_lot::Mutex does not poison on panic, eliminating the
# permanent ACTIVE_TUNNEL lock-up that std::sync::Mutex causes when a JNI
# thread panics while holding the guard. Listed in [dependencies] (not
# Android-only) so the behaviour can be exercised by host tests.
parking_lot = "0.12.0"

# Android-only deps: the JNI surface + log + Tokio runtime for the (still
# stubbed) tunnel lifecycle exports.
[target.'cfg(target_os = "android")'.dependencies]
jnix = { version = "0.5.1", features = ["derive"] }
log = { workspace = true }
log-panics = "2"
# `android_logger` bridges the `log` crate to the Android logcat subsystem
# so `log::info!` from any of our deps shows up under `adb logcat -s
# WarrenJni:V` without per-call ceremony.
android_logger = "0.15"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

# Warren auth wallet + relay selector + HTTP API client - these crates build
# cleanly for `target_os = "android"` today.
warren-discovery-core = { path = "../../warren-contract/warren-discovery" }
# Signed HTTP client for warren-api, consumed with the bundled reqwest
# transport. Every call site here is stateless (mnemonic passed in fresh
# from Kotlin), so a plain owned `WarrenIdentity` per call is enough - no
# hot-swap wrapper needed (contrast `mullvad-daemon::warren_sdk_client`).
warren-api = { path = "../../warren-sdk-rs/crates/warren-api", features = ["reqwest-transport"] }

# Signed app-update manifest fetch + ed25519 verification, reused as-is from the
# desktop path so the mobile version check applies the exact same verified rule
# (Android-only: it pulls reqwest; the host build only compiles the stub).
mullvad-update = { path = "../mullvad-update", features = ["client"] }
mullvad-version = { path = "../mullvad-version" }

# Platform metadata still useful for ApiEndpoint user-agent strings; kept from upstream.
talpid-platform-metadata = { path = "../talpid-platform-metadata" }
talpid-types = { path = "../talpid-types" }

# Quinn tunnel + multi-hop + NAT-PMP are wired behind the `tunnel` feature.
# The client transport ships an `AndroidTun` PacketDevice impl (cf.
# `warrenguard/crates/warrenguard-transport/src/android_tun.rs`).
warrenguard-transport = { path = "../../warrenguard/crates/warrenguard-transport", optional = true }
warrenguard-transport-core = { path = "../../warrenguard/crates/warrenguard-transport-core", optional = true }
warrenguard-daita = { path = "../../warrenguard/crates/warrenguard-daita", optional = true }
warrenguard-pump = { path = "../../warrenguard/crates/warrenguard-pump", optional = true }
warrenguard-wire = { path = "../../warrenguard/crates/warrenguard-wire", optional = true }
warrenguard-multihop = { path = "../../warrenguard/crates/warrenguard-multihop", optional = true }
warrenguard-natpmp-client = { path = "../../warrenguard/crates/warrenguard-natpmp-client", optional = true }
# Aliased rand 0.9 (matching `warrenguard-transport`'s `rand_v9`) so the DAITA
# pool pick's `Rng + RngCore` trait bounds line up; used only to seed a local
# DaitaState for the multi-hop DAITA pump.
rand_v9 = { package = "rand", version = "0.9", optional = true }

[dev-dependencies]
# Host-only: reconstruct the SHA-256 body hash in the forum-login signing
# test to verify the signature against the canonical POST message.
sha2 = "0.10"

[features]
default = ["tunnel"]
# Allow the API endpoint URL to be overridden at runtime (dev/staging).
api-override = []
# Pull in the Quinn tunnel stack. Enabled by default: ships
# `warrenguard_transport::AndroidTun` (wraps the VpnService TUN fd).
tunnel = [
  "dep:warrenguard-transport",
  "dep:warrenguard-transport-core",
  "dep:warrenguard-daita",
  "dep:warrenguard-pump",
  "dep:warrenguard-wire",
  "dep:warrenguard-multihop",
  "dep:warrenguard-natpmp-client",
  "dep:rand_v9",
]

[lints]
workspace = true
