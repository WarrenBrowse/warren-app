[package]
name = "warren-jni"
edition.workspace = true
rust-version.workspace = true
description = "JNI interface for Warren VPN Android client"
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
jnix = { version = "0.5.1", features = ["derive"] }
log = { workspace = true }
log-panics = "2"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
hex = "0.4"

# Warren auth wallet + relay selector + HTTP API client - these crates build
# cleanly for `target_os = "android"` today.
warren-identity = { path = "../../warren-core/crates/warren-identity" }
warren-relay-selector = { path = "../../warren-core/crates/warren-relay-selector" }
warren-api-client = { path = "../../warren-core/crates/warren-api-client" }

# Platform metadata still useful for ApiEndpoint user-agent strings; kept from upstream.
talpid-platform-metadata = { path = "../talpid-platform-metadata" }
talpid-types = { path = "../talpid-types" }

# Quinn tunnel + multi-hop + NAT-PMP are wired behind the `tunnel` feature.
# Warren-tunnel currently uses `tun-rs::DeviceBuilder`, which has no
# Android backend in tun-rs 2.8. D.4 introduces an Android `PacketDevice`
# adapter in warren-core that wraps the VpnService-provided TUN fd; the
# feature gets enabled here once that lands.
warren-tunnel = { path = "../../warren-core/crates/warren-tunnel", optional = true }
warren-client = { path = "../../warren-core/crates/warren-client", optional = true }
warren-multihop = { path = "../../warren-core/crates/warren-multihop", optional = true }
warren-natpmp-client = { path = "../../warren-core/crates/warren-natpmp-client", optional = true }

[features]
default = []
# Allow the API endpoint URL to be overridden at runtime (dev/staging).
api-override = []
# Pull in the Quinn tunnel stack. Requires warren-core to ship an Android
# `PacketDevice` (D.4 work).
tunnel = ["dep:warren-tunnel", "dep:warren-client", "dep:warren-multihop", "dep:warren-natpmp-client"]

[lints]
workspace = true
