### Android properties ###
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.nonTransitiveRClass=false
android.useAndroidX=true


### Kotlin properties ###
kotlin.code.style=official


### Gradle properties ###
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx8192M -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.parallel=true


### Warren app properties ###

# Show in app version notifications
warren.app.config.inAppVersionNotifications.enable=true

# Optional property to override the version name and code
# app.config.override.versionName=
# app.config.override.versionCode=

# Targets to build the daemon for
warren.app.build.cargo.targets=arm,arm64,x86,x86_64

# Perform a clean the cargo before each build
warren.app.build.cargo.cleanBuild=true

# If true, debug symbols are generated for release builds and not just debug builds.
warren.app.build.cargo.generateDebugSymbolsForReleaseBuilds=false

# Keep debug symbols if they exist. This will cause the artifacts
# to be substantially larger.
warren.app.build.keepDebugSymbols=false

# Emit the Compose compiler stability reports and metrics into each module's
# build/compose_reports and build/compose_metrics (an input of the build cache
# key, so off by default).
warren.app.build.compose.reports=false

# Replace source file path prefixes in the Rust build artifacts with fixed values.
# This must be set to true for the app build to be reprodcible, but should be set to false
# when debugging to the Rust native libs from Android Studio.
warren.app.build.replaceRustPathPrefix=true

## Instrumented tests ##

# A connected test run ends with AGP uninstalling the app under test, which
# erases its data (the wallet included) on the device. Installing over the
# running app instead keeps it.
android.injected.androidTest.leaveApksInstalledAfterRun=true
