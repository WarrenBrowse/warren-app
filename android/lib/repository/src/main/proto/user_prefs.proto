syntax = "proto3";

option java_package = "com.warrenbrowse.vpn.repository";
option java_multiple_files = true;

message UserPreferences {
  bool is_privacy_disclosure_accepted = 1;
  int32 last_shown_changelog_version_code = 2;
  int64 account_expiry_unix_time_seconds = 3;
  bool show_android_16_connect_warning = 4;
  bool show_location_in_system_notification = 5;
  bool show_system_apps_split_tunneling = 6;
  // Version string of the update prompt the user dismissed. Empty means
  // nothing was dismissed; a newer upgrade raises the banner again.
  string dismissed_upgrade_version = 7;
  // Set once, after an app update, when the OS is NOT holding the network
  // closed for this app (Always-on VPN + "Block connections without VPN").
  // Neither mobile OS lets an app seal the network while it is being replaced,
  // so that system setting is the only thing that covers the window. Unset when
  // the setting could not be read: a device that hides it must not be told it
  // is unprotected.
  bool show_always_on_vpn_advice = 8;
  // Keys of the operator notices the user has put away, one entry per notice
  // (id plus a digest of its wording, see WarrenNotice.dismissalKey). The
  // banner holds one card and ranks the notice on top, so an informational
  // notice standing for days would otherwise hide the update prompt and the
  // expiry warning under it for as long as the operator leaves it up.
  repeated string dismissed_notices = 9;
  // Ids of the launch announcements the reader has put away, one entry per
  // announcement. The id alone, unlike a notice key: an announcement is an
  // event with a server-assigned id that stands for the life of the campaign,
  // so a card put away must not come back on every launch with the code it
  // already handed over.
  repeated string dismissed_announcements = 10;
}
