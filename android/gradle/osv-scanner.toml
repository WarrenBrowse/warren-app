# See repository root `osv-scanner.toml` for instructions and rules for this file.
#
# Every entry below is build or test tooling that Gradle downloads (the Android
# Gradle Plugin, lint, bundletool, jetifier, the benchmark libraries, Gradle's own
# Kotlin DSL). None of these libraries is packaged in the APK, whose network stack
# is the Rust library; re-check that claim against the release mapping before
# renewing an entry.

# guava: unsafe deserialization in its compact collections.
[[IgnoredVulns]]
id = "CVE-2026-102554" # GHSA-xxph-c9ww-hj94
ignoreUntil = 2027-02-18
reason = "Full guava is on the classpath of AGP and lint only; the app ships just the ListenableFuture interface artifact and deserializes nothing with guava."

# wire-runtime: decoder crash on a crafted length.
[[IgnoredVulns]]
id = "CVE-2026-63126" # GHSA-9rm7-3qhh-h2mc
ignoreUntil = 2027-02-18
reason = "Pulled by the androidx.benchmark libraries of the baseline profile test module, which decode traces they record themselves. Not in the app."

# commons-lang3: uncontrolled recursion on long inputs.
[[IgnoredVulns]]
id = "CVE-2025-48924" # GHSA-j288-q9x7-2f5v
ignoreUntil = 2027-02-18
reason = "Pulled by commons-compress inside the build tooling, on inputs the build produces. Not in the app."

# httpclient: cross-site scripting.
[[IgnoredVulns]]
id = "CVE-2020-13956" # GHSA-7r82-7xv7-xcpj
ignoreUntil = 2027-02-18
reason = "Apache HttpClient is used by lint, not by the app, and renders no HTML."

# jose4j: denial of service through compressed JWE content.
[[IgnoredVulns]]
id = "CVE-2024-29371" # GHSA-3677-xxcr-wjqv
ignoreUntil = 2027-02-18
reason = "Pulled by bundletool at build time, which parses no JWE from outside. Not in the app."

# bouncycastle: weak algorithm, name constraints bypass, ASN.1 nesting guard.
[[IgnoredVulns]]
id = "CVE-2026-5588" # GHSA-wg6q-6289-32hp
ignoreUntil = 2027-02-18
reason = "Bouncy Castle comes with AGP (apkzlib, builder, sdk-common), which uses it to sign the APK with our own keys. Not in the app."

[[IgnoredVulns]]
id = "CVE-2026-8763" # GHSA-9pwp-9qqc-pr26
ignoreUntil = 2027-02-18
reason = "Same as CVE-2026-5588: AGP's signing tooling only; it validates no third-party certificate chain."

[[IgnoredVulns]]
id = "CVE-2026-13506" # GHSA-qp49-qgx5-5m26
ignoreUntil = 2027-02-18
reason = "Same as CVE-2026-5588: AGP's signing tooling only, parsing ASN.1 the build produces."

# jdom2: XML external entity injection.
[[IgnoredVulns]]
id = "CVE-2021-33813" # GHSA-2363-cqg2-863c
ignoreUntil = 2027-02-18
reason = "Pulled by jetifier-processor in AGP, which reads the XML of our own dependencies. Not in the app."

# kotlin-gradle-plugin: code execution through a tampered build cache.
[[IgnoredVulns]]
id = "CVE-2026-53914" # GHSA-r937-wjx7-w2jp
ignoreUntil = 2027-02-18
reason = """
The project builds with Kotlin 2.4.21, which carries the fix. The 2.4.10 copy is the one
Gradle 9.8.2 embeds for its Kotlin DSL, and exploiting it needs write access to the local
build cache of the runner (no remote cache is configured). It goes with the next Gradle.
"""
