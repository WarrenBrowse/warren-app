# A second licence check for the iOS app's Rust dependency tree, which ships
# through the App Store: no copyleft crate enters it unless it is named below,
# so each one is a decision someone took. The list holds exactly the crates the
# tree contains (cargo deny warns about an exception nothing matches).
# It does not override the main deny.toml file and needs to be run separately.
# See .github/workflows/rust-supply-chain.yml for the workflow that runs this check.

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MPL-2.0",
  "WTFPL",
  "ISC",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
# Allow GPL3 licensed crates with permission to relicense like Mullvads own,
# and the WarrenBrowse crates, GPL in this workspace and AGPL in the engine,
# contract and SDK, of which Warren is the sole copyright holder. Whether the
# Mullvad code itself may ship through the App Store is a separate legal
# question, which this check does not answer.
exceptions = [
  { crate = "warren-api", allow = ["AGPL-3.0-or-later"] },
  { crate = "warren-contract", allow = ["AGPL-3.0-or-later"] },
  { crate = "warren-discovery-core", allow = ["AGPL-3.0-or-later"] },
  { crate = "warren-identity", allow = ["AGPL-3.0-or-later"] },
  { crate = "warrenguard-config", allow = ["AGPL-3.0-or-later"] },
  { crate = "warrenguard-identity", allow = ["AGPL-3.0-or-later"] },
  { crate = "warrenguard-multihop", allow = ["AGPL-3.0-or-later"] },
  { crate = "warrenguard-token", allow = ["AGPL-3.0-or-later"] },
  { crate = "warrenguard-wire", allow = ["AGPL-3.0-or-later"] },
  { crate = "warren-forum", allow = ["GPL-3.0-or-later"] },
  { crate = "warren-incidents", allow = ["GPL-3.0-or-later"] },
  { crate = "warren-ios", allow = ["GPL-3.0-or-later"] },
  { crate = "warren-product-env", allow = ["GPL-3.0-or-later"] },
  { crate = "warren-standing", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-api", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-api-constants", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-fs", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-logging", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-types", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-update", allow = ["GPL-3.0-or-later"] },
  { crate = "mullvad-version", allow = ["GPL-3.0-or-later"] },
  { crate = "talpid-future", allow = ["GPL-3.0-or-later"] },
  { crate = "talpid-time", allow = ["GPL-3.0-or-later"] },
  { crate = "talpid-types", allow = ["GPL-3.0-or-later"] },
]
