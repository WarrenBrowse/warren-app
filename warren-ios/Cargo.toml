[package]
name = "warren-ios"
edition.workspace = true
rust-version.workspace = true
description = "Warren entry point for all FFI code on iOS"
repository.workspace = true
license.workspace = true

[lib]
bench = false
crate-type = ["staticlib"]

# Cross-platform Warren deps. The pure-rust `warren-identity` and
# `warren-api-client` build cleanly on host + iOS targets, so they live
# outside the `cfg(target_os = "ios")` gate to keep host unit tests
# building. Same pattern as `warren-jni` for Android.
[dependencies]
thiserror = { workspace = true }
hex = "0.4"
bip39 = { version = "2", features = ["rand"] }
# Pinned (=2.2.0) to align with every other Warren crate that handles
# signing keys. A silent minor bump of a crypto crate that produces
# X-Warren-Sig headers must never be acceptable without an explicit
# version bump + signature regression test. cf. AUDIT_COMPLET.md M-3.
ed25519-dalek = { version = "=2.2.0", features = ["zeroize", "rand_core"] }
# Explicit dep for `Zeroizing<[u8;32]>` wrappers in wallet FFI (M-2).
# The `zeroize` crate is already a transitive dep via ed25519-dalek; this
# direct dep makes the version coupling explicit and prevents it from being
# silently removed if ed25519-dalek changes its dep tree.
zeroize = { workspace = true }
warren-identity = { path = "../../warren-core/crates/warren-identity" }
warren-api-client = { path = "../../warren-core/crates/warren-api-client" }
warren-relay-selector = { path = "../../warren-core/crates/warren-relay-selector" }
# Cross-platform so the exit-pubkey pin store (`warren_pin_store`) and the
# multi-hop generation store (`warren_multihop_generation`), plus their
# pure-logic host tests, build off the iOS target too. serde_json + tracing
# were iOS-only before; they now also back the stores' JSON persistence and
# their `tracing::warn!` diagnostics on the host test build.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
futures = { workspace = true }
hyper = { version = "1.4.1", features = ["client", "http1"] }
hyper-util = { workspace = true }
libc = "0.2"
log = { workspace = true }
mockito = { workspace = true }
# Mullvad API client retained transitionally for legacy account-number flows
# in `src/api_client/`. To be replaced by `warren-api-client` in the
# C.3 deep-step-2 follow-up (cf. `.planning/session-c-followup-briefs.md`).
mullvad-api = { path = "../mullvad-api", default-features = false }
mullvad-encrypted-dns-proxy = { path = "../mullvad-encrypted-dns-proxy" }
mullvad-logging = { path = "../mullvad-logging" }
mullvad-types = { path = "../mullvad-types" }
shadowsocks = { workspace = true }
talpid-future = { path = "../talpid-future" }
# Note: talpid-platform-metadata lacks an iOS backend ; it only ships
# macos/windows/android impls. Warren iOS uses
# `UIDevice.systemVersion` / `UIDevice.model` directly via Swift, which
# the Swift side passes to FFI as platform user-agent string.
talpid-types = { path = "../talpid-types" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }

# Quinn tunnel + multi-hop + NAT-PMP are gated behind the `tunnel` feature,
# enabled by the iOS Xcode build phase (build-rust-library.sh warren-ios
# "api-override tunnel"). warren-tunnel bridges the iOS packet flow via
# `IosTun` (`NEPacketTunnelFlow.readPackets/writePackets`, cf.
# `.planning/c4-packet-tunnel-provider-quinn-design.md` §3.2), so it no
# longer depends on a tun-rs iOS backend.
warren-tunnel = { path = "../../warren-core/crates/warren-tunnel", optional = true }
warren-client = { path = "../../warren-core/crates/warren-client", optional = true }
warrenguard-multihop = { path = "../../warrenguard/crates/warrenguard-multihop", optional = true }
warrenguard-natpmp-client = { path = "../../warrenguard/crates/warrenguard-natpmp-client", optional = true }
# Direct dep on `warrenguard-wire` for `WarrenExitAddr` + `WarrenPubkey`
# types passed to `warren_tunnel::ClientTunnel::connect`. Optional so
# the no-tunnel build path stays minimal.
warrenguard-wire = { path = "../../warrenguard/crates/warrenguard-wire", optional = true }
# Multi-hop supervisor + pump support (the iOS data plane rides the
# multi-hop wire protocol; see `warren_multihop_directory`). `Backoff`
# is a `SupervisorConfig` field.
warrenguard-backoff = { path = "../../warrenguard/crates/warrenguard-backoff", optional = true }
# Canonical baked API server pin (`WARREN_SERVER_PUBKEY_HEX`), reused as
# the multi-hop directory's server-key pin so the value never drifts from
# the daemon's. Already in the iOS dep tree via warren-client/-tunnel.
warren-config = { path = "../../warren-core/crates/warren-config", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen = { version = "0.28.0", default-features = false }

[features]
default = []
# Allow the API server to be used
api-override = ["mullvad-api/api-override"]
# Pull in the Quinn tunnel stack. The iOS `PacketDevice` bridge (`IosTun`)
# has landed, so the iOS Xcode build phase enables this feature. It stays
# off the crate default so a no-tunnel host build path remains minimal.
tunnel = ["dep:warren-tunnel", "dep:warren-client", "dep:warrenguard-multihop", "dep:warrenguard-natpmp-client", "dep:warrenguard-wire", "dep:warrenguard-backoff", "dep:warren-config"]

[lints]
workspace = true
