[package]
name = "talpid-warren-iroh"
edition.workspace = true
rust-version.workspace = true
description = "Warren — adaptateur Iroh pour le tunnel state machine talpid (POC)"
repository.workspace = true
license.workspace = true

[dependencies]
futures = { workspace = true }
ipnetwork = { workspace = true }
talpid-routing = { path = "../talpid-routing" }
talpid-tunnel = { path = "../talpid-tunnel" }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "io-util"] }
log = { workspace = true }

# `tun08` = même crate `tun = 0.8.x` que `talpid-tunnel` (default features
# pour avoir async). Pin strict sur la même version pour éviter le
# diamond dependency entre `talpid-tunnel::tun_provider::unix.rs` (qui
# expose `tun08::AsyncDevice` via `into_async_device`) et l'adapter
# `MullvadTunPacketDevice` côté Warren.
tun08 = { package = "tun", version = "0.8.5", default-features = false, features = [
  "async",
] }

# Warren POC crates (path-deps cross-repo via local workspace).
# Pour la prod long-terme, ces crates devront être publiées sur un
# registry privé (ex: cargo-binstall + Gitea registry) ou intégrées
# directement comme submodule du fork.
warren-iroh-tunnel = { path = "../../warren-core/crates/warren-iroh-tunnel" }

# Iroh types réexposés dans l'API publique (EndpointId, EndpointAddr,
# SecretKey). Pin strict sur la même version que `warren-iroh-tunnel`
# pour éviter le diamond dependency.
iroh = { version = "=0.98.2", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
  "std",
] }
anyhow = "1"

[lints]
workspace = true
