[package]
name = "mullvad-daemon"
edition.workspace = true
rust-version.workspace = true
description = "Mullvad VPN daemon. Runs and controls the VPN tunnels"
repository.workspace = true
license.workspace = true

[package.metadata.winres]
ProductName = "Warren VPN"
CompanyName = "Warren contributors"
LegalCopyright = "(c) 2026 Warren contributors"
InternalName = "warren-daemon"
OriginalFilename = "warren-daemon.exe"

[package.metadata.deb]
name = "warren-vpn-daemon"
conflicts = ["warren-vpn", "mullvad-vpn"]
maintainer = "Warren contributors <hello@warrenbrowse.com>"
copyright = "2026, Warren contributors <hello@warrenbrowse.com>"
license-file = ["../LICENSE.md", "0"]
section = "net"
priority = "optional"
depends = "$auto"
profile = "release"
maintainer-scripts = "../dist-assets/linux/daemon/"
assets = [
  { source = "target/release/warren", dest = "usr/bin/", mode = "755" },
  { source = "target/release/warren-daemon", dest = "usr/bin/", mode = "755" },
  { source = "target/release/warren-exclude", dest = "usr/bin/", mode = "755" },
  { source = "target/release/warren-setup", dest = "opt/Warren VPN/resources/", mode = "755" },
  { source = "target/release/warren-problem-report", dest = "opt/Warren VPN/resources/", mode = "755" },
  { source = "../dist-assets/linux/warren-daemon.service", dest = "usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/linux/warren-early-boot-blocking.service", dest = "usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/ca.crt", dest = "opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/relays.json", dest = "opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/shell-completions/warren.bash", dest = "usr/share/bash-completion/completions/warren", mode = "644" },
  { source = "../build/shell-completions/_warren", dest = "usr/local/share/zsh/site-functions/_warren", mode = "644" },
  { source = "../build/shell-completions/warren.fish", dest = "usr/share/fish/vendor_completions.d/warren.fish", mode = "644" },
  { source = "../CHANGELOG.md", dest = "opt/Warren VPN/resources/", mode = "644" },
]

[package.metadata.generate-rpm]
name = "warren-vpn-daemon"
vendor = "Warren contributors <hello@warrenbrowse.com>"
auto-req = "yes"
pre_install_script = "../dist-assets/linux/daemon/preinst"
pre_uninstall_script = "../dist-assets/linux/daemon/prerm"
post_install_script = "../dist-assets/linux/daemon/postinst"
post_uninstall_script = "../dist-assets/linux/daemon/postrm"
post_trans_script = "../dist-assets/linux/post-transaction.sh"
assets = [
  { source = "target/release/warren", dest = "/usr/bin/", mode = "755" },
  { source = "target/release/warren-daemon", dest = "/usr/bin/", mode = "755" },
  { source = "target/release/warren-exclude", dest = "/usr/bin/", mode = "755" },
  { source = "target/release/warren-setup", dest = "/opt/Warren VPN/resources/", mode = "755" },
  { source = "target/release/warren-problem-report", dest = "/opt/Warren VPN/resources/", mode = "755" },
  { source = "../dist-assets/linux/warren-daemon.service", dest = "/usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/linux/warren-early-boot-blocking.service", dest = "/usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/ca.crt", dest = "/opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/relays.json", dest = "/opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/shell-completions/warren.bash", dest = "/usr/share/bash-completion/completions/warren", mode = "644" },
  { source = "../build/shell-completions/_warren", dest = "/usr/share/zsh/site-functions/_warren", mode = "644" },
  { source = "../build/shell-completions/warren.fish", dest = "/usr/share/fish/vendor_completions.d/warren.fish", mode = "644" },
  { source = "../CHANGELOG.md", dest = "/opt/Warren VPN/resources/", mode = "644" },
]

[package.metadata.generate-rpm.conflicts]
warren-vpn = "*"
mullvad-vpn = "*"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
either = "1.11"
futures = { workspace = true }
libc = "0.2"
log = { workspace = true }
log-panics = "2.0.0"
mullvad-api = { path = "../mullvad-api" }
mullvad-encrypted-dns-proxy = { path = "../mullvad-encrypted-dns-proxy" }
mullvad-fs = { path = "../mullvad-fs" }
mullvad-leak-checker = { path = "../mullvad-leak-checker" }
mullvad-logging = { path = "../mullvad-logging" }
mullvad-management-interface = { path = "../mullvad-management-interface" }
mullvad-paths = { path = "../mullvad-paths" }
mullvad-relay-selector = { path = "../mullvad-relay-selector" }
mullvad-types = { path = "../mullvad-types" }
mullvad-version = { path = "../mullvad-version" }
rand = { workspace = true }
# Warren fork — Phase 2 auth wallet : la mnémonique BIP39 stockée dans
# `<settings_dir>/warren_mnemonic.txt` est dérivée en SigningKey
# Ed25519 au boot du daemon via ces 2 crates path-dep cross-repo (cf.
# `../../warren-pocs/crates/warren-identity/`).
warren-config = { path = "../../warren-pocs/crates/warren-config" }
warren-identity = { path = "../../warren-pocs/crates/warren-identity" }
# Phase 4.F : `warren_signer` expose désormais une `SigningKey` brute
# pour assembler des `WarrenIrohParameters`. Version pin alignée sur
# `mullvad-api/Cargo.toml`.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
# Warren fork — Phase 4 : sélection d'exits Iroh (équivalent
# `mullvad-relay-selector` pour le backend Warren). Ne dépend pas
# de `talpid-warren-iroh` côté API : retourne juste `(EndpointId,
# EndpointAddr)` ; le caller (state machine, Phase 4.F future)
# assemble le `WarrenIrohParameters` complet.
warren-relay-selector = { path = "../../warren-pocs/crates/warren-relay-selector" }
# Phase G.3 : client HTTP signé warren-api (consumed par
# `WarrenRemoteAccountBackend` + `WarrenRemoteDeviceBackend` pour
# remplacer les calls `mullvad_api::AccountsProxy/DevicesProxy` quand
# `warren_mode = true && warren_local_account = false`).
warren-api-client = { path = "../../warren-pocs/crates/warren-api-client" }
# Phase G.3 : encode/decode wg_pubkey 32 bytes ↔ hex 64 chars dans
# `WarrenRemoteDeviceBackend::map_device_response`.
hex = "0.4"
# Phase 4.F.1 : assemblage des `WarrenIrohParameters` (selection +
# signing_key + n_connections + features) côté daemon. Le binding
# tunnel est invoqué Phase 4.F.5 via `TunnelMonitor::start_warren_iroh`.
talpid-warren-iroh = { path = "../talpid-warren-iroh" }
regex = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
talpid-core = { path = "../talpid-core" }
talpid-dns = { path = "../talpid-dns" }
talpid-future = { path = "../talpid-future" }
talpid-platform-metadata = { path = "../talpid-platform-metadata" }
talpid-routing = { path = "../talpid-routing" }
talpid-time = { path = "../talpid-time" }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["chrono"] }

[dev-dependencies]
# Phase G.3 : axum 0.8 utilisé pour spawn warren-api in-process dans
# les tests E2E. Pinné en dur (pas dans workspace.dependencies) car
# axum n'est pas une dep prod de warren-app.
axum = "0.8"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
insta = { workspace = true, features = ["json"] }
talpid-time = { path = "../talpid-time", features = ["test"] }
tokio = { workspace = true, features = ["test-util"] }
# Phase G.3 : tests E2E spawn warren-api in-process pour valider le
# round-trip `WarrenRemote*Backend` → warren-api-client → warren-api.
warren-api = { path = "../../warren-pocs/crates/warren-api" }

[target.'cfg(any(unix, windows))'.dependencies]
mullvad-update = { path = "../mullvad-update", features = ["client"] }

[target.'cfg(target_os="android")'.dependencies]
async-trait = "0.1"
ctrlc = { workspace = true }
hickory-resolver = { workspace = true }
paranoid-android = "0.2.2"

[target.'cfg(target_os="linux")'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }
talpid-dbus = { path = "../talpid-dbus" }
tikv-jemallocator = { version = "0.6", optional = true }

[target.'cfg(target_os="macos")'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }
notify = "8.0.0"
objc2-foundation = { version = "0.3.1", features = [
  "NSProcessInfo",
  "NSString",
  "NSURL"
] }
objc2-service-management = { version = "0.3.1", features = [
  "SMAppService",
  "objc2"
] }
talpid-macos = { path = "../talpid-macos" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "user"] }

[target.'cfg(windows)'.dependencies]
ctrlc = { workspace = true }
dirs = { workspace = true }
talpid-windows = { path = "../talpid-windows" }
winapi = { version = "0.3", features = ["excpt", "winerror", "winnt"] }
windows-service = "0.6.0"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
]

[target.'cfg(windows)'.build-dependencies]
mullvad-version = { path = "../mullvad-version" }
winres = "0.1"

[target.'cfg(windows)'.build-dependencies.windows-sys]
workspace = true
features = ["Win32_System_SystemServices"]

[features]
default = ["default-allocator"]
# Allow the API server to use to be configured
api-override = ["mullvad-api/api-override"]
cgroup2 = ["talpid-core/cgroup2"]
# Use jemalloc as the global allocator. Only takes effect on Linux.
default-allocator = ["dep:tikv-jemallocator"]
multihop-pcap = ["talpid-core/multihop-pcap"]
staggered-obfuscation = ["mullvad-relay-selector/staggered-obfuscation"]
wireguard-go = ["talpid-core/wireguard-go"]

# Warren rebrand Niveau A : binaire installé `warren-daemon` au lieu
# de `mullvad-daemon`. Le nom du package Cargo (`mullvad-daemon`)
# reste inchangé pour faciliter les rebases upstream Mullvad — seul
# le nom du binaire produit dans `target/release/` est rebrandé.
[[bin]]
name = "warren-daemon"
path = "src/main.rs"

[lints]
workspace = true
