[package]
name = "mullvad-daemon"
edition.workspace = true
rust-version.workspace = true
description = "Warren VPN daemon. Runs and controls the VPN tunnels"
repository.workspace = true
license.workspace = true

[package.metadata.winres]
ProductName = "Warren VPN"
CompanyName = "Warren contributors"
LegalCopyright = "(c) 2026 Warren contributors"
InternalName = "warren-daemon"
OriginalFilename = "warren-daemon.exe"

[package.metadata.deb]
name = "warren-vpn-daemon"
extended-description = "Headless (no GUI) Warren VPN: the warren daemon and CLI for servers and SSH-only machines."
conflicts = ["warren-vpn", "mullvad-vpn"]
maintainer = "Warren contributors <hello@warrenbrowse.com>"
copyright = "2026, Warren contributors <hello@warrenbrowse.com>"
license-file = ["../LICENSE.md", "0"]
section = "net"
priority = "optional"
depends = "$auto"
profile = "release"
maintainer-scripts = "../dist-assets/linux/daemon/"
assets = [
  { source = "target/release/warren", dest = "usr/bin/", mode = "755" },
  { source = "target/release/warren-daemon", dest = "usr/bin/", mode = "755" },
  { source = "target/release/warren-exclude", dest = "usr/bin/", mode = "755" },
  { source = "target/release/warren-setup", dest = "opt/Warren VPN/resources/", mode = "755" },
  { source = "target/release/warren-problem-report", dest = "opt/Warren VPN/resources/", mode = "755" },
  { source = "../dist-assets/linux/warren-daemon.service", dest = "usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/linux/warren-early-boot-blocking.service", dest = "usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/ca.crt", dest = "opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/relays.json", dest = "opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/shell-completions/warren.bash", dest = "usr/share/bash-completion/completions/warren", mode = "644" },
  { source = "../build/shell-completions/_warren", dest = "usr/local/share/zsh/site-functions/_warren", mode = "644" },
  { source = "../build/shell-completions/warren.fish", dest = "usr/share/fish/vendor_completions.d/warren.fish", mode = "644" },
  { source = "../CHANGELOG.md", dest = "opt/Warren VPN/resources/", mode = "644" },
]

[package.metadata.generate-rpm]
name = "warren-vpn-daemon"
summary = "Warren VPN daemon and CLI (headless, no GUI). Runs and controls the VPN tunnels."
vendor = "Warren contributors <hello@warrenbrowse.com>"
# Disabled: the headless packages are built on a Debian-based runner that lacks
# rpm's find-requires, which makes auto-req = "yes" fail and drops the .rpm.
auto-req = "no"
pre_install_script = "../dist-assets/linux/daemon/preinst"
pre_uninstall_script = "../dist-assets/linux/daemon/prerm"
post_install_script = "../dist-assets/linux/daemon/postinst"
post_uninstall_script = "../dist-assets/linux/daemon/postrm"
post_trans_script = "../dist-assets/linux/post-transaction.sh"
assets = [
  { source = "target/release/warren", dest = "/usr/bin/", mode = "755" },
  { source = "target/release/warren-daemon", dest = "/usr/bin/", mode = "755" },
  { source = "target/release/warren-exclude", dest = "/usr/bin/", mode = "755" },
  { source = "target/release/warren-setup", dest = "/opt/Warren VPN/resources/", mode = "755" },
  { source = "target/release/warren-problem-report", dest = "/opt/Warren VPN/resources/", mode = "755" },
  { source = "../dist-assets/linux/warren-daemon.service", dest = "/usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/linux/warren-early-boot-blocking.service", dest = "/usr/lib/systemd/system/", mode = "644" },
  { source = "../dist-assets/ca.crt", dest = "/opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/relays.json", dest = "/opt/Warren VPN/resources/", mode = "644" },
  { source = "../build/shell-completions/warren.bash", dest = "/usr/share/bash-completion/completions/warren", mode = "644" },
  { source = "../build/shell-completions/_warren", dest = "/usr/share/zsh/site-functions/_warren", mode = "644" },
  { source = "../build/shell-completions/warren.fish", dest = "/usr/share/fish/vendor_completions.d/warren.fish", mode = "644" },
  { source = "../CHANGELOG.md", dest = "/opt/Warren VPN/resources/", mode = "644" },
]

[package.metadata.generate-rpm.conflicts]
warren-vpn = "*"
mullvad-vpn = "*"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
either = "1.11"
futures = { workspace = true }
libc = "0.2"
log = { workspace = true }
log-panics = "2.0.0"
mullvad-api = { path = "../mullvad-api" }
mullvad-api-constants = { path = "../mullvad-api/mullvad-api-constants" }
mullvad-encrypted-dns-proxy = { path = "../mullvad-encrypted-dns-proxy" }
mullvad-fs = { path = "../mullvad-fs" }
mullvad-leak-checker = { path = "../mullvad-leak-checker" }
mullvad-logging = { path = "../mullvad-logging" }
mullvad-management-interface = { path = "../mullvad-management-interface" }
mullvad-paths = { path = "../mullvad-paths" }
mullvad-relay-selector = { path = "../mullvad-relay-selector" }
mullvad-types = { path = "../mullvad-types" }
mullvad-version = { path = "../mullvad-version" }
rand = { workspace = true }
# Warren fork - fetches `GET /v1/exits` at boot to bootstrap
# `<cache_dir>/warren-relays.json` from warren-api. Public endpoint
# (no client signature); the server-signed v2 response is verified at
# load time by `DaemonWarrenRelaySelector`.
reqwest = { workspace = true }
# Warren fork - Phase 2 auth wallet: the BIP39 mnemonic stored in
# `<settings_dir>/warren_mnemonic.txt` is derived into an Ed25519
# SigningKey at daemon boot via these two cross-repo path-dep crates.
# `warren-config` stays on warren-core: `WARREN_API_URL` /
# `WARREN_SERVER_PUBKEY_HEX` are Warren-product constants with no
# non-core home yet (not part of the neutral `warrenguard-config` engine
# crate). `warren-identity` moves to the SDK (warren-sdk-rs), a
# behaviorally-identical re-export of the same `warrenguard-identity`
# engine primitives.
warren-config = { path = "../../warren-core/crates/warren-config" }
warren-identity = { path = "../../warren-sdk-rs/crates/warren-identity" }
# Phase 4.F: `warren_signer` now exposes a raw `SigningKey` used to
# assemble `WarrenTunnelParameters`. Version pin aligned with
# `mullvad-api/Cargo.toml`.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
# The BIP39 mnemonic that travels through `on_set_warren_mnemonic` is
# wrapped in `Zeroizing<String>` so its heap buffer is wiped before
# the allocator can reclaim and recycle the memory. Pair with the
# `zeroize` feature pinned on `ed25519-dalek` in `mullvad-api`.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# In-RAM BIP39 generation for `warren_signer::bootstrap_fresh_mnemonic`,
# bypassing `warren_identity::load_or_create_mnemonic`'s mandatory disk
# write (= avoid transient plaintext file on platforms with OS-native
# secret storage). `zeroize` feature so `bip39::Mnemonic` is wiped on
# drop.
bip39 = { version = "2", features = ["rand", "zeroize"] }
# Warren exit selector (equivalent to `mullvad-relay-selector` for the
# Warren backend). Does not depend on `talpid-warren-tunnel` API: it
# just returns `(WarrenPubkey, WarrenExitAddr)`; the caller assembles
# the full `WarrenTunnelParameters` downstream. Neutral home: the
# `warren-discovery-core` crate in `warren-contract` (warren-core's
# `warren-relay-selector` is a pure re-export of the same crate).
warren-discovery-core = { path = "../../warren-contract/warren-discovery" }
# Multi-hop PKI verification (`verify_relay_descriptor`,
# `verify_exit_descriptor`) consumed by the daemon-side multi-hop
# config loader. Direct dep is preferred over a re-export through
# `talpid-warren-tunnel`: the loader is a daemon concern that should
# not pull verifier logic into the tunnel adapter crate.
warrenguard-multihop = { path = "../../warrenguard/crates/warrenguard-multihop" }
# Signed HTTP client for warren-api (consumed by
# `WarrenRemoteAccountBackend` + `WarrenRemoteDeviceBackend` to replace
# `mullvad_api::AccountsProxy/DevicesProxy` when
# `warren_mode = true && warren_local_account = false`).
# BLOCKED off warren-core: the SDK's `warren-api` client (warren-sdk-rs) does
# not support the shared/hot-swappable `Arc<RwLock<SigningKey>>` identity that
# `WarrenAuthSigner`/`on_set_warren_mnemonic` hot-swap relies on (no
# `new_shared`), and its method surface diverges (`subscription` vs
# `get_subscription`, `register` vs `register_with_voucher`, `address()` vs
# `pubkey_ss58()`, no `new_unsigned`). Needs a cross-repo decision, not an
# app-side workaround.
warren-api-client = { path = "../../warren-core/crates/warren-api-client" }
# Encode/decode wg_pubkey 32 bytes <-> hex 64 chars in
# `WarrenRemoteDeviceBackend::map_device_response`.
hex = "0.4"
# Builds `WarrenTunnelParameters` (selection + signing_key +
# n_connections + features) on the daemon side. The tunnel binding is
# invoked downstream via `TunnelMonitor::start_warren_tunnel`.
talpid-warren-tunnel = { path = "../talpid-warren-tunnel" }
regex = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
talpid-core = { path = "../talpid-core" }
talpid-dns = { path = "../talpid-dns" }
talpid-future = { path = "../talpid-future" }
talpid-platform-metadata = { path = "../talpid-platform-metadata" }
talpid-routing = { path = "../talpid-routing" }
talpid-time = { path = "../talpid-time" }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "rt-multi-thread",
  "sync",
  "time"
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["chrono"] }

[dev-dependencies]
# Phase G.3: axum 0.8 used to spawn warren-api in-process inside the
# E2E tests. Hard-pinned (not in workspace.dependencies) because axum
# is not a prod dep of warren-app.
axum = "0.8"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
insta = { workspace = true, features = ["json"] }
talpid-time = { path = "../talpid-time", features = ["test"] }
tokio = { workspace = true, features = ["test-util"] }
# Phase G.3: E2E tests spawn warren-api in-process to validate the
# `WarrenRemote*Backend` → warren-api-client → warren-api round-trip.
warren-api = { path = "../../warren-core/crates/warren-api" }

[target.'cfg(any(unix, windows))'.dependencies]
mullvad-update = { path = "../mullvad-update", features = ["client"] }

[target.'cfg(target_os="android")'.dependencies]
async-trait = "0.1"
ctrlc = { workspace = true }
hickory-resolver = { workspace = true }
paranoid-android = "0.2.2"

[target.'cfg(target_os="linux")'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }
talpid-dbus = { path = "../talpid-dbus" }
tikv-jemallocator = { version = "0.6", optional = true }

[target.'cfg(target_os="macos")'.dependencies]
ctrlc = { workspace = true, features = ["termination"] }
notify = "8.0.0"
objc2-foundation = { version = "0.3.1", features = [
  "NSProcessInfo",
  "NSString",
  "NSURL"
] }
objc2-service-management = { version = "0.3.1", features = [
  "SMAppService",
  "objc2"
] }
# Backs the macOS branch of `os_secret_storage`. Targets the
# File-Based System Keychain (`/Library/Keychains/System.keychain`)
# via the legacy `SecKeychain` API path, which works for non-bundled
# daemons running as root without code-signing entitlements (the
# modern `SecItemAdd` Data Protection Keychain path requires
# `keychain-access-groups` entitlements we cannot ship in a daemon).
security-framework = "3.7"
talpid-macos = { path = "../talpid-macos" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "user"] }

[target.'cfg(windows)'.dependencies]
ctrlc = { workspace = true }
dirs = { workspace = true }
talpid-windows = { path = "../talpid-windows" }
# Backs the Windows branch of `os_secret_storage` via DPAPI
# (`CryptProtectData` / `CryptUnprotectData`) with
# `CRYPTPROTECT_LOCAL_MACHINE`. The warren daemon runs as
# `LocalSystem` so the machine-scope DPAPI master key is the right
# fit. No Authenticode signing required to call DPAPI.
windows = { workspace = true, features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
] }
winapi = { version = "0.3", features = ["excpt", "winerror", "winnt"] }
windows-service = "0.6.0"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
]

[target.'cfg(windows)'.build-dependencies]
mullvad-version = { path = "../mullvad-version" }
winres = "0.1"

[target.'cfg(windows)'.build-dependencies.windows-sys]
workspace = true
features = ["Win32_System_SystemServices"]

[features]
default = ["default-allocator"]
# Allow the API server to use to be configured
api-override = ["mullvad-api/api-override"]
cgroup2 = ["talpid-core/cgroup2"]
# Use jemalloc as the global allocator. Only takes effect on Linux.
default-allocator = ["dep:tikv-jemallocator"]
staggered-obfuscation = ["mullvad-relay-selector/staggered-obfuscation"]
# Enables macOS split tunneling. OFF by default: macOS ST relies on
# Endpoint Security, which only works on a signed build (Developer ID +
# endpoint-security entitlement) with Full Disk Access. Set this ONLY on
# signed release builds; on unsigned builds ST half-initialises and
# breaks connectivity, so the daemon refuses to enable it unless this is
# set (see `macos_split_tunnel_supported`).
macos-split-tunnel = []

# Warren rebrand Level A: installed binary `warren-daemon` instead of
# `mullvad-daemon`. The Cargo package name (`mullvad-daemon`) is kept
# unchanged to ease upstream Mullvad rebases - only the binary name
# produced in `target/release/` is rebranded.
[[bin]]
name = "warren-daemon"
path = "src/main.rs"

[lints]
workspace = true
