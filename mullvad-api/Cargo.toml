[package]
name = "mullvad-api"
edition.workspace = true
rust-version.workspace = true
description = "Mullvad VPN API clients. Providing an interface to query our infrastructure for information."
repository.workspace = true
license.workspace = true

[lib]
bench = false
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true }
# Warren fork — Phase 2 auth wallet: Ed25519 signature on HTTP API
# requests (see `mullvad-api/src/warren_auth.rs` and
# `warren-core/docs/06-auth-wallet.md`).
#
# `zeroize` is REQUIRED — `WarrenAuthSigner` holds the signing key
# behind an `RwLock<SigningKey>` and swaps it in-place on mnemonic
# import via `replace_signing_key`. Without `zeroize`, the previous
# secret would linger in the heap allocator until eventually
# overwritten, defeating the no-log / no-residual-secret posture.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
  "std",
  "zeroize",
] }
# Direct (non-transitive) dependency on `zeroize` so we can name the
# `ZeroizeOnDrop` trait in `warren_auth.rs` for the compile-time guard
# that pins the `zeroize` feature of `ed25519-dalek`. Without this dep
# the guard would silently break if `ed25519-dalek` ever stopped
# re-exporting `zeroize` as a transitive dep.
zeroize = "1"
hex = "0.4"
rand = { workspace = true }
sha2 = { workspace = true }
domain-fronting = "0.1"
futures = { workspace = true }
http = "1.1.0"
http-body-util = "0.1.2"
hyper = { version = "1.8.1", features = ["client", "http1"] }
hyper-util = { workspace = true }
ipnetwork = { workspace = true }
libc = "0.2"
log = { workspace = true }
mullvad-api-constants = { path = "./mullvad-api-constants" }
mullvad-encrypted-dns-proxy = { path = "../mullvad-encrypted-dns-proxy" }
mullvad-fs = { path = "../mullvad-fs" }
mullvad-types = { path = "../mullvad-types" }
mullvad-version = { path = "../mullvad-version" }
# Warren fork: consume the canonical HEADER_* + canonical_message wire
# format from warren-api-client (re-exported from warren-identity::auth)
# rather than duplicating them locally — a silent divergence would
# break every signed API request.
warren-api-client = { path = "../../warren-core/crates/warren-api-client" }
rustls-pki-types.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
shadowsocks = { workspace = true, features = ["stream-cipher"] }
talpid-time = { path = "../talpid-time" }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
tokio-rustls = { version = "0.26.0", default-features = false, features = [
  "logging",
  "ring",
] }
tokio-socks = "0.5.1"
tower = { workspace = true }
vec1 = { workspace = true, features = ["serde"] }

[dev-dependencies]
talpid-time = { path = "../talpid-time", features = ["test"] }
tokio = { workspace = true, features = ["test-util", "time"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
mullvad-update = { path = "../mullvad-update", features = ["client"] }

[features]
# Allow the API server to use to be configured via MULLVAD_API_HOST and MULLVAD_API_ADDR.
api-override = []

[lints]
workspace = true
