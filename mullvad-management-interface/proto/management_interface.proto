message Settings {
  RelaySettings relay_settings = 1;
  bool allow_lan = 3;
  bool lockdown_mode = 4;
  bool auto_connect = 5;
  TunnelOptions tunnel_options = 6;
  bool show_beta_releases = 7;
  SplitTunnelSettings split_tunnel = 8;
  ObfuscationSettings obfuscation_settings = 9;
  CustomListSettings custom_lists = 10;
  ApiAccessMethodSettings api_access_methods = 11;
  repeated RelayOverride relay_overrides = 12;
  optional Recents recents = 13;
  bool update_default_location = 14;
  reserved 15; // was warren_mode (removed: Warren is the only mode)
  reserved 16; // was warren_local_account (removed: always remote backend)
  // Empty string = unset. Cf. SetWarrenApiUrl rpc.
  string warren_api_url = 17;
  // Warren two-relayed QUIC multi-hop settings. Cf.
  // SetWarrenMultiHopSettings rpc. Absent = OFF (single-hop).
  WarrenMultiHopSettings warren_multi_hop = 18;
  // Warren NAT-PMP port-forwarding settings. Cf. SetNatPmpSettings
  // rpc. Absent = OFF (no refresh loop spawned).
  NatPmpSettings warren_nat_pmp = 19;
  // 0 = unset (compiled default, 8). Cf. SetWarrenNConnections rpc.
  uint32 warren_n_connections = 20;
  // Advanced "custom exit" override. Cf. SetWarrenCustomExit rpc.
  // Absent / enabled=false = normal roster selection.
  WarrenCustomExitSettings warren_custom_exit = 21;
}

// Advanced "custom exit" override persisted in
// Settings.warren_custom_exit. Default = enabled:false + empty fields
// (normal roster selection). When enabled with a valid endpoint+pubkey
// the daemon dials this single hand-entered exit directly, bypassing
// the signed registry, failover, multi-hop and the TOFU pin (typing the
// key out of band IS the pin).
message WarrenCustomExitSettings {
  bool enabled = 1;
  // Exit UDP endpoint as host:port. IPv6 must be bracketed
  // ([2001:db8::1]:443). Parsed to a SocketAddr daemon-side.
  string endpoint = 2;
  // Hex-encoded 32-byte Ed25519 server public key (64 hex chars).
  string pubkey_hex = 3;
  // Optional X.509 cover domain (SNI). Absent = RPK-via-SNI mode; set
  // it only when the exit runs a matching public certificate.
  optional string cover_domain = 4;
  // Optional cosmetic UI label ("My home exit").
  string label = 5;
}

// Warren multi-hop settings persisted in Settings.warren_multi_hop and
// surfaced via GetWarrenMultiHopSettings rpc. Default = enabled:false,
// empty countries, hpke_epoch_rotation = 4h (doctrine
// `warren_multihop_doctrine_v1`).
message WarrenMultiHopSettings {
  bool enabled = 1;
  // ISO 3166 alpha-2 country code. Empty string = auto-pick.
  string entry_country = 2;
  string exit_country = 3;
  // HPKE epoch rotation interval. Default 4h, max 8h per doctrine.
  google.protobuf.Duration hpke_epoch_rotation = 4;
}

// Community-forum wallet login (doc 55). `sid` is the opaque session id
// from the `warren://forum-login?sid=..` deep link (32 lowercase hex);
// the daemon validates its shape before signing.
message ForumLoginRequest {
  string sid = 1;
}

// The four X-Warren-* header values plus the request body the GUI must
// POST to `https://<connect-host>/v1/forum/login`. None of these is a
// long-lived secret: the signature is bound to the fixed path + body +
// nonce + timestamp (60 s window, single-use server side).
message ForumLoginSignature {
  string pubkey_ss58 = 1;
  string signature_hex = 2;
  uint64 timestamp = 3;
  string nonce_hex = 4;
  string body = 5;
}

// Community-forum attach-logs (doc 55). `sid` is the opaque session id from
// the `warren://attach-logs?sid=..` deep link (32 lowercase hex; the daemon
// validates its shape before signing), `topic_id` the forum topic of the
// user's bug report, and `log_gz` the gzipped redacted problem report
// (non-empty, max 1 MiB).
message ForumAttachLogsRequest {
  string sid = 1;
  uint64 topic_id = 2;
  bytes log_gz = 3;
}

// Warren live tunnel status surface via GetWarrenStatus rpc and the
// WarrenStatusUpdates stream. reconnect_count + last_reconnect_age
// expose the M4.E.D auto-reconnect supervisor; obfuscation_active is
// always-true for /v1 per `warren_obfuscation_doctrine_v1`.
// M5.B.2: failover_count + last_failover_age expose the multi-exit
// auto-failover (`assemble_failover_for_attempt`) so the UI can toast
// the user when their exit is swapped after an outage.
// Session H A.4: pubkey_mismatch_pending surfaces a TOFU verify-hook
// refusal so the renderer can mount the `WarrenPubKeyWarning` modal.
message WarrenStatus {
  uint32 reconnect_count = 1;
  google.protobuf.Duration last_reconnect_age = 2;
  bool obfuscation_active = 3;
  uint32 failover_count = 4;
  google.protobuf.Duration last_failover_age = 5;
  // Absent (= null on the wire) in the steady state; populated when
  // the daemon-side verify hook refused a connect because the
  // observed Ed25519 pubkey differs from the locally pinned baseline.
  WarrenPubkeyMismatch pubkey_mismatch_pending = 6;
  // ADR 36: true while the last drain-triggered exit switch (server
  // maintenance) is inside its display window. The daemon re-emits a
  // status update when the window expires, so the UI banner keyed on
  // this flag self-dismisses.
  bool maintenance_migration_active = 7;
  // Doc 59 C5: number of maintenance migrations cancelled because a
  // user-pinned forwarded port could not be reserved on any candidate
  // exit. The client stays on the draining exit with its ports intact;
  // the UI toasts "migration postponed, port kept" on each increment.
  uint32 port_migration_cancellations = 8;
  // True while the last port-conflict cancellation is inside its display
  // window (same self-expiring discipline as maintenance_migration_active).
  bool port_migration_cancellation_active = 9;
  // True while the offline monitor reports the host offline, pushed on
  // the edge itself (before any tunnel-side grace). Drives the
  // immediate "no internet connection" banner in every tunnel state.
  bool host_offline = 10;
  // Doc 62 item 5: true while the in-tunnel egress liveness probe
  // reports the exit not forwarding (drained / half-swapped exit that
  // still ACKs QUIC keep-alives). Cleared on a successful probe or
  // when the tunnel leaves Connected. Drives the "interrupted" phase
  // with the exit-not-forwarding banner while Connected.
  bool exit_egress_dead = 11;
}

// Session H A.4: forensic payload surfaced alongside a TOFU pubkey
// mismatch event. All fields are operator metadata (no PII): the
// `exit_id` is public via the signed relay-list, the pubkeys are
// public Ed25519 verifying keys, and country / city are the
// forensic snapshot pinned at TOFU time.
message WarrenPubkeyMismatch {
  // 32-character lower-case hex of the 16-byte stable exit_id.
  string exit_id_hex = 1;
  // 64-character lower-case hex of the previously pinned Ed25519
  // verifying key.
  string pinned_pubkey_hex = 2;
  // 64-character lower-case hex of the currently observed key.
  string observed_pubkey_hex = 3;
  // ISO 3166 alpha-2 country code captured at TOFU time. Empty
  // string when the pin pre-dates the H.6 forensic enrichment.
  string country_code = 4;
  // City label captured at TOFU time. Empty string when the pin
  // pre-dates the H.6 forensic enrichment.
  string city = 5;
}

// Session H A.4: gRPC request for the TrustNewExitKey RPC. The
// daemon replaces the pinned `pubkey_hex` for the given
// `exit_id_hex` with the supplied `new_pubkey_hex`, bumping
// `first_seen` to "now" so the audit trail records the explicit
// user trust event. Returns one of the
// `TrustNewExitKeyResponse.Result` enum values.
message TrustNewExitKeyRequest {
  string exit_id_hex = 1;
  string new_pubkey_hex = 2;
}

message TrustNewExitKeyResponse {
  enum Result {
    OK = 0;
    EXIT_NOT_FOUND = 1;
    PUBKEY_MISMATCH = 2;
    IO_ERROR = 3;
  }
  Result result = 1;
  // Free-form error message when `result == IO_ERROR`. Empty for
  // the other result variants.
  string error_message = 2;
}

// Session H A.4: gRPC response for the ResetPinnedExitKeys RPC.
// `reset_count` is the number of pin entries that were dropped.
message ResetPinnedExitKeysResponse {
  uint32 reset_count = 1;
}

// Session H A.4: gRPC request for the ReportPubkeyMismatch RPC.
// The daemon stamps the request, signs it with the BIP39-derived
// signing key, and posts to `/v1/incidents/pubkey-mismatch`
// best-effort. No PII; the payload mirrors the modal forensic
// fields.
message ReportPubkeyMismatchRequest {
  string exit_id_hex = 1;
  string old_pubkey_hex = 2;
  string new_pubkey_hex = 3;
  string country_code = 4;
  string city = 5;
}

// Warren NAT-PMP port-forwarding settings persisted on disk and pushed
// to the daemon via SetNatPmpSettings. Default OFF. Lifetime is the
// requested lifetime in seconds; the exit clamps it to its allocator
// range (60..3600 s). Protocol picks UDP or TCP; mapping both
// simultaneously is left for a future extension.
message NatPmpSettings {
  bool enabled = 1;
  uint32 lifetime_secs = 2;
  enum Proto {
    UDP = 0;
    TCP = 1;
  }
  // One port-forward rule. A client may hold several at once, up to the
  // exit-enforced per-client quota.
  message Rule {
    Proto protocol = 1;
    // Suggested external port (0 = server picks from its pool).
    uint32 suggested_external_port = 2;
    // Internal port the user's application binds locally. 0 = unset.
    uint32 internal_port = 3;
  }
  // Multi-port source of truth: one entry per rule the user wants
  // active. New clients populate this and leave the legacy single-port
  // fields below at their defaults.
  repeated Rule rules = 6;
  // --- Legacy single-port fields (deprecated) -------------------------
  // Kept ONLY so a settings.json written by a pre-multi-port build still
  // deserializes; superseded by `rules`. Read via effective_rules().
  Proto protocol = 3;
  uint32 suggested_external_port = 4;
  uint32 internal_port = 5;
}

// NAT-PMP refresh-loop status surface used by GetNatPmpSettings (last
// known state) and NatPmpStatusUpdates (live stream).
message NatPmpStatus {
  enum State {
    DISABLED = 0;
    REQUESTING = 1;
    MAPPED = 2;
    FAILED = 3;
    // The exit rate-limited the last (re)mapping request (too many port
    // changes in a row). Recoverable: the daemon retries automatically
    // after `retry_after_secs`. The UI blocks the port control and shows
    // a countdown.
    RATE_LIMITED = 4;
  }
  State state = 1;
  // Set when state == MAPPED. The public-facing port the user
  // advertises to incoming peers.
  optional uint32 external_port = 2;
  // Set when state == MAPPED. The lifetime (seconds) the exit GRANTED
  // for this mapping (after its [60,3600] clamp), captured at the last
  // Mapped/Renewed event, NOT a live-decreasing "remaining" value. The
  // UI derives the renewal countdown as granted/2 from the wall clock
  // since that event.
  optional uint32 lifetime_granted_secs = 3;
  // Set when state == FAILED. Free-form error string (logs/diagnostics).
  optional string error_message = 4;
  // Stable, translatable failure category. Lets the renderer show a
  // localised message keyed on this enum rather than surfacing the raw
  // `error_message`. Set when state == FAILED.
  enum ErrorReason {
    // Unknown / uncategorised failure (timeout, I/O, protocol, ...).
    UNKNOWN = 0;
    // The exit refused the explicitly requested external port because
    // it is already in use / reserved for another client (Warren's
    // strict honour-or-error policy).
    SUGGESTED_PORT_IN_USE = 1;
    // Out of resources: pool exhausted, per-client quota, or rate limit.
    OUT_OF_RESOURCES = 2;
    // Port forwarding not authorised (disabled exit-side / source not
    // allowed).
    NOT_AUTHORIZED = 3;
  }
  optional ErrorReason error_reason = 5;
  // Set when state == RATE_LIMITED. Seconds the user must wait before a
  // rate-limit slot frees and a new port change is accepted. Drives the
  // UI deban countdown.
  optional uint32 retry_after_secs = 6;
  // Set when state == MAPPED. Per-source rate-limit slots still
  // available, as reported by the exit. The UI warns at <= 1 and blocks
  // the port control at 0. Absent if the exit sent no budget trailer.
  optional uint32 attempts_remaining = 7;
  // Set when state == MAPPED. Seconds until the rate-limit budget grows
  // by one (i.e. until the oldest in-window allocation expires). Drives
  // the "wait before next change" countdown when attempts_remaining == 0.
  optional uint32 window_reset_secs = 8;

  // One NAT-PMP mapping, tagged with the rule it belongs to. Multi-port:
  // the UI renders one row per Mapping. Carries the same per-rule state
  // fields as the (legacy) top-level message above.
  message Mapping {
    // Rule identity: the internal port the user's app binds + protocol.
    uint32 internal_port = 1;
    NatPmpSettings.Proto protocol = 2;
    State state = 3;
    optional uint32 external_port = 4;
    optional uint32 lifetime_granted_secs = 5;
    optional string error_message = 6;
    optional ErrorReason error_reason = 7;
    optional uint32 retry_after_secs = 8;
    optional uint32 attempts_remaining = 9;
    optional uint32 window_reset_secs = 10;
  }
  // Multi-port: one entry per active rule. Empty == no active mappings
  // (feature off or all rules removed). New clients read this; the
  // top-level fields above are kept only for backward compatibility.
  repeated Mapping mappings = 9;
}

