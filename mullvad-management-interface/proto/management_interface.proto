syntax = "proto3";

package mullvad_daemon.management_interface;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/duration.proto";

service ManagementService {
  // Control and get tunnel state
  rpc ConnectTunnel(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}
  rpc DisconnectTunnel(google.protobuf.StringValue) returns (google.protobuf.BoolValue) {}
  rpc ReconnectTunnel(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}
  rpc GetTunnelState(google.protobuf.Empty) returns (TunnelState) {}

  // Control the daemon and receive events
  rpc EventsListen(google.protobuf.Empty) returns (stream DaemonEvent) {}
  // DEPRECATED: Prefer PrepareRestartV2.
  rpc PrepareRestart(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  // Takes a a boolean argument which says whether the daemon should stop after
  // it is done preparing for a restart.
  rpc PrepareRestartV2(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc FactoryReset(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  rpc GetCurrentVersion(google.protobuf.Empty) returns (google.protobuf.StringValue) {}
  // Get information about the latest available version of the app.
  // Note that calling this during an in-app upgrade will cancel the upgrade.
  rpc GetVersionInfo(google.protobuf.Empty) returns (AppVersionInfo) {}

  rpc IsPerformingPostUpgrade(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Relays and tunnel constraints
  rpc UpdateRelayLocations(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc GetRelayLocations(google.protobuf.Empty) returns (RelayList) {}
  rpc SetRelaySettings(RelaySettings) returns (google.protobuf.Empty) {}
  rpc SetObfuscationSettings(ObfuscationSettings) returns (google.protobuf.Empty) {}

  // Settings
  rpc GetSettings(google.protobuf.Empty) returns (Settings) {}
  rpc ResetSettings(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc SetAllowLan(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetShowBetaReleases(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetLockdownMode(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetAutoConnect(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetWireguardMtu(google.protobuf.UInt32Value) returns (google.protobuf.Empty) {}
  rpc SetWireguardAllowedIps(AllowedIpsList) returns (google.protobuf.Empty) {}
  rpc SetEnableIpv6(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetQuantumResistantTunnel(QuantumResistantState) returns (google.protobuf.Empty) {}
  rpc SetEnableDaita(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetDaitaDirectOnly(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetDaitaSettings(DaitaSettings) returns (google.protobuf.Empty) {}
  rpc SetDnsOptions(DnsOptions) returns (google.protobuf.Empty) {}
  rpc SetRelayOverride(RelayOverride) returns (google.protobuf.Empty) {}
  rpc ClearAllRelayOverrides(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc SetEnableRecents(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}
  rpc SetUserspaceWireguard(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}

  // Persistent URL of the warren-api server (consumed by
  // WarrenRemote{Account,Device}Backend). Format
  // `http(s)://host:port` without a trailing slash. Empty string means
  // unset (= None on the Settings side, falls back to Mullvad upstream).
  // Overridable via the `WARREN_API_URL` env var. A daemon restart is
  // required to apply the change.
  rpc SetWarrenApiUrl(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  // Number of parallel QUIC connections for the Warren tunnel.
  // 0 = reset to the compiled default (8). Valid range 1..=16,
  // rejected otherwise. Applied on the next (re)connect; the daemon
  // reconnects automatically when the tunnel is up. The env var
  // `WARREN_N_CONNECTIONS` on the daemon takes priority over this
  // setting.
  rpc SetWarrenNConnections(google.protobuf.UInt32Value) returns (google.protobuf.Empty) {}
  // Returns the user's BIP39 mnemonic (12 words) so the GUI can let the
  // user back it up. Empty string if the identity has never been
  // bootstrapped (= legacy Mullvad mode or first boot before
  // warren_signer).
  // **Sensitive**: the GUI caller must display it with a safety warning
  // and explicit user confirmation. The returned string is a
  // cryptographic secret, never logged by the daemon (no-log policy).
  rpc GetWarrenMnemonic(google.protobuf.Empty) returns (google.protobuf.StringValue) {}
  // Replaces the user identity with the supplied BIP39 mnemonic.
  // **Irreversible**: any subscription tied to the current identity is
  // lost. The GUI caller must display a strong confirmation before
  // calling. No restart is needed: the daemon hot-swaps the in-memory
  // signer (reload_signer_from_disk) and triggers an auto-login so the
  // new identity takes effect in the running process. The payload is
  // BIP39-validated before being written to disk (= atomic rejection).
  rpc SetWarrenMnemonic(google.protobuf.StringValue) returns (google.protobuf.Empty) {}

  // Signs a community-forum login challenge (DiscourseConnect wallet SSO,
  // warren-core doc 55). The GUI passes the `sid` from a
  // `warren://forum-login?sid=..` deep link; the daemon signs the fixed
  // canonical request `POST /v1/forum/login` with body `{"sid":"<sid>"}`
  // using the Warren identity key and returns the four X-Warren-* header
  // values. The GUI then POSTs them to the forum connect host. The key
  // never leaves the daemon. Errors if no identity is bootstrapped or the
  // sid is malformed.
  rpc SignForumLogin(ForumLoginRequest) returns (ForumLoginSignature) {}

  // Signs a community-forum attach-logs request (warren-core doc 55). The
  // GUI passes the `sid` + `topic_id` from a
  // `warren://attach-logs?sid=..&topic=..` deep link plus the gzipped
  // redacted problem report; the daemon builds the canonical JSON body
  // `{"sid":"<sid>","topic_id":<topic>,"log_gz_b64":"<base64>"}`, signs
  // `POST /v1/forum/attach-logs` with the Warren identity key, and returns
  // the four X-Warren-* header values plus that exact body. The GUI POSTs
  // the body verbatim so the signed bytes and the sent bytes are identical.
  // The key never leaves the daemon. Errors if no identity is bootstrapped,
  // the sid is malformed, or the gzip is empty or exceeds 1 MiB.
  rpc SignForumAttachLogs(ForumAttachLogsRequest) returns (ForumLoginSignature) {}

  // Warren multi-hop (M4.E.D / two-relayed QUIC HPKE doctrine).
  // OFF by default per doctrine `warren_multihop_doctrine_v1` (full
  // bandwidth single-hop, opt-in privacy). entry_country / exit_country
  // are ISO 3166 alpha-2 codes ("fr", "de", ...); empty string means
  // auto-pick.
  rpc GetWarrenMultiHopSettings(google.protobuf.Empty) returns (WarrenMultiHopSettings) {}
  rpc SetWarrenMultiHopSettings(WarrenMultiHopSettings) returns (google.protobuf.Empty) {}
  // Advanced "custom exit" override (Settings.warren_custom_exit). When
  // enabled with a valid endpoint+pubkey the daemon dials it directly,
  // bypassing the signed registry, failover, multi-hop and the TOFU
  // pin. Applied on the next (re)connect; the daemon reconnects
  // automatically when the tunnel is up. The current value is read back
  // through the Settings message (warren_custom_exit field).
  rpc SetWarrenCustomExit(WarrenCustomExitSettings) returns (google.protobuf.Empty) {}
  // Warren live tunnel status (reconnect_count + last_reconnect_age
  // surface the M4.E.D auto-reconnect supervisor; obfuscation_active
  // is always-true for /v1 per `warren_obfuscation_doctrine_v1`).
  rpc GetWarrenStatus(google.protobuf.Empty) returns (WarrenStatus) {}
  // Push stream emitting a new WarrenStatus whenever reconnect_count
  // changes or the tunnel state machine transitions. The GUI consumes
  // this for live UI updates without polling.
  rpc WarrenStatusUpdates(google.protobuf.Empty) returns (stream WarrenStatus) {}

  // Session H A.4: TOFU pubkey-pinning user actions. The daemon-side
  // verify hook refuses connects when the served Ed25519 pubkey for
  // a known `exit_id` differs from the locally pinned baseline; the
  // following RPCs let the user resolve the mismatch from the UI
  // modal without editing settings.json by hand.
  //
  // - TrustNewExitKey: replace the pinned key with the newly-observed
  //   one and resume connecting. Use case: legitimate key rotation
  //   announced by the operator.
  // - ResetPinnedExitKeys: clear the entire pin table. Use case: the
  //   user switches identity / device and wants a fresh TOFU baseline.
  // - DismissPubkeyMismatch: keep the existing pin, clear the
  //   pending-mismatch flag from WarrenStatus so the modal unmounts.
  //   The daemon stays disconnected; reconnecting would re-trigger
  //   the modal until the user picks Trust or Reset.
  // - ReportPubkeyMismatch: best-effort POST to
  //   `/v1/incidents/pubkey-mismatch`. No PII (cf. the field set).
  //   The mismatch flag is cleared regardless of the network outcome.
  rpc TrustNewExitKey(TrustNewExitKeyRequest) returns (TrustNewExitKeyResponse) {}
  rpc ResetPinnedExitKeys(google.protobuf.Empty) returns (ResetPinnedExitKeysResponse) {}
  rpc DismissPubkeyMismatch(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc ReportPubkeyMismatch(ReportPubkeyMismatchRequest) returns (google.protobuf.Empty) {}

  // Warren NAT-PMP port-forwarding (RFC 6886). Warren's product
  // differentiator since Mullvad / IVPN dropped port-forwarding in
  // 2023. OFF by default; when ON the daemon spawns a refresh loop
  // against the exit's NAT-PMP server (UDP/5351 of the tunnel
  // gateway) and surfaces the granted public port to the UI through
  // the NatPmpStatusUpdates stream.
  rpc GetNatPmpSettings(google.protobuf.Empty) returns (NatPmpSettings) {}
  rpc SetNatPmpSettings(NatPmpSettings) returns (google.protobuf.Empty) {}
  // Push stream emitting a new NatPmpStatus on every refresh loop
  // event (Mapped / Renewed / Failed / Cancelled).
  rpc NatPmpStatusUpdates(google.protobuf.Empty) returns (stream NatPmpStatus) {}

  // Account management
  rpc CreateNewAccount(google.protobuf.Empty) returns (google.protobuf.StringValue) {}
  rpc LoginAccount(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  rpc LogoutAccount(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  rpc GetAccountData(google.protobuf.StringValue) returns (AccountData) {}
  rpc GetAccountHistory(google.protobuf.Empty) returns (AccountHistory) {}
  rpc ClearAccountHistory(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc GetWwwAuthToken(google.protobuf.Empty) returns (google.protobuf.StringValue) {}
  rpc SubmitVoucher(google.protobuf.StringValue) returns (VoucherSubmission) {}
  // Android only
  rpc DeleteAccount(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Device management
  rpc GetDevice(google.protobuf.Empty) returns (DeviceState) {}
  rpc UpdateDevice(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc ListDevices(google.protobuf.StringValue) returns (DeviceList) {}
  rpc RemoveDevice(DeviceRemoval) returns (google.protobuf.Empty) {}

  // WireGuard key management
  rpc SetWireguardRotationInterval(google.protobuf.Duration) returns (google.protobuf.Empty) {}
  rpc ResetWireguardRotationInterval(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc RotateWireguardKey(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc GetWireguardKey(google.protobuf.Empty) returns (PublicKey) {}

  // Custom lists
  rpc CreateCustomList(NewCustomList) returns (google.protobuf.StringValue) {}
  rpc DeleteCustomList(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  rpc UpdateCustomList(CustomList) returns (google.protobuf.Empty) {}
  rpc ClearCustomLists(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Access methods
  rpc AddApiAccessMethod(NewAccessMethodSetting) returns (UUID) {}
  rpc RemoveApiAccessMethod(UUID) returns (google.protobuf.Empty) {}
  rpc SetApiAccessMethod(UUID) returns (google.protobuf.Empty) {}
  rpc UpdateApiAccessMethod(AccessMethodSetting) returns (google.protobuf.Empty) {}
  rpc ClearCustomApiAccessMethods(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc GetCurrentApiAccessMethod(google.protobuf.Empty) returns (AccessMethodSetting) {}
  rpc TestCustomApiAccessMethod(CustomProxy) returns (google.protobuf.BoolValue) {}
  rpc TestApiAccessMethodById(UUID) returns (google.protobuf.BoolValue) {}

  // Bridges (Used for reaching the API)
  rpc GetBridges(google.protobuf.Empty) returns (BridgeList) {}

  // Split tunneling (Linux)
  rpc GetSplitTunnelProcesses(google.protobuf.Empty) returns (stream google.protobuf.Int32Value) {}
  rpc AddSplitTunnelProcess(google.protobuf.Int32Value) returns (google.protobuf.Empty) {}
  rpc RemoveSplitTunnelProcess(google.protobuf.Int32Value) returns (google.protobuf.Empty) {}
  rpc ClearSplitTunnelProcesses(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Split tunneling (Linux, Windows)
  rpc SplitTunnelIsSupported(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Split tunneling (Windows, macOS, Android)
  rpc AddSplitTunnelApp(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  rpc RemoveSplitTunnelApp(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  rpc SetSplitTunnelState(google.protobuf.BoolValue) returns (google.protobuf.Empty) {}

  // Split tunneling (Windows, macOS)
  rpc ClearSplitTunnelApps(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc GetExcludedProcesses(google.protobuf.Empty) returns (ExcludedProcessList) {}

  // Play payment (Android)
  rpc InitPlayPurchase(google.protobuf.Empty) returns (PlayExternalObfuscatedAccountId) {}
  rpc VerifyPlayPurchase(PlayPurchase) returns (google.protobuf.Empty) {}

  // Check whether the app needs TCC approval for split tunneling (macOS)
  rpc NeedFullDiskPermissions(google.protobuf.Empty) returns (google.protobuf.BoolValue) {}

  // Notify the split tunnel monitor that a volume was mounted or dismounted
  // (Windows).
  rpc CheckVolumes(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // Apply a JSON blob to the settings
  // See ../../docs/settings-patch-format.md for a description of the format
  rpc ApplyJsonSettings(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  // Return a JSON blob containing all overridable settings, if there are any
  rpc ExportJsonSettings(google.protobuf.Empty) returns (google.protobuf.StringValue) {}

  // Get current feature indicators
  rpc GetFeatureIndicators(google.protobuf.Empty) returns (FeatureIndicators) {}

  // Debug features
  rpc DisableRelay(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
  rpc EnableRelay(google.protobuf.StringValue) returns (google.protobuf.Empty) {}

  rpc GetRolloutThreshold(google.protobuf.Empty) returns (Rollout) {}
  rpc RegenerateRolloutThreshold(google.protobuf.Empty) returns (Rollout) {}
  rpc SetRolloutThresholdSeed(Seed) returns (google.protobuf.Empty) {}

  // App upgrade
  rpc AppUpgrade(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc AppUpgradeAbort(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc AppUpgradeEventsListen(google.protobuf.Empty) returns (stream AppUpgradeEvent) {}
  rpc GetAppUpgradeCacheDir(google.protobuf.Empty) returns (google.protobuf.StringValue) {}

  rpc SetLogFilter(LogFilter) returns (google.protobuf.Empty) {}
  rpc LogListen(google.protobuf.Empty) returns (stream LogMessage) {}

  // The great multihop migration of 2026

  // If the return value is SplitFilterMigration, a migration took place recently. After
  // ClearMigrationMessage has been called, GetMigrationEvent will indefintely return null.
  // If the return value is null, there is nothing for the clients to do. The migration has either
  // not been run or was already completed.
  rpc GetMigrationEvent(google.protobuf.Empty) returns (SplitFilterMigration);
  // Call this function after *handling* a SplitFilterMigration as returned by GetMigrationEvent to
  // mark the migration as completed. This will cause GetMigrationEvent to return a null-value
  // indefintely.
  rpc ClearMigrationMessage(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message AppUpgradeEvent {
  oneof event {
    AppUpgradeDownloadStarting download_starting = 1;
    AppUpgradeDownloadProgress download_progress = 2;
    AppUpgradeAborted upgrade_aborted = 3;
    AppUpgradeVerifyingInstaller verifying_installer = 4;
    AppUpgradeVerifiedInstaller verified_installer = 5;
    AppUpgradeError error = 6;
  }
}

message AppUpgradeDownloadStarting {}
message AppUpgradeDownloadProgress {
  string server = 1;
  uint32 progress = 2;
  optional google.protobuf.Duration time_left = 3;
}
message AppUpgradeAborted {}
message AppUpgradeVerifyingInstaller {}
message AppUpgradeVerifiedInstaller {}
message AppUpgradeError {
  enum Error {
    GENERAL_ERROR = 0;
    DOWNLOAD_FAILED = 1;
    VERIFICATION_FAILED = 2;
  }
  Error error = 1;
}

message Seed { uint32 seed = 1; }
message Rollout { float threshold = 1; }

message UUID { string value = 1; }

message AccountData {
  string id = 1;
  google.protobuf.Timestamp expiry = 2;
}

message AccountHistory { google.protobuf.StringValue number = 1; }

message VoucherSubmission {
  uint64 seconds_added = 1;
  google.protobuf.Timestamp new_expiry = 2;
}

enum AfterDisconnect {
  NOTHING = 0;
  BLOCK = 1;
  RECONNECT = 2;
}

message ErrorState {
  enum Cause {
    AUTH_FAILED = 0;
    IPV6_UNAVAILABLE = 1;
    SET_FIREWALL_POLICY_ERROR = 2;
    SET_DNS_ERROR = 3;
    START_TUNNEL_ERROR = 4;
    CREATE_TUNNEL_DEVICE = 5;
    TUNNEL_PARAMETER_ERROR = 6;
    IS_OFFLINE = 7;
    // Android only
    NOT_PREPARED = 8;
    // Android only
    OTHER_ALWAYS_ON_APP = 9;
    // Android only
    OTHER_LEGACY_ALWAYS_ON_VPN = 10;
    // Android only
    INVALID_DNS_SERVERS = 11;
    // Android only
    INVALID_IPV6_CONFIG = 14;
    SPLIT_TUNNEL_ERROR = 12;
    NEED_FULL_DISK_PERMISSIONS = 13;
    // Warren: the tunnel reconnected too many times in a short window
    // (network flapping); the retry loop was stopped and parked here.
    WARREN_TUNNEL_FLAPPING = 15;
  }

  enum AuthFailedError {
    UNKNOWN = 0;
    INVALID_ACCOUNT = 1;
    EXPIRED_ACCOUNT = 2;
    TOO_MANY_CONNECTIONS = 3;
  }

  enum GenerationError {
    NO_MATCHING_RELAY_ENTRY = 0;
    NO_MATCHING_RELAY_EXIT = 1;
    NO_MATCHING_RELAY = 2;
    NO_MATCHING_BRIDGE_RELAY = 3;
    CUSTOM_TUNNEL_HOST_RESOLUTION_ERROR = 4;
    NETWORK_IPV4_UNAVAILABLE = 5;
    NETWORK_IPV6_UNAVAILABLE = 6;
    // Warren TOFU pubkey mismatch: the exit served a different Ed25519 pubkey
    // than the one previously pinned. The UI should surface a warning modal
    // rather than the generic "No matching server" message.
    WARREN_PUBKEY_MISMATCH = 7;
  }

  // Detail message sent alongside WARREN_PUBKEY_MISMATCH.
  message WarrenPubkeyMismatchDetail {
    string exit_id_hex = 1;
    string pinned = 2;
    string observed = 3;
  }

  message FirewallPolicyError {
    enum ErrorType {
      GENERIC = 0;
      LOCKED = 1;
    }
    ErrorType type = 1;

    // LOCKED
    uint32 lock_pid = 2;
    optional string lock_name = 3;
  }

  message OtherAlwaysOnAppError { string app_name = 1; }

  message InvalidDnsServersError { repeated string ip_addrs = 1; }

  message InvalidIpv6Config {
    repeated string addrs = 1;
    repeated string routes = 2;
    repeated string dns = 3;
  }

  Cause cause = 1;
  FirewallPolicyError blocking_error = 2;

  // AUTH_FAILED
  AuthFailedError auth_failed_error = 3;
  // TUNNEL_PARAMETER_ERROR
  GenerationError parameter_error = 4;
  // SET_FIREWALL_POLICY_ERROR
  FirewallPolicyError policy_error = 5;
  // CREATE_TUNNEL_DEVICE
  optional int32 create_tunnel_error = 6;

  // Android only
  OtherAlwaysOnAppError other_always_on_app_error = 8;
  // Android only
  InvalidDnsServersError invalid_dns_servers_error = 9;
  // Android only
  InvalidIpv6Config invalid_ipv6_config_error = 10;
  // TUNNEL_PARAMETER_ERROR + WARREN_PUBKEY_MISMATCH: detail for the UI modal.
  optional WarrenPubkeyMismatchDetail warren_pubkey_mismatch_detail = 11;
}

message TunnelState {
  message Disconnected {
    GeoIpLocation disconnected_location = 1;
    bool locked_down = 2;
  }
  message Connecting {
    TunnelStateRelayInfo relay_info = 1;
    FeatureIndicators feature_indicators = 2;
  }
  message Connected {
    TunnelStateRelayInfo relay_info = 1;
    FeatureIndicators feature_indicators = 2;
  }
  message Disconnecting { AfterDisconnect after_disconnect = 1; }
  message Error { ErrorState error_state = 1; }

  oneof state {
    Disconnected disconnected = 1;
    Connecting connecting = 2;
    Connected connected = 3;
    Disconnecting disconnecting = 4;
    Error error = 5;
  }
}

message TunnelStateRelayInfo {
  TunnelEndpoint tunnel_endpoint = 1;
  GeoIpLocation location = 2;
}

// Which tunneling technology backs a TunnelEndpoint.
enum TunnelType {
  WIREGUARD = 0;
  WARREN = 1;
}

message TunnelEndpoint {
  string address = 1;
  TransportProtocol protocol = 2;
  bool quantum_resistant = 3;
  ObfuscationInfo obfuscation = 4;
  Endpoint entry_endpoint = 5;
  TunnelMetadata tunnel_metadata = 6;
  bool daita = 7;
  // The tunneling technology used for this endpoint (default = WIREGUARD for backward compat).
  TunnelType tunnel_type = 8;
}

message FeatureIndicators { repeated FeatureIndicator active_features = 1; }

enum FeatureIndicator {
  QUANTUM_RESISTANCE = 0;
  MULTIHOP = 1;
  SPLIT_TUNNELING = 2;
  LOCKDOWN_MODE = 3;
  WIREGUARD_PORT = 4;
  UDP_2_TCP = 5;
  SHADOWSOCKS = 6;
  QUIC = 7;
  LWO = 8;
  LAN_SHARING = 9;
  DNS_CONTENT_BLOCKERS = 10;
  CUSTOM_DNS = 11;
  SERVER_IP_OVERRIDE = 12;
  CUSTOM_MTU = 13;
  DAITA = 14;
  DAITA_MULTIHOP = 15;
  ALLOW_EXTERNAL_DNS = 16;
}

message ObfuscationInfo {
  oneof type {
    ObfuscationEndpoint single = 1;
    MultiplexObfuscation multiple = 2;
  }
}

message MultiplexObfuscation {
  // optional direct endpoint
  Endpoint direct = 1;
  repeated ObfuscationEndpoint obfuscators = 2;
}

message ObfuscationEndpoint {
  enum ObfuscationType {
    UDP2TCP = 0;
    SHADOWSOCKS = 1;
    QUIC = 2;
    LWO = 3;
  }

  Endpoint endpoint = 1;
  ObfuscationType obfuscation_type = 2;
}

message Endpoint {
  string address = 1;
  TransportProtocol protocol = 2;
}

message GeoIpLocation {
  optional string ipv4 = 1;
  optional string ipv6 = 2;
  string country = 3;
  optional string city = 4;
  double latitude = 5;
  double longitude = 6;
  bool mullvad_exit_ip = 7;
  optional string hostname = 8;
  optional string entry_hostname = 10;
  optional string obfuscator_hostname = 11;
}

message TunnelMetadata { string tunnel_interface = 1; }

enum Ownership {
  ANY = 0;
  MULLVAD_OWNED = 1;
  RENTED = 2;
}

message LocationConstraint {
  // When a LocationConstraint is constructed, the inner `type` value MUST NOT be null.
  oneof type {
    string custom_list = 1;
    GeographicLocationConstraint location = 2;
  }
}

message GeographicLocationConstraint {
  string country = 1;
  optional string city = 2;
  optional string hostname = 3;
}

// TODO: Rename to "CensorshipCircumventionSettings"?
message ObfuscationSettings {
  enum SelectedObfuscation {
    AUTO = 0;
    OFF = 1;
    WIREGUARD_PORT = 2;
    UDP2TCP = 3;
    SHADOWSOCKS = 4;
    QUIC = 5;
    LWO = 6;
  }
  message Udp2TcpObfuscation { optional uint32 port = 1; }
  message Shadowsocks { optional uint32 port = 1; }
  message WireguardPort { optional uint32 port = 1; }
  message Lwo { optional uint32 port = 1; }
  SelectedObfuscation selected_obfuscation = 1;
  Udp2TcpObfuscation udp2tcp = 2;
  Shadowsocks shadowsocks = 3;
  WireguardPort wireguard_port = 4;
  Lwo lwo = 5;
}

message CustomList {
  string id = 1;
  string name = 2;
  repeated GeographicLocationConstraint locations = 3;
}

message NewCustomList {
  string name = 1;
  repeated GeographicLocationConstraint locations = 2;
}

message CustomListSettings { repeated CustomList custom_lists = 1; }

message Socks5Local {
  string remote_ip = 1;
  uint32 remote_port = 2;
  TransportProtocol remote_transport_protocol = 3;
  uint32 local_port = 4;
}
message SocksAuth {
  string username = 1;
  string password = 2;
}
message Socks5Remote {
  string ip = 1;
  uint32 port = 2;
  SocksAuth auth = 3;
}
message Shadowsocks {
  string ip = 1;
  uint32 port = 2;
  string password = 3;
  string cipher = 4;
}

message CustomProxy {
  oneof proxy_method {
    Socks5Local socks5local = 1;
    Socks5Remote socks5remote = 2;
    Shadowsocks shadowsocks = 3;
  }
}

message AccessMethod {
  message Direct {}
  message Bridges {}
  message EncryptedDnsProxy {}
  message DomainFronting {}
  oneof access_method {
    Direct direct = 1;
    Bridges bridges = 2;
    EncryptedDnsProxy encrypted_dns_proxy = 3;
    CustomProxy custom = 4;
    DomainFronting domain_fronting = 5;
  }
}

message AccessMethodSetting {
  UUID id = 1;
  string name = 2;
  bool enabled = 3;
  AccessMethod access_method = 4;
}

