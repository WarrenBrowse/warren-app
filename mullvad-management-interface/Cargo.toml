[package]
name = "mullvad-management-interface"
edition.workspace = true
rust-version.workspace = true
description = "Mullvad VPN IPC. Contains types and functions for IPC clients and servers."
repository.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
hyper-util = { workspace = true }
log = { workspace = true }
mullvad-paths = { path = "../mullvad-paths" }
mullvad-types = { path = "../mullvad-types" }
prost = { workspace = true }
prost-types = { workspace = true }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tipsy = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tonic = { workspace = true }
tower = { workspace = true }
vec1 = { workspace = true }
# The wallet's port-forward standing travels on the wire as the model the
# daemon and the mobile FFI crates share.
warren-standing = { path = "../warren-standing" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[build-dependencies]
tonic-build = { workspace = true, default-features = false, features = [
  "prost",
  "transport"
] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }

# The cross-environment ownership gate asks the Windows security descriptor
# who owns a named pipe, which is the same query `pipeIsAdminOwned` runs in
# the desktop main process.
[target.'cfg(windows)'.dependencies]
talpid-windows = { path = "../talpid-windows" }

# The server side of the management pipe: its security descriptor, and the
# client token each connection is authorized against.
[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[lints]
workspace = true
