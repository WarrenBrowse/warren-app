[package]
name = "warren-forum"
edition.workspace = true
rust-version.workspace = true
description = "Shared community-forum wallet-login logic for the Warren mobile FFI crates (warren-jni, warren-ios)"
repository.workspace = true
license.workspace = true

# Pure, host-tested logic shared by the Android (`warren-jni`) and iOS
# (`warren-ios`) forum-login FFI. No platform deps: it takes an ed25519
# `SigningKey` (each FFI derives it from its own secret store) and returns the
# transport-agnostic request bytes, so both platforms single-source the wire
# format + validation + outcome mapping instead of duplicating them.
[dependencies]
warren-identity = { path = "../../warren-sdk-rs/crates/warren-identity" }
# The broadcast activity digest is signed by the server key and verified with
# the contract's own routine, so a badge can only ever come from a document the
# pinned key signed.
warren-discovery-core = { path = "../../warren-contract/warren-discovery" }
# A rejected digest is accounted for in the platform log, never silently.
log = { workspace = true }
# The connect host every signed request goes to and the forum origin a topic
# link may name are rows of the product table, not constants of this crate.
warren-product-env = { path = "../warren-product-env" }
# 16 bytes of OS entropy for the request nonce (the one call site that mints its
# own nonce; the warren-api client nonces internally for every other call).
getrandom = "0.2"
# The in-app report body is assembled and serialised once here, so the signed
# bytes are the sent bytes; the identity an approved login returns is read the
# same way on both platforms.
serde_json = { workspace = true }
base64 = "0.22"
# The connect host's `Date` header is the trusted clock a skewed device
# corrects itself against before signing.
httpdate = "1"
# The completion code of a bound login approval, and the handoff URL that
# carries it, are live credentials until the session ends.
zeroize = { workspace = true }

[dev-dependencies]
# Wire-parity test: reconstruct the SHA-256 body hash and verify the signature
# against the canonical POST message warren-identity builds.
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true
