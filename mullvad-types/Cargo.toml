[package]
name = "mullvad-types"
edition.workspace = true
rust-version.workspace = true
description = "Common base data structures for Mullvad VPN client"
repository.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
clap = { workspace = true, optional = true }
either = "1.11"
# Warren fork: `WarrenPubKey` validates an SS58 address (prefix 13295,
# `wb…`). Uses the shared `warren-contract` codec crate directly - the
# single source of truth for the codec, also re-exported as
# `warren_identity::ss58` on the backend. No duplicated checksum logic.
warren-contract = { path = "../../warren-contract" }
intersection-derive = { path = "intersection-derive" }
ipnetwork = { workspace = true }
log = { workspace = true }
mullvad-version = { path = "../mullvad-version", features = ["serde"] }
regex = "1"
serde = { workspace = true, features = ["derive"] }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
uuid = { version = "1.4.1", features = ["serde", "v4"] }
vec1 = { workspace = true }

[dev-dependencies]
# Warren fork - Phase 2.B: serde_json for the serde vector tests of
# `WarrenPubKey` (transparent JSON).
serde_json = { workspace = true }

[lints]
workspace = true
