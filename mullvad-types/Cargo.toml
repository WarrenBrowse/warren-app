[package]
name = "mullvad-types"
edition.workspace = true
rust-version.workspace = true
description = "Common base data structures for Mullvad VPN client"
repository.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
clap = { workspace = true, optional = true }
either = "1.11"
# Warren fork — Phase 2.B : `WarrenPubKey` newtype valide une chaîne hex
# 64 chars représentant une pubkey Ed25519 (32 octets). Aligne sur la
# version utilisée par `mullvad-api/src/warren_auth.rs`.
hex = "0.4"
intersection-derive = { path = "intersection-derive" }
ipnetwork = { workspace = true }
log = { workspace = true }
mullvad-version = { path = "../mullvad-version", features = ["serde"] }
regex = "1"
serde = { workspace = true, features = ["derive"] }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
uuid = { version = "1.4.1", features = ["serde", "v4"] }
vec1 = { workspace = true }

[dev-dependencies]
# Warren fork — Phase 2.B : serde_json pour les vector tests serde
# de `WarrenPubKey` (transparent JSON).
serde_json = { workspace = true }

[lints]
workspace = true
