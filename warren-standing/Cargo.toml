[package]
name = "warren-standing"
edition.workspace = true
rust-version.workspace = true
description = "Port-forward abuse standing of a Warren wallet as the clients see it: strikes, ban, and which strikes the user was already told about"
repository.workspace = true
license.workspace = true

# Pure, host-tested logic shared by the desktop daemon and the mobile FFI
# crates (warren-jni, warren-ios), the same shape as `warren-incidents`: no
# platform deps and no transport. It turns the standing endpoint and the
# issuer's ban refusal into one model (warren-core doc 105 §5.3, §5.4), decides
# which strikes are new to this device, and names the tunnel error a ban maps
# to, so the three clients cannot disagree on when to warn and when to block.
[dependencies]
warren-api = { path = "../../warren-sdk-rs/crates/warren-api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
thiserror = { workspace = true }

[lints]
workspace = true
