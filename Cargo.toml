[workspace]
resolver = "2"
members = [
  "android/translations-converter",
  "desktop/packages/nseventforwarder",
  "desktop/packages/windows-utils",
  "installer-downloader",
  "mullvad-api",
  "mullvad-cli",
  "mullvad-daemon",
  "mullvad-encrypted-dns-proxy",
  "mullvad-exclude",
  "mullvad-fs",
  "warren-ios",
  "mullvad-leak-checker",
  "mullvad-logging",
  "mullvad-management-interface",
  "mullvad-nsis",
  "mullvad-paths",
  "mullvad-problem-report",
  "mullvad-relay-selector",
  "mullvad-release-android",
  "mullvad-setup",
  "mullvad-types",
  "mullvad-types/intersection-derive",
  "mullvad-update",
  "mullvad-update/mullvad-release",
  "mullvad-version",
  "talpid-core",
  "talpid-dbus",
  "talpid-dns",
  "talpid-future",
  "talpid-macos",
  "talpid-net",
  "talpid-platform-metadata",
  "talpid-routing",
  "talpid-time",
  "talpid-tunnel",
  "talpid-warren-tunnel",
  "talpid-windows",
  "warren-jni",
  "windows-installer",
]
exclude = ["ci/ios/test-router/raas"]
# Default members dictate what is built when running `cargo build` in the root directory.
# This is set to a minimal set of packages to speed up the build process and avoid building
# crates which might not compile without additional input, such as the `windows-installer` crate.
# To build or test everything, add `--workspace` to your cargo commands.
default-members = [
  "mullvad-cli",
  "mullvad-daemon",
  "mullvad-problem-report",
  "mullvad-version"
]

[workspace.package]
edition = "2024"
# Must be less than or equal to `channel` in `rust-toolchain.toml`
rust-version = "1.95.0"
repository = "https://github.com/mullvad/mullvadvpn-app/"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.11.1"
chrono = { version = "0.4.26", default-features = false }
clap = { version = "4.4.18", features = ["cargo", "derive"] }
ctrlc = "3.5"
dirs = "6.0.0"
either = "1.15.0"
futures = "0.3.15"
hickory-proto = "0.26.1"
hickory-resolver = "0.26.1"
hickory-server = { version = "0.26.1", features = ["resolver"] }
hyper-util = { version = "0.1.8", features = [
  "client",
  "client-legacy",
  "http1",
  "http2",
] }
insta = { version = "1.42", features = ["yaml"] }
ipnetwork = "0.21.1"
itertools = "0.14"
log = "0.4"
mockito = "1.7.2"
netlink-packet-core = "0.8.1"
netlink-packet-route = "0.30.0"
netlink-proto = "0.12.0"
netlink-sys = "0.8.8"
nix = "0.31.2"
once_cell = "1.16"
pnet_packet = "0.35.0"
proptest = "1.9"
prost = "0.13.3"
prost-types = "0.13.3"
rand = "0.9.3"
reqwest = { version = "0.12.23", default-features = false, features = [
  "rustls-tls"
] }
rtnetlink = "0.21.0"
rustls = { version = "0.23", default-features = false }
rustls-pki-types = "1.13.1"
serde = "1.0.204"
serde_json = "1.0.122"
sha2 = "0.10"
shadowsocks = { version = "1.23.2", default-features = false, features = [
  "aead-cipher",
  "stream-cipher",
] }
shadowsocks-crypto = { version = "0.6.2", features = ["v1-stream"] }
socket2 = "0.5.7"
strum = { version = "0.27" }
surge-ping = "0.8.4"
talpid-dbus = { path = "./talpid-dbus" }
thiserror = "2.0"
tipsy = "0.7.0"
tokio = { version = "1.44" }
tokio-util = "0.7"
tonic = "0.13.1"
tonic-build = { version = "0.13.1", default-features = false }
tower = { version = "0.5.1", features = ["util"] }
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tun = { version = "0.5.5", features = ["async"] }
vec1 = "1.12"
webpki-roots = "1.0.4"
widestring = "1.2"
windows = "0.62.2"
windows-sys = "0.61.2"
winreg = "0.55"
wmi = "0.18.1"
# We cannot use zerocopy "0.8.32" or above due to https://github.com/google/zerocopy/issues/2880
# TODO: Update the version when the issue is resolved
zerocopy = "=0.8.31"
zeroize = "1.8.2"

[workspace.lints.clippy]
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
borrow_as_ptr = "warn"
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unicode_not_nfc = "warn"
unused_async = "deny"
wildcard_dependencies = "deny"

# Keep all lints in sync with `test/Cargo.toml`
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
# Easy to read style and opinionated best practices
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "deny"
missing_abi = "deny"
# Security
non_ascii_idents = "forbid"
# Deny old style Rust
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "warn"
# The `class!` macro in `objc` uses an unknown feature. We rely on this in 'installer-downloader'.
# The unexpected cfg warning stems from https://github.com/SSheldon/rust-objc/issues/125
# We need to ignore this until cacao migrates to another objc implementation,
# or we use another `msg_send!` macro ourselves.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("cargo-clippy"))'
] }
unused_lifetimes = "warn"
unused_macro_rules = "warn"

# Configuration for the helper tool https://crates.io/crates/cargo-shear
[workspace.metadata.cargo-shear]
# The way prost is only used by generated code makes it really hard for dependency
# usage checkers to see that it's not unused
ignored = ["prost"]

# Warren consumes the local quinn fork that lives in warren-core
# (`vendor/quinn-fork/`). Rebased 2026-06 onto upstream 0.11.x tip +
# quinn-udp 0.6.1 (quinn 0.11.10 / quinn-proto 0.11.14-warren.3 / quinn-udp
# 0.6.1): GSO patch (MAX_TRANSMIT_DATAGRAMS 20→80, MAX_TRANSMIT_SEGMENTS
# 10→40, ~25% more downlink), obfuscation knobs, socket-buffer sizing on
# unix + windows, the GHSA-6xvm-j4wr-6v98 DoS fix, and the quinn-udp 0.6.1
# dlsym Apple fast path / per-socket Windows GSO sizing. quinn-udp resolves
# transitively through the quinn path dep. The fork is gitignored in
# warren-core and seeded via `bench/scripts/setup-quinn-fork.sh`; this
# path-dep ties warren-app's resolution to it. The required warren-core SHA
# is pinned in `.warren-core-version` at the repo root.
[patch.crates-io]
quinn = { path = "../warren-core/vendor/quinn-fork/quinn" }
quinn-proto = { path = "../warren-core/vendor/quinn-fork/quinn-proto" }
# warren-tunnel/-client/-relay depend on quinn-udp directly (not only through
# quinn), so without this patch they resolve the unpatched crates.io copy and
# miss the fork's dlsym Apple fast path and per-socket Windows GSO sizing.
quinn-udp = { path = "../warren-core/vendor/quinn-fork/quinn-udp" }

[profile.release]
opt-level = "s"
strip = true
lto = true

# Selectively optimize packages where we know it makes a difference
[profile.release.package]
quinn.opt-level = 3
quinn-proto.opt-level = 3
quinn-udp.opt-level = 3
ring.opt-level = 3
# Warren data plane: these crates move every packet, so build them at opt-level
# 3 even though the workspace default is size-first ("s").
warren-tunnel.opt-level = 3
warren-client.opt-level = 3
warrenguard-relay.opt-level = 3
warrenguard-multihop.opt-level = 3
warrenguard-wire.opt-level = 3
warrenguard-tls.opt-level = 3
chacha20poly1305.opt-level = 3
hpke.opt-level = 3

[profile.release-debuginfo]
inherits = "release"
debug = true
strip = false
lto = "thin"
