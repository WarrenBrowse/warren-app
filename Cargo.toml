[workspace]
resolver = "2"
members = [
  "android/translations-converter",
  "desktop/packages/nseventforwarder",
  "desktop/packages/windows-utils",
  "installer-downloader",
  "mullvad-api",
  "mullvad-cli",
  "mullvad-daemon",
  "mullvad-encrypted-dns-proxy",
  "mullvad-exclude",
  "mullvad-fs",
  "warren-ios",
  "mullvad-leak-checker",
  "mullvad-logging",
  "mullvad-management-interface",
  "mullvad-nsis",
  "mullvad-paths",
  "mullvad-problem-report",
  "mullvad-relay-selector",
  "mullvad-release-android",
  "mullvad-setup",
  "mullvad-types",
  "mullvad-types/intersection-derive",
  "mullvad-update",
  "mullvad-update/mullvad-release",
  "mullvad-version",
  "talpid-core",
  "talpid-dbus",
  "talpid-dns",
  "talpid-future",
  "talpid-macos",
  "talpid-net",
  "talpid-platform-metadata",
  "talpid-routing",
  "talpid-time",
  "talpid-tunnel",
  "talpid-warren-tunnel",
  "talpid-windows",
  "warren-jni",
  "windows-installer",
]
exclude = ["ci/ios/test-router/raas"]
# Default members dictate what is built when running `cargo build` in the root directory.
# This is set to a minimal set of packages to speed up the build process and avoid building
# crates which might not compile without additional input, such as the `windows-installer` crate.
# To build or test everything, add `--workspace` to your cargo commands.
default-members = [
  "mullvad-cli",
  "mullvad-daemon",
  "mullvad-problem-report",
  "mullvad-version"
]

[workspace.package]
edition = "2024"
# Must be less than or equal to `channel` in `rust-toolchain.toml`
rust-version = "1.95.0"
repository = "https://github.com/mullvad/mullvadvpn-app/"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.11.1"
chrono = { version = "0.4.26", default-features = false }
clap = { version = "4.4.18", features = ["cargo", "derive"] }
ctrlc = "3.5"
dirs = "6.0.0"
either = "1.15.0"
futures = "0.3.15"
hickory-proto = "0.26.1"
hickory-resolver = "0.26.1"
hickory-server = { version = "0.26.1", features = ["resolver"] }
hyper-util = { version = "0.1.8", features = [
  "client",
  "client-legacy",
  "http1",
  "http2",
] }
insta = { version = "1.42", features = ["yaml"] }
ipnetwork = "0.21.1"
itertools = "0.14"
log = "0.4"
mockito = "1.7.2"
netlink-packet-core = "0.8.1"
netlink-packet-route = "0.30.0"
netlink-proto = "0.12.0"
netlink-sys = "0.8.8"
nix = "0.31.2"
once_cell = "1.16"
pnet_packet = "0.35.0"
proptest = "1.9"
prost = "0.13.3"
prost-types = "0.13.3"
rand = "0.9.3"
reqwest = { version = "0.12.23", default-features = false, features = [
  "rustls-tls"
] }
rtnetlink = "0.21.0"
rustls = { version = "0.23", default-features = false }
rustls-pki-types = "1.13.1"
serde = "1.0.204"
serde_json = "1.0.122"
sha2 = "0.10"
shadowsocks = { version = "1.23.2", default-features = false, features = [
  "aead-cipher",
  "stream-cipher",
] }
shadowsocks-crypto = { version = "0.6.2", features = ["v1-stream"] }
socket2 = "0.5.7"
strum = { version = "0.27" }
surge-ping = "0.8.4"
talpid-dbus = { path = "./talpid-dbus" }
thiserror = "2.0"
tipsy = "0.7.0"
tokio = { version = "1.44" }
tokio-util = "0.7"
tonic = "0.13.1"
tonic-build = { version = "0.13.1", default-features = false }
tower = { version = "0.5.1", features = ["util"] }
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tun = { version = "0.5.5", features = ["async"] }
vec1 = "1.12"
webpki-roots = "1.0.4"
widestring = "1.2"
windows = "0.62.2"
windows-sys = "0.61.2"
winreg = "0.55"
wmi = "0.18.1"
# We cannot use zerocopy "0.8.32" or above due to https://github.com/google/zerocopy/issues/2880
# TODO: Update the version when the issue is resolved
zerocopy = "=0.8.31"
zeroize = "1.8.2"

[workspace.lints.clippy]
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
borrow_as_ptr = "warn"
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unicode_not_nfc = "warn"
unused_async = "deny"
wildcard_dependencies = "deny"

# Keep all lints in sync with `test/Cargo.toml`
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
# Easy to read style and opinionated best practices
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "deny"
missing_abi = "deny"
# Security
non_ascii_idents = "forbid"
# Deny old style Rust
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "warn"
# The `class!` macro in `objc` uses an unknown feature. We rely on this in 'installer-downloader'.
# The unexpected cfg warning stems from https://github.com/SSheldon/rust-objc/issues/125
# We need to ignore this until cacao migrates to another objc implementation,
# or we use another `msg_send!` macro ourselves.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("cargo-clippy"))'
] }
unused_lifetimes = "warn"
unused_macro_rules = "warn"

# Configuration for the helper tool https://crates.io/crates/cargo-shear
[workspace.metadata.cargo-shear]
# The way prost is only used by generated code makes it really hard for dependency
# usage checkers to see that it's not unused
ignored = ["prost"]

# Warren consumes the published warren-quinn fork (WarrenBrowse/warren-quinn),
# pinned by tag. It carries the GSO transmit constants (MAX_TRANSMIT_DATAGRAMS
# 20 to 80, MAX_TRANSMIT_SEGMENTS 10 to 40, ~25% more downlink), the
# Initial-fragmentation obfuscation knobs, socket-buffer sizing on unix +
# windows, the GHSA-6xvm-j4wr-6v98 DoS fix, and the quinn-udp dlsym Apple fast
# path / per-socket Windows GSO sizing. The crates are renamed (warren-quinn /
# -proto / -udp) but their lib names stay quinn/quinn_proto/quinn_udp, so every
# `use quinn` and the mullvad-logging crate-name filters are unchanged. This is
# the same fork warren-core and warrenguard consume; the patch unifies the
# transitive graph onto it (no vendored tree, no setup script).
[patch.crates-io]
quinn = { git = "ssh://git@github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.15-fork.6", package = "warren-quinn" }
quinn-proto = { git = "ssh://git@github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.15-fork.6", package = "warren-quinn-proto" }
# warrenguard-transport/-relay depend on quinn-udp directly (not only through
# quinn), so it is patched too. Lib names stay quinn/quinn_proto/quinn_udp, so
# every `use quinn` and the mullvad-logging crate-name filters are unchanged.
quinn-udp = { git = "ssh://git@github.com/WarrenBrowse/warren-quinn.git", tag = "v0.11.15-fork.6", package = "warren-quinn-udp" }

# warren-sdk-rs's own crates (consumed as path-deps below, e.g. warren-identity)
# pin `warrenguard-*` as git deps in their OWN workspace, redirected to their
# `../warrenguard` sibling via a `[patch]` in warren-sdk-rs's root Cargo.toml.
# That patch is scoped to warren-sdk-rs's own workspace resolution and does NOT
# apply here (this is a different Cargo workspace), so without this mirror
# patch the SDK crates would pull a second, independently-versioned copy of
# the engine from git instead of this repo's own `../warrenguard` sibling
# (pinned in `.warrenguard-version`), diverging from the copy every other
# warren-app crate consumes by path. Keep this patch's rev/path pattern in
# sync with warren-sdk-rs/Cargo.toml's own patch section.
[patch."https://github.com/WarrenBrowse/warrenguard.git"]
warrenguard-wire = { path = "../warrenguard/crates/warrenguard-wire" }
warrenguard-identity = { path = "../warrenguard/crates/warrenguard-identity" }
warrenguard-multihop = { path = "../warrenguard/crates/warrenguard-multihop" }
warrenguard-daita = { path = "../warrenguard/crates/warrenguard-daita" }
warrenguard-tls = { path = "../warrenguard/crates/warrenguard-tls" }
warrenguard-natpmp-protocol = { path = "../warrenguard/crates/warrenguard-natpmp-protocol" }
warrenguard-backoff = { path = "../warrenguard/crates/warrenguard-backoff" }
warrenguard-transport = { path = "../warrenguard/crates/warrenguard-transport" }
warrenguard-transport-core = { path = "../warrenguard/crates/warrenguard-transport-core" }
warrenguard-config = { path = "../warrenguard/crates/warrenguard-config" }

# The SDK (warren-api/-identity/-discovery) declares warren-contract as a
# git-dep so it self-resolves for downstream consumers with no sibling; here we
# override it to the local checkout, matching the path-deps mullvad-types and
# the daemon already use, so warren-contract stays a single unified package.
[patch."https://github.com/WarrenBrowse/warren-contract.git"]
warren-contract = { path = "../warren-contract" }
warren-discovery-core = { path = "../warren-contract/warren-discovery" }

[profile.release]
opt-level = "s"
strip = true
lto = true

# Selectively optimize packages where we know it makes a difference
[profile.release.package]
quinn.opt-level = 3
quinn-proto.opt-level = 3
quinn-udp.opt-level = 3
ring.opt-level = 3
# Warren data plane: these crates move every packet, so build them at opt-level
# 3 even though the workspace default is size-first ("s").
warrenguard-transport.opt-level = 3
warrenguard-transport-core.opt-level = 3
warrenguard-pump.opt-level = 3
warrenguard-relay.opt-level = 3
warrenguard-multihop.opt-level = 3
warrenguard-wire.opt-level = 3
warrenguard-tls.opt-level = 3
chacha20poly1305.opt-level = 3
hpke.opt-level = 3

[profile.release-debuginfo]
inherits = "release"
debug = true
strip = false
lto = "thin"
